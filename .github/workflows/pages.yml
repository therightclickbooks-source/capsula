name: Pubblica Zenith su GitHub Pages
on:
  push:
    branches: [ "claude/recovery-capsule-guide-it-bk223y" ]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      # GitHub a volte non «vede» subito il pacchetto appena caricato e la
      # pubblicazione si ferma con «No artifacts named github-pages»: si aspetta un poco
      - run: sleep 20
      - id: deployment
        uses: actions/deploy-pages@v4
