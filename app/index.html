/* ---------- MOTORE PROTOCOLLI ---------- */
function buildProtocol(client, quiz){
  const an = client.anamnesi || {};
  const st = idoneita(client);
  const firstTime = DB.sessions.filter(s=>s.clientId===client.id).length === 0;
  const soft = (st==='cert');
  const m = Object.assign({intensita:3,fourD:3,airbag:3,calore:true,ioni:false,zerog:true,timer:20,plantari:2,polpacci:2}, client.macro||{});
  let S = {...m};
  const cal = (client.cal|0);   /* taratura personale: costruita dai feedback di fine seduta */
  let prog=null, fam='Z8', why=[];
  let manualRef = null;

  const zones = quiz.zones || [];
  const has = z => zones.includes(z);
  const painZone = has('dorsale') || has('lombare') || has('glutei') || has('cervicale');

  const now = new Date().getHours();
  const when = quiz.when || (now<12?'mattina': now<16?'pranzo':'sera');

  /* 1. prima sessione → profilo di benvenuto */
  if (firstTime){
    prog = (client.anamnesi && client.anamnesi.prefIntensita==='deciso') ? 'P01' : 'P22';
    fam='Z1';
    S.timer=15; S.intensita=Math.min(S.intensita,2); S.fourD=Math.min(S.fourD,2); S.airbag=Math.min(S.airbag,2);
    why.push('Prima sessione in capsula: si parte dolcemente per far conoscere ogni sensazione.');
  }
  /* 2. sollievo mirato / zone di tensione — attiva anche la rifinitura manuale */
  else if (quiz.goal==='sollievo' || (painZone && quiz.goal!=='drenaggio' && quiz.goal!=='energia')){
    if (has('glutei') && !has('dorsale')){ prog='P05'; fam='Z4'; why.push('La tensione parte da glutei e zona lombare: si lavora all\'origine.');
      manualRef = {zona:'glutei/zona lombare bassa', tecnica:'Kneading (impastamento)', tkey:'KNEADING', larghezza:'media', wkey:'W_MEDIUM'}; }
    else if (has('cervicale') && !has('dorsale') && !has('lombare')){ prog = quiz.activity==='riposo' ? 'P13':'P03'; fam='Z5'; why.push('Focus su collo, trapezi e spalle, le zone indicate come tese.');
      manualRef = {zona:'trapezi e base del collo', tecnica:'Shiatsu (digitopressione)', tkey:'SHIATSU', larghezza:'media', wkey:'W_MEDIUM'}; }
    else if (has('braccia') && !painZone){ prog='P09'; fam='Z5'; why.push('Parte alta al centro: braccia e spalle indicate come zone del giorno.'); }
    else { prog='P04'; fam='Z4'; why.push('Programma dedicato al tratto dorso-lombare con calore attivo.');
      manualRef = {zona: has('lombare')&&!has('dorsale') ? 'zona lombare' : 'tratto dorso-lombare', tecnica:'Kneading (impastamento)', tkey:'KNEADING', larghezza:'stretta (paravertebrali)', wkey:'W_NARROW'}; }
    S.intensita=Math.min(S.intensita, 3); S.calore = !an.caloreSensibile;
    if (manualRef) why.push('Rifinitura manuale inclusa: a metà sessione si lavora sul punto esatto ('+manualRef.zona+') con tecnica '+manualRef.tecnica+'.');
  }
  /* 3. attività di oggi */
  else if (quiz.activity==='ems'){
    if (has('braccia') && !has('gambe')){ prog='P09'; fam='Z2'; why.push('EMS sulla parte alta: recupero mirato di spalle, dorso e braccia.'); }
    else { prog = quiz.mood==='dolorante' ? 'P07' : 'P21'; fam='Z2';
      why.push(quiz.mood==='dolorante' ? 'DOMS da EMS: manovre lente e profonde anti-indolenzimento.' : 'Dopo l\'EMS il recupero è parte del metodo: defaticamento completo.'); }
  }
  else if (quiz.activity==='ems2'){
    if (quiz.mood==='dolorante'){ prog='P07'; fam='Z2'; why.push('EMS2 con muscoli indolenziti: prima si sciolgono le contrazioni dell\'elettrostimolazione, poi si alleggeriscono le gambe della camminata.'); }
    else if (quiz.prefSoloAria){ prog='P23'; fam='Z3'; why.push('Dopo EMS2 (elettrostimolazione in camminata): compressione pura, senza rulli, per far defluire il carico dalle gambe.'); }
    else if (quiz.goal==='recupero' && !has('gambe')){ prog='P21'; fam='Z2'; why.push('EMS2 con obiettivo recupero: defaticamento completo di tutti i gruppi che l\'elettrostimolazione ha fatto contrarre.'); }
    else { prog='P08'; fam='Z3'; why.push('Dopo EMS2: gambe e piedi al centro, perché la camminata sotto elettrostimolazione è dove hanno lavorato di più.'); }
    S.zerog=true; S.airbag=Math.max(S.airbag,4); S.plantari=Math.max(S.plantari,2); S.polpacci=Math.max(S.polpacci,2);
  }
  else if (quiz.activity==='vacufit'){
    fam='Z3';
    if (client.genere==='F' && (quiz.goal==='relax'||quiz.goal==='drenaggio')) { prog='P02'; why.push('Percorso Queen Bodycare: completa il lavoro drenante del Vacutherm con manovre avvolgenti.'); }
    else if (quiz.prefSoloAria){ prog='P23'; why.push('Solo compressione d\'aria: effetto pressoterapia senza rulli.'); }
    else { prog='P08'; why.push('Gambe e piedi al centro: prolunga l\'effetto leggerezza del Vacutherm.'); }
    S.zerog=true; S.airbag=Math.max(S.airbag,4); S.plantari=Math.max(S.plantari,2); S.polpacci=Math.max(S.polpacci,2);
  }
  else if (quiz.activity==='matrix'){
    fam='Z2';
    if (has('gambe')||has('glutei')){ prog='P10'; why.push('Leg day: tutto il lavoro sulla parte bassa.'); }
    else if (has('braccia')){ prog='P09'; why.push('Upper day: recupero mirato della parte alta.'); }
    else if (quiz.goal==='relax'){ prog='P12'; fam='Z8'; why.push('Total body + relax: stile Thai SPA, allunga e distende.'); }
    else { prog='P21'; why.push('Allenamento completo in sala: defaticamento da professionisti.'); }
  }
  /* 4. obiettivi senza allenamento */
  if (!prog){
    if (quiz.goal==='drenaggio' || has('gambe') || has('piedi')){ prog = quiz.prefSoloAria?'P23':'P08'; fam='Z3'; S.zerog=true; S.airbag=Math.max(S.airbag,4); why.push('Obiettivo leggerezza: compressione a onde e rulli plantari.'); }
    else if (quiz.goal==='sonno' || (when==='sera' && quiz.goal==='relax')){ prog = quiz.mood==='stressato'?'P17':'P18'; fam='Z6'; S.ioni=true; S.intensita=Math.min(S.intensita,2); why.push('Rituale serale: prepara il corpo al sonno.'); }
    else if (quiz.goal==='relax'){ prog = when==='pranzo'?'P16':(quiz.mood==='stressato'?'P19':'P11'); fam = when==='pranzo'?'Z8':'Z6'; S.ioni=true; why.push('Decompressione: trattamento lento e atmosfera rilassante.'); }
    else if (quiz.goal==='energia'){ prog='P15'; fam='Z7'; S.zerog=false; S.plantari=3; why.push('Ritmo tonificante che accende corpo e circolazione.'); }
  }
  /* 5. fallback benessere */
  if (!prog){ prog = quiz.mood==='sereno' ? 'P14':'P01'; fam='Z8'; why.push('Riequilibrio completo dalla nuca ai piedi.'); }

  /* 6. preferenza «solo compressione d'aria» — ha SEMPRE la precedenza: nessun rullo */
  let soloAria = false, soloAriaConflitto = false;
  if (quiz.prefSoloAria){
    soloAria = true;
    if (prog!=='P23' && (manualRef || quiz.goal==='sollievo')) soloAriaConflitto = true;
    prog='P23'; fam='Z3'; manualRef=null;
    S.plantari=0; S.polpacci=0;                 // solo aria: nessun rullo (né schiena né piedi)
    S.zerog=true; S.airbag=Math.max(S.airbag,4);
    why.push('💨 Preferenza «solo compressione d\'aria» applicata: P23 Airbag Massage, effetto pressoterapia — nessun rullo.');
    if (soloAriaConflitto) why.push('⚠️ Nota: era stato chiesto un lavoro mirato che di norma usa i rulli. Con «solo aria» quel lavoro coi rulli non viene eseguito: se serve la schiena coi rulli, disattiva l\'interruttore.');
  }

  /* pressione desiderata oggi (Q5 — assente alla prima sessione) */
  let press = quiz.pressione;
  if (press==='abituale'){
    const hab = habitualPressure(client.id) || 'media';
    press = hab==='media' ? null : hab;
    why.push('Applicata la sua pressione abituale ('+hab+'), ricavata dalle ultime sessioni.');
  }
  if (press==='dolce'){ S.intensita=Math.max(0,S.intensita-1); S.fourD=Math.max(0,S.fourD-1); why.push('Pressione alleggerita: oggi ha chiesto un tocco più dolce.'); }
  if (press==='decisa'){ S.intensita=Math.min(6,S.intensita+1); S.fourD=Math.min(6,S.fourD+1); why.push('Pressione aumentata di un livello: oggi vuole sentire il lavoro in profondità.'); }

  /* taratura personale — ricavata da come sono andate le sedute precedenti */
  if (cal !== 0 && !firstTime){
    S.intensita = Math.max(0, Math.min(6, S.intensita + cal));
    S.fourD     = Math.max(0, Math.min(6, S.fourD + cal));
    why.push('🎚️ Taratura personale applicata ('+(cal>0?'+':'')+cal+' livell'+(Math.abs(cal)>1?'i':'o')+'): '+
      (cal<0 ? 'a fine seduta aveva riferito che era troppo forte.' : 'a fine seduta aveva riferito che era troppo leggera.'));
  }

  /* vincoli anamnesi */
  if (an.caloreSensibile){ S.calore=false; why.push('Calore disattivato: sensibilità dichiarata in anamnesi.'); }
  if (soft){ S.intensita=Math.min(S.intensita,2); S.fourD=Math.min(S.fourD,2); S.airbag=Math.min(S.airbag,3); why.push('Profilo soft: idoneità con certificato medico.'); }
  if (zones.length>1){
    const labels = {cervicale:'collo/spalle', braccia:'braccia', dorsale:'dorsale', lombare:'lombare', glutei:'glutei', gambe:'gambe', piedi:'piedi'};
    why.push('Zone selezionate oggi: '+zones.map(z=>labels[z]||z).join(', ')+' — la prima guida il programma, le altre si rifiniscono con airbag e regolazioni.');
  }
  const zoneTese = (an.zone||[]);
  if (zoneTese.length) why.push('Zone segnalate in anamnesi: '+zoneTese.join(', ')+' — chiedi conferma della pressione durante la sessione.');

  /* musica */
  let mus = 'Soothing';
  if (fam==='Z2') mus='Mindful';
  if (fam==='Z3') mus='Soothing';
  if (fam==='Z6') mus= (quiz.goal==='sonno'||when==='sera') ? 'Sweet':'Mental';
  if (fam==='Z7') mus= quiz.mood==='carico' ? 'Motivation':'Morning';
  if (fam==='Z1') mus='Mindful';
  if (quiz.mood==='stressato' && fam!=='Z7') mus='Mental';
  S.musica = mus;

  /* ---- Durata consigliata per tipo di protocollo (l'operatore può sempre cambiarla) ---- */
  if (firstTime){
    S.timer = 15; /* la prima volta resta sempre una prova breve di 15′ */
  } else {
    let rec = 20, dwhy = 'Durata standard di 20 minuti.';
    if (fam==='Z7'){ rec = 15; dwhy = 'Energia: sessione breve e tonificante di 15 minuti — di più smorzerebbe l\'effetto sveglia.'; }
    else if (fam==='Z6'){ rec = quiz.goal==='sonno' ? 30 : 25; dwhy = 'Relax/sonno: sessione lunga di '+rec+' minuti — il rilassamento profondo ha bisogno di tempo.'; }
    else if (fam==='Z2'){ rec = 25; dwhy = 'Recupero post-allenamento: 25 minuti per un defaticamento completo dei gruppi muscolari.'; }
    else if (fam==='Z3'){ rec = 25; dwhy = 'Drenaggio: 25 minuti — la compressione a onde dà il meglio con la durata.'; }
    else if (fam==='Z4' || fam==='Z5'){ rec = 20; dwhy = 'Sollievo mirato: 20 minuti concentrati sulla zona.'; }
    /* rispetta un timer più lungo eventualmente già scelto nei macro-parametri del cliente */
    S.timer = rec; /* la durata del protocollo comanda; l'operatore può regolarla dai passi guidati */
    why.push(dwhy);
  }

  const zCode = zCodeOf(fam, prog, S);
  return { prog, fam, S, why, zCode, manualRef, soloAria, soloAriaConflitto, cal, calTuned: !!client.calTuned };
}
function zCodeOf(fam, prog, S){
  return `${fam}·${prog}·I${S.intensita}D${S.fourD}A${S.airbag}${S.calore?'C':''}${S.zerog?'G':''}`;
}

/* ---------- passi guidati con schermate ---------- */
function buildSteps(prot){
  const {prog, S} = prot;
  prot.quizZones = prot.quizZones || (typeof quizState!=='undefined' && quizState.zones ? quizState.zones : []);
  const steps = [];
  const P = PROGRAMS[prog];

  steps.push({img:'home', kind:'start', title:'START SEDUTA — Health Check d\'ingresso',
    markers:[{pos:TILE.home.HEALTH, label:'Dalla Home tocca “Health Check”: indice sul sensore del bracciolo destro, mano rilassata, respiro regolare, senza premere. Pochi secondi.'}],
    extra: HC_START_EXTRA + `<div class="hcflag" id="startflag"><div class="pl"><b>🟢 START — misura d'ingresso effettuata</b><small>flagga appena fatto: valori letti ad alta voce col cliente. È necessario per sbloccare il setup.</small></div><div class="sw" id="hcin" onclick="flagStart()"></div></div><div class="hcskip" id="startskip">test non possibile? <a href="#" onclick="askReason('in'); return false">indica il motivo per sbloccare</a></div>`});

  if (prog==='P01' || prog==='P02'){
    steps.push({img:'home', title:'Dalla Home della capsula, avvia il programma',
      markers:[{pos:TILE.home[prog], label:`Tocca “${P.o}”`}]});
  } else {
    steps.push({img:'home', title:'Dalla Home, apri l\'elenco dei programmi',
      markers:[{pos:TILE.home.MORE, label:'Tocca “More Auto Mode”'}]});
    const scr = PROGRAM_SCREEN[prog];
    const swipe = scr==='modes1' ? '' : scr==='modes2' ? ' (scorri alla 2ª schermata)' : ' (scorri alla 3ª schermata)';
    steps.push({img:scr, title:`Scegli il programma${swipe}`,
      markers:[{pos:TILE[scr][prog], label:`Tocca “${P.o}” (programma ${prog})`}]});
  }

  const am = [];
  am.push({pos:TILE.auto.FOURD_P, type:'set', label:`Profondità 4D → porta il valore a ${S.fourD} (tocca 4D+/4D−)`});
  am.push({pos:TILE.auto.AIR_P, type:'set', label:`Forza airbag → porta il valore a ${S.airbag} (Airbag strength +/−)`});
  if (S.calore) am.push({pos:TILE.auto.HEAT, label:'Attiva “Heating” (calore lombare)'});
  if (S.ioni) am.push({pos:TILE.auto.ION, label:'Attiva “Negative Ion”'});
  am.push({pos:TILE.auto.TIME, type:'set', label: S.timer===20
    ? `Timer: verifica che “Time” segni 20 min (è il valore di default della capsula). Se il cliente precedente l'ha cambiato e mostra altro, riportalo a 20.`
    : `Timer: tocca “Time” e portalo a ${S.timer} min (di default la capsula parte da 20).`});
  if (S.zerog) am.push({pos:TILE.auto.ZEROG, label:'Attiva Zero Gravity (icona a destra)'});
  else am.push({pos:TILE.auto.BACK_UP, label:'Niente zero gravity: postura attiva, schienale più alto se serve'});
  if (S.polpacci>0) am.push({pos:TILE.auto.CALF_KN, type:'set', label:`“Calf Kneading” → attiva e porta la frizione polpacci a ${S.polpacci}`});
  if (S.plantari>0) am.push({pos:TILE.auto.FOOT, type:'set', label:`“Foot Roller” → attiva e porta i rulli plantari a ${S.plantari}`});
  steps.push({img:'auto', title:'Regola i parametri sulla schermata del programma', markers:am});

  const zsel = (prot.quizZones||[]);
  if ((zsel.includes('braccia') || zsel.length>1) && prog!=='P23'){
    /* mappa zona → icona esagonale (posizione x sul touchscreen) */
    const ICON = { piedi:{x:8.5,n:'piedi'}, gambe:{x:29.5,n:'gambe'}, vita:{x:50,n:'vita/fianchi'}, braccia:{x:70.5,n:'braccia'}, spalle:{x:91.5,n:'spalle'} };
    const z2i = {cervicale:'spalle', braccia:'braccia', dorsale:'vita', lombare:'vita', glutei:'vita', gambe:'gambe', piedi:'piedi'};
    const icons = [...new Set(zsel.map(z=>z2i[z]).filter(Boolean))];
    const mk = icons.map(k=>({pos:[ICON[k].x,80], label:`Tocca l'icona “${ICON[k].n}” per attivarla — si illumina`}));
    mk.push({pos:[50,38], label:'I numeri attorno alla figura NON sono tasti: indicano solo dove si trova ogni zona sul corpo'});
    steps.push({img:'airbag', kind:'extra', title:'Rifinisci le zone di compressione (per le zone extra scelte)',
      markers: mk,
      extra:'<div class="gnote">Le 5 icone esagonali in basso sono gli interruttori delle zone (da sinistra: piedi · gambe · vita/fianchi · braccia · spalle). <b>Quando attivarla:</b> in qualsiasi momento, anche a programma avviato — le zone si accendono e spengono al volo senza fermare nulla. Consiglio: subito, così il cliente sente la compressione fin dall\'inizio. Forza con “Airbag strength +/−” (0–6).</div>'});
  }

  steps.push({img:'music', title:'Imposta l\'atmosfera sonora',
    markers:[
      {pos:TILE.music[S.musica], label:`Dal menu “Music mode”: scegli “${MUSICS[S.musica]}”`},
      {pos:TILE.music.VOL, type:'set', label:'Volume basso ≈ ⅓ della scala: il numero compare tra i tasti + e − accanto all\'altoparlante. La musica deve accompagnare la voce, mai coprirla'}
    ]});

  if (prog==='P23'){
    steps.push({img:'airbag', title:'Seleziona le zone di compressione',
      markers:[
        {pos:[50,80], label:'Le 5 icone esagonali in basso sono gli INTERRUTTORI delle zone (da sinistra: piedi · gambe · vita/fianchi · braccia · spalle/corpo): tocca quelle desiderate — si illuminano e si possono combinare'},
        {pos:[50,38], label:'I numeri attorno alla figura NON sono tasti: indicano solo la posizione di ogni zona sul corpo'}
      ],
      extra:'<div class="gnote">💨 <b>Il menu Airbag in breve:</b> dalla barra in alto si apre con “Airbag”. Al centro c\'è la figura del corpo con le zone numerate da toccare per attivare/spegnere la compressione; in basso trovi anche calore, timer, ioni, regolazione spalle, frizione polpacci e rulli plantari. La forza della compressione si regola con “Airbag strength +/−” (0–6): a onde, comprime e rilascia come una spremitura dolce verso l\'alto.</div>'});
  }

  if (prot.manualRef){
    const R = prot.manualRef;
    steps.push({img:'manual', kind:'extra', title:`Rifinitura manuale sul punto — ${R.zona}`,
      markers:[
        {pos:TILE.manual.NAV, label:'Dalla barra in alto tocca “Up movement” (modalità manuale della parte alta)'},
        {pos:TILE.manual[R.tkey], label:`Scegli la tecnica “${R.tecnica.split(' ')[0]}” — ${R.tecnica}`},
        {pos:TILE.manual.INT_LOCAL, label:'In “Massage interval adjustment” scegli l\'icona centrale (zona locale): i rulli restano solo sul punto'},
        {pos:TILE.manual.MOVE, type:'set', label:`Con le frecce ▲▼ a sinistra sposta i rulli esattamente su: ${R.zona} (chiedi al cliente «è qui?»)`},
        {pos:TILE.manual[R.wkey], label:`Larghezza rulli: ${R.larghezza}`}
      ],
      extra:'<div class="gnote"><b>Quando attivarla:</b> a metà sessione — orientativamente <b>dal minuto 8 al minuto 13</b> di un programma da 20 (3–5 minuti sul punto, non di più). Poi si torna alla schermata Auto per finire il programma. È la parte “artigianale” della sessione: facoltativa, se il cliente preferisce il solo automatico si salta senza problemi.</div>'});
  }

  steps.push({img:'home', kind:'end', title:'END SEDUTA — Health Check d\'uscita',
    markers:[{pos:TILE.home.HEALTH, label:'A trattamento terminato, prima di far scendere il cliente: di nuovo “Health Check” dalla Home e confronto con i valori d\'ingresso.'}],
    extra: HC_END_EXTRA + `
    <div class="hcflag" id="endflag"><div class="pl"><b>🟠 END — misura d'uscita effettuata</b><small>«hai fatto il test di uscita?» — flagga dopo il confronto a voce. Necessario per registrare la sessione.</small></div><div class="sw" id="hcout" onclick="flagEnd()"></div></div><div class="hcskip" id="endskip">test non possibile? <a href="#" onclick="askReason('out'); return false">indica il motivo per sbloccare</a></div>
    <div id="endscripts" style="display:none">
      <div class="hcbox" style="margin-top:10px">
        <div class="hct">Cosa dire adesso, in base al confronto</div>
        <div class="script"><b style="font-style:normal; color:var(--ok)">Se i parametri sono migliorati</b>«Guarda qui: battito giù e fatica rientrata. Questo è quello che Zenith ha fatto per te oggi — immagina con la costanza.»</div>
        <div class="script"><b style="font-style:normal; color:#d4af37">Se sono rimasti pressoché uguali</b>«Valori stabili: il corpo ha mantenuto il suo equilibrio mentre i muscoli lavoravano in profondità. La sensazione addosso conta quanto i numeri — com'è?»</div>
        <div class="script"><b style="font-style:normal; color:var(--accent-strong)">Se qualche valore è più vivace del previsto</b>«Il corpo oggi ha lavorato davvero in profondità: alcuni valori si assestano nelle ore successive, è il segnale di una sessione che ha smosso. Stasera senti che sonno.»</div>
      </div>
    </div>`});
  return steps;
}

const app = document.getElementById('app');
let VIEW = {name: (DB.codeLock===true ? 'lock' : 'home')};

let quizState = {};
let draftClient = null;

function esc(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg){ const t=document.getElementById('toast'); t.innerHTML=msg; t.style.display='block'; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none', 3200); }
let NAV = [];
function go(name, data={}){
  if (VIEW.name && VIEW.name!=='lock' && VIEW.name!==name) NAV.push({...VIEW});
  if (NAV.length>25) NAV.shift();
  VIEW={name,...data}; render(); window.scrollTo(0,0); try{ pokeMascot(); }catch(e){}
}
function goBack(){
  const prev = NAV.pop();
  VIEW = prev || {name:'home'};
  render(); window.scrollTo(0,0);
}
function initials(c){ return (c.nome[0]||'')+(c.cognome[0]||''); }
function fmtBirth(iso){
  if(!iso) return '';
  const m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? `${m[3]}/${m[2]}/${m[1]}` : iso;
}
function fmtDate(iso){ const d=new Date(iso); return d.toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit',year:'numeric'})+' '+d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

function topbar(title, backTo){
  return `<div class="topbar">
    ${backTo?`<button class="btn-back" onclick="goBack()">‹ Indietro</button>`:`<div class="brand">${logoIMG(126)}</div>`}

  <div class="banner" id="storagebanner">⚠ Salvataggio locale non disponibile in questa anteprima: i dati restano solo finché la pagina è aperta.</div>`;

/* Il codice si controlla da solo appena e' completo: le caselle vuote dicono
   quante cifre mancano, quindi non serve nessun tasto di conferma. */
function pinKey(n){
  const L = codeLen();
  if(pinBuf.length>=L) return;
  pinBuf += n;
  if(pinBuf.length===L){
    if(hash(pinBuf)===DB.codeHash){ pinBuf=''; NAV=[]; go('home'); toast('Benvenuto in Zenith Copilot'); }
    else { pinBuf=''; toast('Codice errato'); render(); }
  } else render();
}
function pinClear(){ pinBuf=''; render(); }
function pinDel(){ pinBuf=pinBuf.slice(0,-1); render(); }

/* Le risposte giuste non svelano il vecchio codice: ne fanno scegliere uno
   nuovo. Un codice che ricompare in chiaro sullo schermo e' un codice che
   chiunque passi di li' puo' leggere. */
function tryRecover(){
  const answers = DB.secQ.map((x,i)=>document.getElementById('ra'+i).value);
  const ok = DB.secQ.every((x,i)=>hash(normA(answers[i]))===x.aHash);
  const box = document.getElementById('recresult');
  if (!ok){ box.innerHTML = '<div class="call red" style="margin-top:16px"><b class="tt">Risposte non corrette</b>Le maiuscole non contano, gli spazi nemmeno. Controlla e riprova.</div>'; return; }
  box.innerHTML = `<div class="call ok" style="margin-top:16px; text-align:left">
    <b class="tt">✓ Identità confermata</b>
    Scegli adesso il nuovo <b>Codice Zenith</b>: da 4 a 8 cifre. Sarà quello di tutta l'app.
    <div style="display:flex; gap:10px; margin-top:12px"><input type="password" id="recpin" maxlength="8" inputmode="numeric" placeholder="nuovo codice">
    <button class="btn" onclick="recoverSetCode()">Salva</button></div>
  </div>`;
}
function recoverSetCode(){
  const v = document.getElementById('recpin').value;
  if(!/^\d{4,8}$/.test(v)){ toast('Il codice deve avere da 4 a 8 cifre'); return; }
  DB.codeHash = hash(v); DB.codeLen = v.length; persist();
  toast('Codice aggiornato ✓ — entra con il nuovo codice');
  pinBuf=''; NAV=[]; go('lock');
}

/* ---------- I TRE NUMERI DELLA HOME ----------
   Non fotografie del passato ma cose su cui si può agire adesso:
   quante sedute oggi, quanto è completo il rituale, chi va richiamato. */
const RITUALE_FINESTRA = 30;   /* ultime N sedute su cui si calcola la percentuale */
const RICHIAMO_GIORNI  = 14;   /* oltre questi giorni un cliente è «da richiamare» */

function statSedute(){
  const oggi = new Date().toDateString();
  return DB.sessions.filter(s=>new Date(s.date).toDateString()===oggi).length;
}
function statRituale(){
  const ultime = DB.sessions.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,RITUALE_FINESTRA);
  if(!ultime.length) return null;
  const completi = ultime.filter(s=>s.healthIn && s.healthOut).length;
  return {pct: Math.round(completi/ultime.length*100), su: ultime.length, completi};
}
function clientiDaRichiamare(){
  const soglia = Date.now() - RICHIAMO_GIORNI*864e5;
  return DB.clients.filter(c=>{
    const ss = DB.sessions.filter(s=>s.clientId===c.id);
    if(!ss.length){
      /* mai entrato in capsula: lo segnalo solo se la scheda non è appena stata creata */
      const a = c.anamnesi && c.anamnesi.aggiornata;
      return a ? (+new Date(a) < soglia) : false;
    }
    return Math.max(...ss.map(s=>+new Date(s.date))) < soglia;
  });
}
/* lo storico aperto gia sulle sedute di oggi, col tasto Oggi acceso */
function apriOggi(){ go('history', {fdate: dayKey(new Date().toISOString())}); }
function homeStats(){
  const sedute = statSedute();
  const rit = statRituale();
  const rich = clientiDaRichiamare().length;
  const ritCls = !rit ? 'neutro' : rit.pct>=90 ? 'buono' : rit.pct>=60 ? 'medio' : 'basso';
  const richCls = rich===0 ? 'buono' : rich<=3 ? 'medio' : 'basso';
  return `
    <div class="stat st-sedute" onclick="apriOggi()">
      <div class="ic">${icon('cal',20)}</div>
      <div class="n">${sedute}</div>
      <div class="l">Sedute oggi<small>tocca per vederle</small></div>
    </div>
    <div class="stat st-rit ${ritCls}" onclick="go('stats',{period:30, mira:'hc'})">
      <div class="ic">${icon('heart',20)}</div>
      <div class="n">${rit ? rit.pct+'<small>%</small>' : '—'}</div>
      <div class="l">Rituale completo<small>ultime ${rit ? rit.su : RITUALE_FINESTRA} sedute</small></div>

}

/* preferite del cliente, dalla piu recente */
function clientFavs(c){
  return DB.sessions.filter(x=>x.clientId===c.id && x.fav && !isFirstSession(x))
                    .sort((a,b)=>b.date.localeCompare(a.date));
}
function favLine(f){
  const nome = (PROGRAMS[f.prog]||{}).o || f.prog;
  const giorno = new Date(f.date).toLocaleDateString('it-IT',{day:'numeric', month:'long', year:'numeric'});
  return esc(f.favNote ? nome+' — '+f.favNote : nome+' · '+giorno);
}
/* striscia oro: il corpo apre l'elenco, la freccia sfoglia le preferite a rotazione */
function favStrip(c){
  const favs = clientFavs(c);
  if(!favs.length) return '';
  const i = Math.min(VIEW.favIdx|0, favs.length-1);
  const piu = favs.length>1;
  return `<div class="favstrip" id="favstrip" onclick="apriSeduta('${favs[i].id}')">
    <span class="fsic">★</span>
    <span class="fsx"><b>${favs.length} sedut${piu?'e':'a'} preferit${piu?'e':'a'}</b>
    <small id="favtx">${favLine(favs[i])}</small></span>
    ${piu?`<span class="fscount" id="favn">${i+1} di ${favs.length}</span>`:''}
    <span class="fsgo${piu?' tap':''}"${piu?` onclick="favNext('${c.id}', event)" title="Vedi la preferita successiva"`:''}>›</span>
  </div>`;
}
/* Dalla striscia oro si va alla seduta esatta nell'archivio, che si mette in evidenza. */
function apriSeduta(sid){
  NAV = [{name:'home'}];
  VIEW = {name:'history', fdate:null, evidenzia:sid};
  render(); window.scrollTo(0,0);
}
function evidenziaSeduta(){
  const sid = VIEW.evidenzia; if(!sid) return;
  requestAnimationFrame(()=>{
    const el = document.querySelector('.sessrow[data-sid="'+sid+'"]');
    if(!el) return;
    el.scrollIntoView({block:'center', behavior:'smooth'});
    el.classList.add('battito');
    setTimeout(()=>{ el.classList.remove('battito'); }, 2600);
    VIEW.evidenzia = null;
  });
}
function favNext(id, ev){
  if(ev) ev.stopPropagation();
  const c = DB.clients.find(x=>x.id===id); if(!c) return;
  const favs = clientFavs(c); if(favs.length<2) return;
  VIEW.favIdx = ((VIEW.favIdx|0) + 1) % favs.length;
  const tx = document.getElementById('favtx'), n = document.getElementById('favn');
  const strip = document.getElementById('favstrip');
  if(!tx) return;
  /* cambia anche la destinazione del tocco, non solo il testo */
  if(strip) strip.setAttribute('onclick', "apriSeduta('"+favs[VIEW.favIdx].id+"')");
  tx.style.opacity = '0';
  setTimeout(()=>{
    tx.innerHTML = favLine(favs[VIEW.favIdx]);
    if(n) n.textContent = (VIEW.favIdx+1)+' di '+favs.length;
    tx.style.opacity = '1';
  }, 150);
}

/* stato dell'anamnesi in una riga sola, con la firma */
function anState(c, st, an){
  const firm = an.firma ? `Firmata dal cliente il ${fmtDate(an.firmaData)}` : 'Non ancora firmata dal cliente';
  const OK = ['ok', '✓', 'Nessuna controindicazione dichiarata'];
  const M = {
    ok:      OK,
    cert:    ['warn',   '!', 'Idoneo con certificato medico — profilo soft'],
    blocked: ['danger', '!', 'In attesa del certificato medico'],
    no:      ['danger', '✕', 'Uso della capsula non consentito']
  }[st] || OK;
  return `<div class="anstate ${M[0]}"><span class="asic">${M[1]}</span>
    <span class="asx"><b>${M[2]}</b><small>${firm}</small></span></div>`;

/* le sole risposte che accendono un allarme, con il certificato se serve */
function anFlags(an){
  const a = QA.filter(([k])=>an[k]).map(([k,q])=>`<div class="anrow red"><span class="am">✕</span><span>${q}</span></div>`).join('');
  const b = QB.filter(([k])=>an[k]).map(([k,q])=>`<div class="anrow amb"><span class="am">!</span><span>${q}</span></div>`).join('');
  if(!a && !b) return '';
  const cert = QB.some(([k])=>an[k])
    ? `<div class="anrow ${an.certificatoOk?'':'red'}"><span class="am">${an.certificatoOk?'✓':'✕'}</span>
       <span>Certificato medico: <b style="color:${an.certificatoOk?'var(--ok)':'var(--danger)'}">${an.certificatoOk?'ricevuto':'NON ancora ricevuto'}</b></span></div>`
    : '';
  return `<div class="seclab">Risposte da tenere presenti</div><div class="card">${a}${b}${cert}</div>`;
}
/* i quattro valori che il motore legge a ogni sessione */
function prefCards(c){

    ['🎚️','Pressione preferita', cap(an.prefIntensita), false, 'pressione'],

  ];

      <span class="pc-v">${esc(cap(v))}</span>

function effMacro(c){

const MACHINE = {ems:'EMS', ems2:'EMS2', vacufit:'Vacutherm', matrix:'Matrix', riposo:'Solo capsula'};
function machineBadge(act){

function durChip(s){ const t=(s.settings&&s.settings.timer)||20; return `<span class="chip durc">${t}′</span>`; }
/* disposizione dei dettagli: 'a' righe · 'b' griglia · 'c' pillole */
let SR_STYLE = 'a';
/* come si distingue una seduta preferita nell'elenco: 'a' bordo oro · 'b' fascia in cima · 'c' alone */
let FAV_STYLE = 'a';
/* come si fa notare la nota scritta: 'a' citazione · 'b' riquadro con icona · 'c' testo pieno */
let NOTE_STYLE = 'a';
/* dove stanno cliente e data: 'a' centrati · 'b' su una riga ai lati · 'c' cliente accanto al massaggio */
let SW_STYLE = 'b';
/* come si distinguono i due nomi cliccabili: 'a' pastiglia persona · 'b' maiuscoletto · 'c' icone discrete */
let LK_STYLE = 'a';
/* Simboli disegnati, non emoji: monocromatici, prendono il colore della pastiglia
   e restano identici su qualunque telefono. */
const FEEDBACK = {
  ok:   ['jd-ok',   ()=>icon('check',12),  'Perfetta'],       /* verde   · la spunta        */
  soft: ['jd-soft', ()=>icon('troppo',12), 'Troppo forte'],   /* rosso   · barre che salgono */
  hard: ['jd-hard', ()=>icon('poco',12),   'Troppo leggera'], /* azzurro · barre che scendono*/
};
function fmtLungo(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('it-IT',{day:'numeric', month:'long', year:'numeric'})
       + ' · ' + d.toLocaleTimeString('it-IT',{hour:'2-digit', minute:'2-digit'});
}
function zoneLabel(q){
  if(q.zones && q.zones.length) return q.zones.map(z=>(BODY_ZONES.find(b=>b[0]===z)||[,z])[1]).join(', ');
  if(q.zone==='totale') return 'Total body';
  if(q.zone==='nessuna') return 'Nessuna in particolare';
  return q.zone || '—';
}
/* i giudizi: ognuno con il suo simbolo e il suo colore */
function srGiudizi(s, first){
  const g = [];
  if(first) g.push(['jd-first','🚀','Prima volta']);
  if(s.fav && !first) g.push(['jd-fav','★','Preferita']);
  const f = FEEDBACK[s.feedback];
  if(f) g.push(f);
  /* il simbolo puo essere un disegno (funzione) o un carattere */
  return g.map(([c,i,t])=>[c, typeof i==='function' ? i() : i, t]);
}
function srNoteBox(s, first){
  const g = srGiudizi(s, first);
  const testo = [s.favNote, s.notes].filter(Boolean).join(' · ');
  const nota = testo
    ? (NOTE_STYLE==='a' ? `<div class="sb-tx nt-a">«${esc(testo)}»</div>`
     : NOTE_STYLE==='b' ? `<div class="sb-tx nt-b"><span class="nt-ic">${icon('info',13)}</span><span>${esc(testo)}</span></div>`
     : `<div class="sb-tx nt-c">${esc(testo)}</div>`)
    : `<div class="sb-tx vuoto">Nessuna nota</div>`;
  return `<div class="srbox srnote">
    <div class="sb-lab">Note e giudizi</div>
    ${g.length?`<div class="jdrow">${g.map(([c,i,t])=>`<span class="jd ${c}"><i>${i}</i>${t}</span>`).join('')}</div>`:''}
    ${nota}
  </div>`;
}
/* prima lettera maiuscola: «relax» diventa «Relax» */
function cap(v){ const t = String(v==null?'':v).trim(); return t ? t[0].toUpperCase()+t.slice(1) : '—'; }
function srDettagli(s){
  const fam = ZFAM[s.fam] || {name:'—'};
  const q = s.quiz || {};
  /* Health Check: verde se il rituale e completo, rosso se ne manca un pezzo */
  const completo = s.healthIn && s.healthOut;
  const hc = `<span class="hcv ${completo?'ok':'ko'}">${s.healthIn?'IN ✓':'IN –'} · ${s.healthOut?'OUT ✓':'OUT –'}</span>`;
  const D = [
    ['Famiglia',     cap(fam.name),      false],
    ['Zone',         cap(zoneLabel(q)),  false],
    ['Obiettivo',    cap(q.goal),        false],
    ['Umore',        cap(q.mood),        false],
    ['Pressione',    cap(q.pressione),   false],
    ['Health Check', hc,                 true ],
    ['Punti',        '+' + (s.points || 10), false],
  ];
  const val = (v, raw) => raw ? v : esc(String(v));
  let corpo;
  if(SR_STYLE === 'b'){
    corpo = `<div class="sd-grid">${D.map(([k,v,r])=>
      `<div class="sd-c"><span class="sd-k">${k}</span><span class="sd-v">${val(v,r)}</span></div>`).join('')}</div>`;
  } else if(SR_STYLE === 'c'){
    corpo = `<div class="sd-chips">${D.map(([k,v,r])=>
      `<span class="sd-p"><b>${k}</b>${val(v,r)}</span>`).join('')}</div>`;
  } else {
    corpo = `<div class="sd-rows">${D.map(([k,v,r])=>
      `<div class="sd-r"><span class="sd-k">${k}</span><span class="sd-v">${val(v,r)}</span></div>`).join('')}</div>`;
  }
  return `<div class="srbox srdet"><div class="sb-lab">Dettagli della seduta</div>${corpo}</div>`;
}

function srIdentita(s, P, c){

    title="Apri la descrizione del programma">${esc(P.o)}${LK_STYLE==='c'?'<i class="lk-ch">›</i>':''}</button>`;

/* Un solo codice, quindi non c'e' piu' il caso «non l'hai ancora creato»:
   il Codice Zenith esiste sempre, e' lo stesso con cui si apre l'app. */
function askCode(title, message, cb){
  const m = document.getElementById('modal');
  const L = codeLen();
  m.innerHTML = `<div class="mcard">
    <div class="mt">${title}</div>
    <div class="mm">${message}</div>
    <input type="password" id="mcode" inputmode="numeric" maxlength="${L}" placeholder="${'•'.repeat(L)}" autocomplete="off"
      onkeydown="if(event.key==='Enter') confirmCode()">
    <p class="hint" style="text-align:center; margin:-6px 0 12px">È il <b>Codice Zenith</b>, lo stesso con cui si apre l'app</p>
    <div class="mrow">
      <button class="btn sec" onclick="closeModal()">Annulla</button>
      <button class="btn" onclick="confirmCode()">Conferma</button>
    </div></div>`;
  m.classList.add('open');
  m._cb = cb;
  setTimeout(()=>{ const i=document.getElementById('mcode'); if(i) i.focus(); }, 50);
}
function closeModal(){ const m=document.getElementById('modal'); m.classList.remove('open'); m._cb=null; m.innerHTML=''; }
function confirmCode(){
  const m = document.getElementById('modal');
  const v = document.getElementById('mcode').value;
  if(hash(v) === DB.codeHash){ const cb = m._cb; closeModal(); cb(); }
  else { document.getElementById('mcode').value=''; toast('Codice errato'); }
}
function delClient(id){
  const c = DB.clients.find(x=>x.id===id);
  const n = DB.sessions.filter(s=>s.clientId===id).length;
  askCode('Eliminare questa anagrafica?',
    `Stai per eliminare <b>${esc(c.nome)} ${esc(c.cognome)}</b> con ${n} sessioni e tutti i suoi punti. Operazione irreversibile: inserisci il Codice Zenith.`,
    ()=>{ DB.clients = DB.clients.filter(x=>x.id!==id);
          DB.sessions = DB.sessions.filter(s=>s.clientId!==id);
          persist(); toast('Anagrafica eliminata');
          NAV = [{name:'home'}]; VIEW = {name:'clients'}; render(); });
}
function delSession(id, ev){
  if(ev) ev.stopPropagation();
  const s = DB.sessions.find(x=>x.id===id);
  const c = DB.clients.find(x=>x.id===s.clientId);

    `Sessione <b>${esc(s.zCode)}</b> di <b>${c?esc(c.nome+' '+c.cognome):'—'}</b> del ${fmtDate(s.date)}. Verranno tolti anche i suoi 10 punti. Inserisci il Codice Zenith.`,
    ()=>{ DB.sessions = DB.sessions.filter(x=>x.id!==id); persist(); toast('Sessione cancellata'); render(); });
}

function titleCase(s){
  return String(s||'').trim().toLowerCase().replace(/(^|[\s'’-])(\S)/g, (m,p,c)=>p+c.toUpperCase());
}
function captureDraftForm(){
  const g = id => { const e=document.getElementById(id); return e ? e.value : null; };

  if (g('f_cognome')!==null) draftClient.cognome = titleCase(g('f_cognome'));
  if (g('f_nascita')!==null) draftClient.nascita = g('f_nascita');
  if (g('f_tel')!==null) draftClient.telefono = g('f_tel').trim();
  if (g('f_note')!==null) draftClient.note = g('f_note').trim();
}
function initSigPad(){
  const cv = document.getElementById('sigpad');
  if (!cv || cv._init) return;
  cv._init = true;
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth, h = cv.clientHeight;
  cv.width = w*dpr; cv.height = h*dpr;
  const ctx = cv.getContext('2d');
  ctx.scale(dpr,dpr);
  ctx.lineWidth = 2.2; ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--text').trim() || '#eae7ee';
  let drawing=false, lx=0, ly=0;
  const pos = e => { const r=cv.getBoundingClientRect(); return [e.clientX-r.left, e.clientY-r.top]; };
  cv.addEventListener('pointerdown', e=>{ e.preventDefault(); drawing=true; [lx,ly]=pos(e); cv.setPointerCapture(e.pointerId); });
  cv.addEventListener('pointermove', e=>{ if(!drawing) return; e.preventDefault(); const [x,y]=pos(e);
    ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(x,y); ctx.stroke(); lx=x; ly=y; SIG_DIRTY=true; });
  const stop = e=>{ drawing=false; };
  cv.addEventListener('pointerup', stop); cv.addEventListener('pointercancel', stop);
}
function clearSig(){
  const cv = document.getElementById('sigpad'); if(!cv) return;
  const ctx = cv.getContext('2d'); ctx.clearRect(0,0,cv.width,cv.height); SIG_DIRTY=false;
}

function ckSort(list){
  return list.slice().sort((a,b)=>{
    const na = DB.sessions.filter(s=>s.clientId===a.id).length;
    const nb = DB.sessions.filter(s=>s.clientId===b.id).length;
    if(nb!==na) return nb-na;   // più sedute in cima, meno sedute in fondo
    return (a.nome+' '+a.cognome).localeCompare(b.nome+' '+b.cognome, 'it', {sensitivity:'base'}); // parità → ordine alfabetico
  });
}

function habitualPressure(clientId){
  const last = DB.sessions.filter(s=>s.clientId===clientId && s.quiz && s.quiz.pressione)
    .sort((a,b)=>b.date.localeCompare(a.date)).slice(0,3)
    .map(s=>{ const p=s.quiz.pressione; return (p==='solito'||p==='media'||p==='abituale')?'media':p; });
  if (last.length < 2) return null;
  for (const v of ['dolce','media','decisa']){
    if (last.filter(x=>x===v).length >= 2) return v;
  }
  return null;
}
function activeQuizSteps(){
  const first = DB.sessions.filter(s=>s.clientId===quizState.clientId).length === 0;
  return first ? QUIZ_STEPS.filter(s=>s.k!=='pressione') : QUIZ_STEPS;
}

    body = `

        return `

        <div class="ztier t2">${['lombare','glutei'].map(zc).join('')}</div>
        <div class="ztier t3">${['gambe','piedi'].map(zc).join('')}</div>`; })()}
      </div>
    </div>
    <div class="zapex">
      <div class="qcard slim ${quizState.zone==='totale'?'on':''}" onclick="zoneQuick('totale')"><div class="qi">🧍</div><div class="ql">Total body</div><div class="qs">tutto il corpo</div></div>
      <div class="qcard slim ${quizState.zone==='nessuna'?'on':''}" onclick="zoneQuick('nessuna')"><div class="qi">✨</div><div class="ql">Nessuna in particolare</div><div class="qs">decide il motore</div></div>
    </div>
    <p class="zhint">Fino a <b>3 zone</b> · la <b>prima</b> guida il programma</p>`;
    nav = `<div class="btnrow qb-nav">
      <button class="btn ghost" onclick="quizBack()">‹ Precedente</button>
      <button class="btn" onclick="zonesNext()" ${quizState.zones.length?'':'disabled'}>Avanti (${quizState.zones.length} zone) ›</button>
    </div>`;
  } else {
    let opts = step.opts;
    if (step.k === 'pressione'){
      const hab = habitualPressure(quizState.clientId);
      const mid = hab
        ? ['abituale','📊',`La sua abituale (${hab})`,'ricavata dalle sue ultime sessioni']
        : ['media','⚖️','Pressione media','la regolazione standard dei suoi parametri'];
      opts = [step.opts[0], step.opts[2], mid]; /* dolce, decisa sopra · mid a tutta larghezza sotto */
    }
    body = `
    <div class="qgrid ${step.layout==='two'?'two':''}">
      ${opts.map(([v,ic,l,s])=>`<div class="qcard ${quizState[step.k]===v?'on':''}" onclick="quizPick('${step.k}','${v}')">
        <div class="qi">${ic}</div><div class="qtx"><div class="ql">${l}</div><div class="qs">${s}</div></div></div>`).join('')}
    </div>
    ${step.k==='activity'?`<div class="qinfo" onclick="openMachines()">${icon('info',15)} Cosa lascia ogni macchinario nel corpo, e cosa fa Zenith</div>`:''}`;
    /* alla prima domanda non c'e' niente da cui tornare indietro: niente riga vuota */
    nav = quizState.step>0
      ? `<div class="btnrow qb-nav"><button class="btn ghost" onclick="quizBack()">‹ Precedente</button></div>`
      : '';
  }
  /* Avanzamento, contatore, domanda, riepilogo e risposte stanno in una scheda sola,
     come i capitoli del resto del gestionale. I due tasti di navigazione restano
     fuori: sono l'azione da fare, non il contenuto della domanda. */
  return topbar(`Sessione di ${esc(c.nome)}`,'checkin') + `
    <div class="qbox">
      <div class="qb-h">
        <div class="qsteps">${STEPS.map((_,i)=>`<i class="${i<quizState.step?'done':i===quizState.step?'now':''}"></i>`).join('')}</div>
        <div class="qcount">Domanda ${quizState.step+1} di ${STEPS.length}</div>
        <div class="qb-dom">${step.t}</div>
        ${quizRecap(STEPS)}
      </div>
      <div class="qb-b">${body}</div>
    </div>
    ${nav}`;
}

function quizRecap(STEPS){
  const chips = STEPS.slice(0, quizState.step).map((st,i)=>{
    let v = '';
    if(st.k==='zones'){
      v = (quizState.zones||[]).map(z=>(BODY_ZONES.find(b=>b[0]===z)||[,z])[1]).join(', ')
          || (quizState.zone==='totale' ? 'Total body' : quizState.zone==='nessuna' ? 'Nessuna' : '');
    } else {
      const o = (st.opts||[]).find(o=>o[0]===quizState[st.k]);
      v = o ? o[2] : '';
    }
    return v ? `<span class="rc" onclick="quizGoto(${i})"><em>${QLBL[st.k]||''}</em>${esc(v)}</span>` : '';
  }).filter(Boolean).join('');
  return chips ? `<div class="qrecap">${chips}</div>` : '';
}
function quizGoto(i){ quizState.step = i; render(); window.scrollTo(0,0); }
function quizPick(k,v){
  quizState[k]=v;
  const STEPS = activeQuizSteps();
  if(quizState.step < STEPS.length-1){ quizState.step++; render(); window.scrollTo(0,0); }
  else go('proposal');
}
function quizBack(){ quizState.step--; render(); }

function confirmSession(){
  if(!HC.outDone){ toast('Completa prima il test d\'uscita 🟠 END (o indica il motivo per sbloccare)'); return; }
  const isRep = !!VIEW.repeat && REPEAT;
  const cId = isRep ? REPEAT.clientId : quizState.clientId;
  const c = DB.clients.find(x=>x.id===cId);
  const beforeLv = clientLevel(clientPoints(c));
  const q = isRep ? (REPEAT.quiz||{}) : quizState;
  const label = isRep
    ? 'ripetizione della sessione del '+new Date(REPEAT.srcDate).toLocaleDateString('it-IT')
    : [
    (q.zones&&q.zones.length) ? 'zone: '+q.zones.join(', ') : (q.zone && q.zone!=='nessuna' ? 'zona '+q.zone : null),
    'obiettivo '+q.goal, 'umore '+q.mood,
    q.pressione && q.pressione!=='solito' && q.pressione!=='media' ? 'pressione '+q.pressione : null
  ].filter(Boolean).join(' · ');
  DB.sessions.push({
    id:uid(), clientId:c.id, date:new Date().toISOString(),
    prog:currentProt.prog, fam:currentProt.fam, zCode:zCodeOf(currentProt.fam,currentProt.prog,currentProt.S),
    settings:{...currentProt.S}, quiz:{...q}, quizLabel:label,
    notes:(document.getElementById('sess_note')||{}).value||'',
    healthIn: HC.inDone && !HC.inReason,
    healthOut: HC.outDone && !HC.outReason,
    hcInSkip: HC.inReason||'', hcOutSkip: HC.outReason||'',
    points:10
  });
  persist();
  const afterPts = clientPoints(c); const afterLv = clientLevel(afterPts);

function clientSessions(id){ return DB.sessions.filter(x=>x.clientId===id); }
function closeEcho(c, fb){
  const cal = c.cal|0;
  if (fb==='ok') return `<div class="call ok" style="margin-top:10px"><b class="tt">Taratura confermata</b>Ottimo: questi sono i suoi valori giusti. Il sistema li <b>mantiene</b> per le prossime sedute.</div>`;
  const dir = fb==='soft' ? 'abbassate' : 'alzate';
  const seg = fb==='soft' ? 'più delicata' : 'più decisa';
  return `<div class="call amb" style="margin-top:10px"><b class="tt">Taratura aggiornata dal sistema</b>
    La prossima seduta di ${esc(c.nome)} partirà <b>${seg}</b>: intensità e profondità sono state <b>${dir}</b> in automatico
    (taratura ora <b>${cal>0?'+':''}${cal}</b>). Lo trovi scritto nel protocollo, non devi ricordartene.</div>`;
}
function setFeedback(sid, fb){
  const s = DB.sessions.find(x=>x.id===sid); if(!s) return;
  const c = DB.clients.find(x=>x.id===s.clientId); if(!c) return;
  const prev = s.feedback||null;
  if (prev===fb) return;
  /* annulla l'effetto del feedback precedente, poi applica il nuovo */
  const delta = f => f==='soft' ? -1 : f==='hard' ? 1 : 0;
  let cal = (c.cal|0) - delta(prev) + delta(fb);
  c.cal = Math.max(-2, Math.min(2, cal));
  c.calTuned = true;
  s.feedback = fb;
  s.feedbackAt = new Date().toISOString();
  persist();
  const box = document.getElementById('fbecho');
  document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('on'));
  const btn = document.querySelector('.fbtn.'+(fb==='soft'?'soft':fb==='hard'?'hard':'ok'));
  if(btn) btn.classList.add('on');
  if(box) box.innerHTML = closeEcho(c, fb);
  toast(fb==='ok' ? '✓ Taratura confermata' : '🎚️ Taratura aggiornata per la prossima seduta');
}
function saveFavNote(sid, v){
  const s = DB.sessions.find(x=>x.id===sid); if(!s) return;
  s.favNote = v.trim(); persist();
}

      <div class="qrow"><span class="qt"><b>La data di nascita</b> si tocca: prima il giorno, poi il mese, poi l'anno. Si aprono dei quadratini con i numeri e si sceglie. Niente da digitare, niente formato da rispettare.</span></div>
      <div class="qrow" style="border-bottom:none"><span class="qt"><b>Il prefisso del telefono</b> si sceglie da un elenco con le bandiere, prima del numero. Per l'Italia è già pronto <b>+39</b>: si cambia solo per una persona straniera.</span></div>
    </div>

    <h3>Seconda parte: il questionario di salute</h3>
    <p class="gp">Sono domande a cui si risponde <b>SÌ</b> o <b>NO</b>. Le fai tu, a voce, e tocchi la risposta.
    Su carta questo foglio si chiama <i>scheda anamnestica</i>: è la stessa cosa.
    Le domande sono divise in due gruppi, e <b>il colore dice tutto</b>:</p>
    <div class="card">
      <div class="qrow"><span class="qt"><b style="color:var(--danger)">Gruppo rosso</b> — un solo <b>SÌ</b> e la capsula <b>non si può usare</b>. Non è una valutazione tua, non si tratta: il gestionale blocca e basta.</span></div>
      <div class="qrow" style="border-bottom:none"><span class="qt"><b style="color:var(--warn)">Gruppo giallo</b> — un <b>SÌ</b> vuol dire che serve il <b>certificato medico</b>. Finché non arriva, la persona resta bloccata. Quando arriva, lo registri nella scheda e il blocco si toglie da solo.</span></div>
    </div>
    <p class="gp">Poi si indicano le <b>zone che le interessano</b> (schiena, gambe, spalle…),
    l'intensità che preferisce e come dorme. Servono al gestionale per scegliere.</p>

    <h3>Terza parte: la firma</h3>
    <p class="gp">La persona firma con il dito, sullo schermo. Da quel momento la scheda
    <b>si blocca</b>: nessuno può più cambiare le risposte.</p>
    <div class="call amb"><b class="tt">Se dopo mesi la salute cambia</b>
      Si riapre: apri la scheda → <b>Sblocca per nuova anamnesi</b>, inserisci il <b>Codice Zenith</b>,
      correggi le risposte e fai <b>rifirmare</b>. La vecchia firma viene tolta:
      una scheda senza firma non vale.</div>

    <h2 data-mira="g5">5 · Una sessione <small>dall'inizio alla fine</small></h2>
    <p class="gp">Questo è il giro che si ripete ogni volta, per ogni persona.
    Dall'inizio alla fine sono <b>dieci passi</b>, e il gestionale te li fa fare uno per schermata:
    non devi ricordarli a memoria.</p>
    <ol class="msteps">
      <li><b>La persona arriva.</b> Se non è mai venuta, prima crea la sua scheda: capitolo 4.</li>
      <li><b>Tocca il ＋ tondo in basso al centro.</b> Si apre il <b>check-in</b>: l'elenco delle persone.
        Cerca il nome e toccalo.</li>
      <li><b>Il gestionale controlla se può entrare.</b> Lo fa da solo, leggendo il questionario.
        Se non può, te lo dice subito e ti spiega perché.</li>
      <li><b>Rispondi alle domande.</b> Sono quattro o cinque, una per schermata:
        cosa ha fatto oggi, dove lo sente, cosa vuole ottenere, come si sente, com'è la pressione.
        <br>Le fai <b>tu</b> alla persona e tocchi la risposta. La stessa persona in giorni diversi
        riceve sessioni diverse: è tutto il senso di queste domande.
        <br>Hai sbagliato a toccare? Tocca <b>‹ Precedente</b>, oppure tocca la risposta già data
        nel riepilogo in alto: torni a quella domanda.</li>
      <li><b>Leggi la proposta.</b> Il gestionale sceglie la sessione e <b>ti spiega perché</b>
        l'ha scelta. Se non ti convince, torni indietro e cambi una risposta.</li>
      <li><b>Imposta la capsula seguendo le foto.</b> Sono le fotografie del touchscreen della capsula
        con sopra dei segni colorati. <b>Come si leggono è spiegato nel capitolo 6</b>: leggilo
        prima della prima sessione vera.</li>
      <li><b>Fai l'Health Check d'ingresso.</b> Sul touchscreen della capsula: <b>START</b>.
        La persona appoggia l'indice sul sensore del bracciolo destro. Capitolo 7.</li>
      <li><b>Parte la sessione.</b> Venti o trenta minuti. Tu resti raggiungibile:
        alla prima volta di una persona, resta accanto alla capsula.</li>
      <li><b>Health Check d'uscita.</b> Finita la sessione, <b>END</b>: si rimisura e si confronta
        con i numeri d'ingresso. È il momento in cui la persona <i>vede</i> quello che ha sentito.</li>
      <li><b>Salva.</b> Tocca <b>OK</b> sul tablet. Data, codice della sessione e note si salvano da soli,
        e la persona guadagna <b>10 punti</b>, che non si perdono mai.
        <br>Se c'è qualcosa da ricordare («preferisce il mattino», «gambe pesanti»), scrivi
        <b>una riga di nota</b> nella sua scheda: la volta dopo vale più di dieci parole.</li>
    </ol>

    <h2 data-mira="g6">6 · Le foto della capsula <small>cerchi rossi, quadrati gialli</small></h2>
    <p class="gp">Questo è il capitolo che permette a chi <b>non ha mai visto la capsula</b> di impostarla
    correttamente al primo colpo. Il gestionale non ti chiede di conoscere la macchina:
    ti mostra <b>la fotografia del suo touchscreen</b> e ti disegna sopra dei segni.
    Devi solo copiare quello che vedi.</p>
    <p class="gp">I segni sono di <b>due tipi</b>, e vogliono dire due cose diverse.
    Confonderli è l'errore più comune del primo giorno:</p>

    <div class="segni">
      <div class="sg">
        <span class="sg-m"><span class="marker"><span class="mn">1</span></span></span>
        <div class="sg-x"><b>● Cerchio rosso — un tasto da toccare</b>
          <small>Sul touchscreen della capsula, in quel punto, c'è un tasto. Toccalo e basta:
          non c'è niente da scegliere e niente da regolare. Nella riga sotto la foto,
          con lo stesso numero, c'è scritto come si chiama quel tasto sulla macchina.</small></div>
      </div>
      <div class="sg">
        <span class="sg-m"><span class="marker sq"><span class="mn">2</span></span></span>
        <div class="sg-x"><b>■ Quadrato giallo — una regolazione</b>
          <small>Qui <b>non</b> si tocca e si va avanti: qui c'è un valore da <b>portare al punto giusto</b>.
          Il quadrato indica il comando che regola quella funzione: una manopola, un cursore, i tasti <b>＋</b> e <b>−</b>.
          Nella riga sotto la foto, con lo stesso numero, c'è scritto <b>a quale valore portarlo</b>.
          Il quadrato dice «regola questo», la riga dice «fino a quanto».</small></div>
      </div>
    </div>

    <h3>I numeri dicono l'ordine</h3>
    <div class="card">
      <div class="qrow"><span class="qt"><b>1, 2, 3…</b> sono <b>l'ordine delle azioni</b>: prima l'1, poi il 2, poi il 3. Non sono valori da impostare e non sono quantità.</span></div>
      <div class="qrow"><span class="qt">Se in una foto c'è <b>un segno solo, senza numero</b>, vuol dire che in quella schermata c'è una cosa sola da fare.</span></div>
      <div class="qrow"><span class="qt"><b>Rispetta l'ordine.</b> Su alcune schermate un tasto compare solo dopo che ne hai toccato un altro: saltando l'ordine non lo trovi e sembra che manchi.</span></div>
      <div class="qrow" style="border-bottom:none"><span class="qt">Sotto ogni foto c'è la <b>legenda</b>: stessa forma, stesso colore, stesso numero del segno sulla foto. Se non riesci a trovare un comando sulla capsula, leggi la legenda: c'è il nome esatto scritto sulla macchina.</span></div>
    </div>
    <div class="call acc"><b class="tt">In una riga</b>
      <b style="color:#ff5f5f">● Rosso = premi.</b> &nbsp;
      <b style="color:#f0a832">■ Giallo = regola,</b> e il valore è scritto nella riga con lo stesso numero.
      &nbsp;<b>I numeri sono l'ordine.</b><br>
      Un esempio vero, con le foto della capsula, è nel capitolo <b>12 · Programma su misura</b>.</div>

    <h2 data-mira="g7">7 · Health Check <small>la misura prima e dopo</small></h2>
    <h3>Cos'è</h3>
    <p class="gp">Nel bracciolo destro della capsula c'è un <b>sensore</b>. La persona ci appoggia sopra
    l'<b>indice</b> per qualche secondo e la capsula legge cinque valori del corpo.
    Si fa <b>due volte</b>: una prima della sessione (<b>START</b>) e una dopo (<b>END</b>).</p>
    <div class="call ok" style="margin-top:6px"><b class="tt">Perché si fa</b>
    La sessione si sente, ma non si vede. Misurando prima e dopo, la sensazione diventa un numero.
    È il numero che fa tornare la persona.</div>

    <h3>Come si fa, passo per passo</h3>
    <ol class="msteps">
      <li>Sul touchscreen della capsula tocca <b>Health Check</b>.</li>
      <li>La persona appoggia <b>l'indice sul sensore del bracciolo destro</b>.
        Mano rilassata, respiro normale, <b>senza premere</b>.</li>
      <li>Aspetta qualche secondo, senza muovere il dito.</li>
      <li>Se il valore sembra sbagliato, tocca <b>Retest</b> e si ripete.</li>
    </ol>
    <p class="hint">Il dito freddo, lo smalto scuro e il dito appoggiato male sono le tre cause
    di quasi tutti i valori strani. Prima di preoccuparsi, si ripete.</p>

    <h3>I cinque valori</h3>
    ${HC_TABLE}

    <h3>Cosa dire alla persona</h3>
    <div class="card">
      <div class="hct">Prima · START</div>
      <div class="script">«Facciamo la tua fotografia d'ingresso. A fine sessione la ripetiamo e confrontiamo.»</div>
      <div class="hct" style="margin-top:12px">Dopo · END</div>
      <div class="script">«Guarda: battito da X a Y, fatica da alta a normale. Questo è quello che Zenith ha fatto per te oggi.»</div>
    </div>
    <div class="call red"><b class="tt">Il limite, e non si discute</b>
      Questi numeri <b>non sono dati medici</b> e non si usano mai per dire a qualcuno cos'ha.
      Servono solo a raccontare, con i suoi numeri, la direzione in cui è andato il suo rilassamento.</div>

    <h2 data-mira="g8">8 · Colori e simboli <small>cosa vuol dire ogni riquadro</small></h2>
    <p class="gp">Nel gestionale il colore di un riquadro dice cos'è <b>prima ancora di leggerlo</b>.
    Sono sempre gli stessi, in ogni schermata:</p>
    <div class="card">
      <div class="qrow"><span class="qt"><b style="color:var(--ok)">Verde ✓</b> — si può fare. Regole e conferme.</span></div>
      <div class="qrow"><span class="qt"><b style="color:var(--warn)">Giallo !</b> — attenzione. Si può fare, ma con cautela o con un documento.</span></div>
      <div class="qrow"><span class="qt"><b style="color:var(--danger)">Rosso ✕</b> — <b>non</b> si fa. Divieti, e cose che non si annullano.</span></div>
      <div class="qrow"><span class="qt"><b style="color:#8fb2c9">Azzurro i</b> — spiegazione tecnica. Utile, non obbligatoria.</span></div>
      <div class="qrow"><span class="qt"><b style="color:#d4af37">Oro ❝</b> — frasi da dire alla persona, e i tasti che spostano tutti i dati.</span></div>
      <div class="qrow" style="border-bottom:none"><span class="qt"><b style="color:var(--accent-strong)">Prugna ✦</b> — motivazione per te, non per il cliente.</span></div>
    </div>
    <p class="gp">Sulle <b>foto della capsula</b> valgono invece i due segni del capitolo 6:</p>
    <div class="card">
      <div class="qrow"><span class="qt"><b style="color:#ff5f5f">● Cerchio rosso</b> — tasto da toccare.</span></div>
      <div class="qrow" style="border-bottom:none"><span class="qt"><b style="color:#f0a832">■ Quadrato giallo</b> — valore da regolare; quanto, è scritto nella riga con lo stesso numero.</span></div>
    </div>

    <h2 data-mira="g9">9 · Le parole <small>glossario</small></h2>
    <p class="gp">Ogni parola che il gestionale usa, spiegata con parole comuni.
    Se ne incontri una che non è qui, non è importante.</p>
    <div class="card">
      <div class="glo">
        <div class="gv"><div class="gw">Scheda</div><div class="gd">la pagina di una persona: dati, questionario di salute, preferenze, sessioni fatte.</div></div>
        <div class="gv"><div class="gw">Questionario<small>di salute</small></div><div class="gd">le domande sulla salute a cui la persona risponde SÌ o NO, e che poi firma. Su carta si chiama <i>scheda anamnestica</i>.</div></div>
        <div class="gv"><div class="gw">Anamnesi</div><div class="gd">la stessa cosa del questionario di salute. È la parola che si usa in ambito sanitario.</div></div>
        <div class="gv"><div class="gw">Check-in</div><div class="gd">l'inizio di una sessione: si sceglie chi entra in capsula. È il tasto <b>＋</b> tondo in basso.</div></div>
        <div class="gv"><div class="gw">Sessione<small>o seduta</small></div><div class="gd">una volta dentro la capsula, dall'inizio alla fine. Sono la stessa cosa.</div></div>
        <div class="gv"><div class="gw">Programma<small>P01 … P24</small></div><div class="gd">il movimento che la capsula esegue. Sono ventiquattro, ognuno con un nome scritto anche sul touchscreen della macchina.</div></div>
        <div class="gv"><div class="gw">Famiglia<small>Z1 … Z9</small></div><div class="gd">il motivo della sessione: recupero, gambe leggere, schiena, sonno… Serve a raggruppare i programmi che servono alla stessa cosa.</div></div>
        <div class="gv"><div class="gw">Codice<small>protocollo</small></div><div class="gd">la targa della sessione: famiglia, programma e tutte le regolazioni in una riga sola. Esempio: <b>Z1·P22·I2D2A2CG</b>. Serve a ripetere identica una sessione riuscita.</div></div>
        <div class="gv"><div class="gw">Codice Zenith</div><div class="gd">l'<b>unico</b> codice del gestionale: apre l'app e conferma ogni cancellazione. Si cambia da ${gear} → <b>Sicurezza</b>.</div></div>
        <div class="gv"><div class="gw">Health Check</div><div class="gd">la misura dei parametri col dito sul sensore, prima e dopo la sessione. Capitolo 7.</div></div>
        <div class="gv"><div class="gw">Macro-parametri</div><div class="gd">i valori di partenza di quella persona (durata, intensità, calore…). Il gestionale li propone, tu li puoi cambiare.</div></div>
        <div class="gv"><div class="gw">Airbag</div><div class="gd">i cuscini gonfiabili della capsula. Sono quelli che stringono le gambe: la parte «pressoterapia».</div></div>
        <div class="gv"><div class="gw">Punti<small>e livelli</small></div><div class="gd">10 punti a sessione, non si azzerano mai. I livelli salgono: Iron → Silver → Gold → Platinum → Diamond.</div></div>
        <div class="gv"><div class="gw">Backup</div><div class="gd">la copia di tutti i dati in un file. Senza, se il dispositivo si rompe non si recupera niente.</div></div>
        <div class="gv"><div class="gw">Slot</div><div class="gd">uno dei 6 spazi liberi nella memoria della capsula dove si può salvare un programma inventato da te. Capitolo 12.</div></div>
      </div>
    </div>

    <h2 data-mira="g10">10 · Se qualcosa va storto <small>i rimedi</small></h2>
    <p class="gp">I casi che capitano davvero, e cosa fare. Uno per riquadro.</p>
    <div class="fix">
      <div class="fx">
        <div class="fq"><span class="fi">!</span>Un valore dell'Health Check è strano.</div>
        <ol class="fs">
          <li><b>Ripeti il test.</b> Dito freddo, smalto scuro o dito appoggiato male sono la causa più comune.</li>
          <li>Se resta strano, fai una <b>sessione leggera</b> e dì: «non è uno strumento medico, se vuoi parlane col tuo medico».</li>
          <li>Se la persona sta anche male, <b>la sessione si rimanda</b>.</li>
        </ol>
        <div class="fw">Mai usare questi numeri come diagnosi.</div>
      </div>
      <div class="fx">
        <div class="fq"><span class="fi">!</span>Il gestionale dice che la persona non può entrare.</div>
        <ol class="fs">
          <li>Apri la sua scheda e guarda il questionario di salute.</li>
          <li><b>Rosso</b> = vietato. Non si discute e non si aggira.</li>
          <li><b>Giallo</b> = serve il <b>certificato medico</b>: quando arriva, registralo nella scheda e il blocco si toglie da solo.</li>
        </ol>
      </div>
      <div class="fx">
        <div class="fq"><span class="fi">!</span>Ho sbagliato una risposta durante le domande.</div>
        <ol class="fs">
          <li>Tocca <b>‹ Precedente</b>.</li>
          <li>Oppure tocca direttamente la risposta già data nel <b>riepilogo in alto</b>: torni a quella domanda.</li>
        </ol>
      </div>
      <div class="fx">
        <div class="fq"><span class="fi">!</span>Ho salvato una sessione sbagliata.</div>
        <ol class="fs">
          <li>${sto} → trova la sessione → tocca l'icona del <b>cestino</b>.</li>
          <li>Inserisci il <b>Codice Zenith</b>. La sessione sparisce e i suoi 10 punti vengono tolti.</li>
        </ol>
      </div>
      <div class="fx">
        <div class="fq"><span class="fi">!</span>Il questionario è firmato ma la salute è cambiata.</div>
        <ol class="fs">
          <li>Apri la scheda → <b>Sblocca per nuova anamnesi</b>.</li>
          <li>Inserisci il <b>Codice Zenith</b>: la firma viene tolta.</li>
          <li>Correggi le risposte e fai fare una <b>nuova firma</b>.</li>
        </ol>
      </div>
      <div class="fx">
        <div class="fq"><span class="fi">!</span>Ho dimenticato il Codice Zenith.</div>
        <ol class="fs">
          <li>Nella schermata di apertura tocca <b>Codice dimenticato?</b></li>
          <li>Rispondi alle tue <b>3 domande</b> di recupero, poi scegli un codice nuovo.</li>
        </ol>
        <div class="fw">Se le 3 domande non erano state impostate non si rientra più: per questo sono il passo 2 del primo giorno.</div>
      </div>
      <div class="fx">
        <div class="fq"><span class="fi">!</span>Devo passare i dati su un altro dispositivo.</div>
        <ol class="fs">
          <li>Sul vecchio: ${gear} → <b>Backup completo (JSON)</b>.</li>
          <li>Sul nuovo: ${gear} → <b>Importa backup</b> e scegli il file.</li>
        </ol>
        <div class="fw">L'importazione <b>sostituisce</b> i dati del dispositivo di destinazione: si fa solo su un tablet vuoto. La guida completa è nella stessa pagina delle Impostazioni.</div>
      </div>
      <div class="fx">
        <div class="fq"><span class="fi">!</span>Il numero della versione è diverso da un altro dispositivo.</div>
        <ol class="fs">
          <li><b>Ricarica la pagina.</b> Il gestionale si aggiorna da solo.</li>
        </ol>
      </div>
    </div>

    <h2 data-mira="g11">11 · Regole d'oro <small>valgono sempre</small></h2>
    <div class="card">
      <div class="gold">
        <div class="gr"><span class="gc">✓</span><span>Una sessione dura al massimo <b>20–30 minuti</b>.</span></div>
        <div class="gr"><span class="gc">✓</span><span>Almeno <b>30 minuti di pausa</b> prima di ripetere sulla stessa zona.</span></div>
        <div class="gr"><span class="gc">✓</span><span>Tasche vuote, niente gioielli, <b>scarpe tolte</b>.</span></div>
        <div class="gr"><span class="gc">✓</span><span>La <b>prima volta</b> di una persona è sempre leggera: ci pensa il gestionale, non forzare.</span></div>
        <div class="gr"><span class="gc">✓</span><span>Se durante la sessione qualcosa non va: <b>si ferma, si parla, si riparte</b>.</span></div>
        <div class="gr"><span class="gc">✓</span><span>Ogni nota che scrivi porta il <b>nome del dispositivo e l'ora</b>: si sa sempre chi ha scritto cosa.</span></div>
        <div class="gz">La capsula è uno strumento di benessere. Non sostituisce mai il parere del medico.</div>
      </div>
    </div>

    <h2 data-mira="g12">12 · Programma su misura <small>per chi è già pratico</small></h2>
    <p class="gp">Serve solo dopo 3–4 sessioni con la stessa persona, quando sai già cosa le piace.
    Il programma si costruisce <b>sulla capsula</b>, non sul tablet, e si salva nella sua memoria
    in uno dei <b>6 spazi liberi</b> (gli <i>slot</i>).</p>
    <p class="hint">Da qui in avanti valgono i segni del capitolo 6:
    <b style="color:#ff5f5f">● rosso premi</b> · <b style="color:#f0a832">■ giallo regola</b> ·
    <b>i numeri sono l'ordine</b>.</p>
    <div class="gstep">
      <div class="gh"><span class="gnum">1</span><span class="gt">Apri l'editor: More Auto Mode → 3ª schermata → “Customised”</span></div>
      <div class="shot"><img src="${IMG.modes3}" alt="Terza schermata dei programmi">
        <div class="marker" style="left:70%; top:70%"></div></div>
      <div class="glegend"><div class="gi"><span class="gn">●</span><span>Tocca “Customised”: si apre la memoria dei 6 slot — tocca “＋” su uno slot libero per creare, o l'icona matita per modificare un programma esistente</span></div></div>
    </div>
    <div class="gstep">
      <div class="gh"><span class="gnum">2</span><span class="gt">Costruisci la sequenza riga per riga</span></div>
      <div class="shot"><img src="${IMG.custom}" alt="Editor del programma personalizzato">
        <div class="marker" style="left:18%; top:63%"><span class="mn">1</span></div>
        <div class="marker" style="left:18%; top:71%"><span class="mn">2</span></div>
        <div class="marker sq" style="left:76%; top:42%"><span class="mn">3</span></div>
        <div class="marker" style="left:60%; top:88%"><span class="mn">4</span></div>
        <div class="marker" style="left:38%; top:88%"><span class="mn">5</span></div>
      </div>
      <div class="glegend">
        <div class="gi"><span class="gn">1</span><span><b>Position</b>: scegli la zona della riga (collo/spalle, dorso, lombare, vita, fianchi, gambe…) — prima le righe della parte alta, poi quelle della parte bassa</span></div>
        <div class="gi"><span class="gn">2</span><span><b>Artifice</b>: scegli la tecnica per quella zona (push, knead, shiatsu, tap, knead-knock, knock, stretching)</span></div>
        <div class="gi"><span class="gn set">3</span><span><b>Set Area</b> a destra — è il <b>quadrato giallo</b>: qui non si preme, si <b>regola</b>. Sposta 4D, forza airbag, intensità, frequenza e larghezza dei rulli per quella riga; da qui si accendono anche leg rub, foot roller e le zone airbag</span></div>
        <div class="gi"><span class="gn">4</span><span><b>Addition</b>: aggiunge la riga successiva della sequenza (ripeti 1→3 per ogni zona che vuoi nel programma)</span></div>
        <div class="gi"><span class="gn">5</span><span><b>Confirmation</b>: salva il programma nello slot — dalla prossima volta parte con un solo tocco</span></div>
      </div>
      <div class="gnote">💡 Consigli: 3–5 righe bastano per un ottimo programma personale · “Emptying” svuota la lista se vuoi ricominciare · “Delete manoeuvre” cancella una riga · annota nell'app (nota cliente) quale slot è suo, es. “Slot 2 = Maria”.</div>
    </div>

    <div class="mindset">
      <div class="mt">Zenith Mindset</div>
      <p>Ogni persona che entra cerca la stessa cosa: <b>stare bene</b>. La capsula è il punto in cui
      l'allenamento diventa risultato e la giornata pesante si scioglie. Se tu per primo credi che questi
      venti minuti siano il momento più prezioso della visita, la persona lo sente dalla tua voce
      prima ancora delle tue parole.</p>
      <p>La capsula ha <b>25,3 milioni di combinazioni</b> possibili. Nessuno riceverà mai due volte
      la stessa sessione, e nessun'altra persona al mondo riceverà la sua.</p>
    </div>

    <h2 data-mira="g13">13 · Frasi pronte <small>da dire alla persona</small></h2>
    <div class="card">
      <div class="pquote"><b>La prima volta</b>«La nostra capsula ha 25,3 milioni di combinazioni possibili: la sessione di oggi è costruita su di te, su come stai adesso. Non esiste un'altra persona al mondo con la tua stessa sessione.»</div>
      <div class="pquote"><b>A chi torna</b>«Il tuo corpo non fa mai due allenamenti uguali: perché dovrebbe ricevere due recuperi uguali? Ogni volta ricalibriamo tutto su come stai oggi.»</div>
      <div class="pquote"><b>Quando mostri il codice</b>«Questo codice è la targa della tua sessione di oggi: unica, tracciata e registrata nel tuo storico.»</div>
      <div class="pquote"><b>Sul perché funziona</b>«Il corpo si abitua a ciò che si ripete: qui non si ripete mai niente. Per questo l'effetto resta forte sessione dopo sessione.»</div>
    </div>

    <button class="gtop" id="gtop" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑ Indice</button>
    <p class="hint pagefoot">Zenith Copilot ${APP_VERSION} · guida all'uso · Zenith Fitness Lab — Fit&amp;Go Pompei</p>`;
}

{t:'Zenith: il prodotto e il mindset', tag:'IL PRODOTTO', lesson:`
  <div class="mindset" style="margin-top:14px">
    <div class="mt">Il manifesto — il benessere senza sudore</div>
    <p>Da sempre lo star bene ha un prezzo: <b>sudore, costanza, sacrificio</b>. La capsula Zenith ribalta la regola: per la prima volta puoi fare qualcosa di profondo per il tuo corpo <b>restando fermo</b>. Con le vite frenetiche che conduciamo, 20 minuti in capsula non sono un lusso: sono <b>manutenzione della persona</b>. E noi siamo <b>i primi ad averla portata in un centro fitness</b>: chi la prova da noi non la trova altrove — è un'esclusività da dire con orgoglio.</p>
  </div>
  <h2>Che cos'è davvero la capsula</h2>
  <div class="card">
    <ul class="tick">
      <li><b>Robot massaggiante 4D su binario SL</b>: segue la curva naturale della colonna, <b>dalla nuca ai glutei</b>.</li>
      <li><b>Compressione ad aria</b> su tutto il corpo, <b>calore in fibra di carbone</b> nella zona lombare, <b>rulli plantari</b> per i piedi.</li>

      <li><b>Musica immersiva</b> e un <b>sensore dei parametri vitali</b> sul bracciolo destro (per l'Health Check).</li>
      <li><b>24 programmi</b> (P01–P24), ognuno regolabile in ogni parametro.</li>

  <div class="card">
    <p style="margin:0 0 8px">La capsula regola <b>dieci parametri indipendenti su 24 programmi</b>: i valori si moltiplicano tra loro. Il conto esatto è <b>7×7×7 × 2×2×2 × 4×4×4 × 6 × 24 = 25.288.704</b> → <b>25,3 milioni di combinazioni</b>.</p>
    <p class="hint" style="margin:0">Per questo <b>il corpo non si assuefà mai</b>: nessuna sessione è mai uguale alla precedente, e la sessione di oggi non esiste identica da nessun'altra parte al mondo.</p>

    <li><b>La capsula NON è un dispositivo medico.</b> È uno strumento di benessere: mai promettere cure, mai fare diagnosi. In caso di dubbio: prima il medico.</li>
  </ol>`,

{t:'Il metodo Copilot: da anamnesi a protocollo', tag:'IL METODO', lesson:`
  <div class="mindset" style="margin-top:14px">
    <div class="mt">La domanda che viene prima di tutte</div>
    <p>La prima domanda non è mai «quale programma?», ma <b>«questa persona può usare Zenith?»</b>. La risposta è nell'<b>anamnesi</b>: si compila alla prima visita, si firma, e <b>dopo la firma si blocca</b> (si modifica solo sbloccandola col codice). Le <b>preferenze</b> invece restano sempre modificabili.</p>
  </div>
  <h2>Il flusso di ogni sessione</h2>
  <ol class="msteps">
    <li><b>Check-in</b>: si seleziona il cliente («chi sta entrando in capsula?»).</li>
    <li><b>Micro-quiz di 5 domande</b>: attività di oggi, zone, obiettivo, umore, pressione desiderata. <b>Alla prima sessione la 5ª domanda non compare</b>: la pressione si impara dalle sessioni successive.</li>
    <li><b>Il motore genera il protocollo</b>: incrocia anamnesi + risposte del giorno e propone famiglia Z, programma, regolazioni e musica — con il <b>perché</b> scritto in chiaro nel riquadro «Perché questo protocollo». L'operatore rifinisce, non inventa.</li>
  </ol>
  <h2>Leggere un codice protocollo</h2>
  <div class="card">
    <p style="margin:0 0 8px">Esempio <b>Z2·P21·I3D3A3CG</b>: famiglia <b>Z</b> (il perché della seduta) · programma <b>P</b> (P01–P24) · <b>I</b> intensità 0–6 · <b>D</b> profondità 4D 0–6 · <b>A</b> forza airbag 0–6 · <b>C</b> calore attivo · <b>G</b> zero gravity attivo (se la lettera manca, è spento).</p>
    <p class="hint" style="margin:0">Le famiglie Z sono <b>9</b>, e la <b>Z1 è il Benvenuto</b>: la prima sessione di ogni cliente è sempre dolce, <b>15 minuti</b>, per far conoscere ogni sensazione.</p>
  </div>
  <h2>Durate e tipo di seduta</h2>
  <div class="card">
    <ul class="tick">
      <li><b>Energia: 15 minuti</b> — di più smorzerebbe l'effetto sveglia. <b>Recupero: 25</b>. <b>Relax e sonno: 25–30</b> — il rilassamento profondo ha bisogno di tempo.</li>
      <li><b>Tipo di seduta</b>: 🌀 <b>Massaggio completo</b> (rulli + aria) oppure 💨 <b>Solo aria</b> → programma <b>P23 Airbag Massage</b>, effetto pressoterapia: <b>nessun rullo</b> — né schiena, né polpacci, né piedi.</li>
      <li>Se il cliente chiede un lavoro mirato coi rulli ma «Solo aria» è attivo, l'app mostra un <b>avviso di conflitto</b>: per i rulli va disattivato l'interruttore.</li>
      <li>Nel quiz si scelgono al massimo <b>3 zone</b>: <b>la prima guida il programma</b>, le altre si rifiniscono con airbag e regolazioni.</li>
    </ul>
  </div>`,

{t:'Il rituale Health Check', tag:'IL RITUALE', lesson:`
  <div class="mindset" style="margin-top:14px">
    <div class="mt">Il beneficio non lo racconti tu: lo leggono i suoi numeri</div>
    <p>Il rituale è ciò che ci distingue: <b>START</b> all'ingresso, <b>END</b> all'uscita. Senza il flag START <b>il setup non si sblocca</b>; senza END non si registra la sessione. Se il test non è possibile, si indica il <b>motivo</b> per sbloccare. Come si fa: <b>dito indice sul sensore del bracciolo destro</b>, mano rilassata, respiro regolare, <b>senza premere</b>.</p>
  </div>
  <h2>I 5 parametri e i loro range</h2>
  <div class="card">
    <ul class="tick">
      <li>❤️ <b>Battito</b>: 60–100/min — dopo la sessione tende a <b>scendere</b> (coi protocolli Energia può restare uguale o salire un po': è normale).</li>
      <li>🫁 <b>Ossigenazione</b>: 95–99% — resta stabile nel range.</li>
      <li>🔄 <b>Microcircolo</b>: sopra 79 — tende a <b>salire</b>: trattamento e calore riattivano la circolazione.</li>
      <li>📈 <b>Variabilità cardiaca</b>: 22–120 ms — misura la <b>capacità di recupero del sistema nervoso</b>; tende a salire.</li>
      <li>⚡ <b>Indice di fatica</b>: atteso in miglioramento verso <b>«Normale»</b>.</li>
    </ul>
  </div>
  <h2>Se qualcosa è fuori range</h2>
  <ol class="msteps">
    <li><b>Fuori range una volta</b>: quasi sempre dito freddo, smalto o posizione sbagliata → si <b>ripete il test</b>.</li>
    <li><b>Fuori range persistente</b>: <b>sessione soft</b> e tono leggero; se c'è anche malessere riferito, <b>si rimanda</b> la sessione suggerendo con delicatezza il medico.</li>
    <li><b>Mai usare i valori come diagnosi o terapia</b>: raccontano solo la direzione del rilassamento.</li>

{t:'La vendita: ascolto, parole, obiezioni', tag:'LA VENDITA', lesson:`
  <div class="mindset" style="margin-top:14px">
    <div class="mt">Ascolta il doppio di quanto parli</div>
    <p>Ogni sessione inizia con <b>«come ti senti oggi?»</b> — e la risposta È la vendita. Prima di proporre, chiedi <b>«dove lo senti?»</b>: la zona giusta vale più di dieci parole. E ricorda: <b>si vende all'uscita, mai all'ingresso</b> — coi numeri e la sensazione ancora addosso.</p>
  </div>

        </div>`}`;
}
function acadStartQuiz(m){
  const pr = acadProg(ACAD_OP);
  const pool = ACADEMY[m-1].pool;
  const lastSet = pr.last[m]||[];
  let candidates = pool.map((_,i)=>i).filter(i=>!lastSet.includes(i));
  if (candidates.length<5) candidates = pool.map((_,i)=>i);
  for(let i=candidates.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [candidates[i],candidates[j]]=[candidates[j],candidates[i]]; }
  const qs = candidates.slice(0,5).map(qi=>{
    const ord=[0,1,2,3];
    for(let i=3;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [ord[i],ord[j]]=[ord[j],ord[i]]; }
    return {qi, ord};
  });
  ACAD_QUIZ = {m, qs, answers:Array(5).fill(null), graded:false, score:0};
  go('salesquiz');
}
function acadPick(i, pos, el){
  if(!ACAD_QUIZ || ACAD_QUIZ.graded) return;
  ACAD_QUIZ.answers[i]=pos;
  const box = el.closest('.acq');
  box.querySelectorAll('.aopt').forEach(o=>o.classList.remove('on'));
  el.classList.add('on');
  const btn=document.getElementById('acsubmit');
  if(btn && ACAD_QUIZ.answers.every(a=>a!==null)) btn.disabled=false;
}
function acadSubmit(){
  const Q=ACAD_QUIZ; if(!Q || Q.answers.some(a=>a===null)) return;
  const pool = ACADEMY[Q.m-1].pool;
  Q.score = Q.qs.reduce((n,q,i)=> n + (q.ord[Q.answers[i]]===pool[q.qi][2] ? 1:0), 0);
  Q.graded = true;
  const pr = acadProg(ACAD_OP);
  pr.attempts[Q.m] = (pr.attempts[Q.m]||0)+1;
  pr.last[Q.m] = Q.qs.map(q=>q.qi);
  if (Q.score===5){
    pr.passed[Q.m] = new Date().toISOString();
    if (Q.m>=pr.unlocked) pr.unlocked = Math.min(ACADEMY.length, Q.m+1);
  }
  persist(); render(); window.scrollTo(0,0);
}

        <div class="acqt">${i+1}. ${P[0]}</div>

      <button class="btn big" id="acsubmit" style="max-width:480px" ${Q.answers.every(a=>a!==null)?'':'disabled'} onclick="acadSubmit()">Consegna il test</button>

}

function isFirstSession(s){
  const first = DB.sessions.filter(x=>x.clientId===s.clientId).sort((a,b)=>a.date.localeCompare(b.date))[0];
  return first && first.id === s.id;
}
function toggleFav(id, ev){
  if(ev) ev.stopPropagation();
  const s = DB.sessions.find(x=>x.id===id);
  if (s.fav){ s.fav=false; delete s.favNote; persist(); render(); return; }
  const m = document.getElementById('modal');
  m.innerHTML = `<div class="mcard">
