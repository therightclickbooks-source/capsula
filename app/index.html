<meta charset="utf-8">
<title>Zenith Copilot · Capsula di Recupero Biomuscolare</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  :root{
    --bg:#0f0e11; --surface:#18161c; --surface2:#201d26; --line:#2b2733;
    --text:#eae7ee; --muted:#a79fb0; --faint:#6e6678;
    --accent:#b3799a; --accent-strong:#cf94b4; --accent-dim:rgba(179,121,154,.14);
    --danger:#d97676; --danger-dim:rgba(217,118,118,.14);
    --warn:#dcab63; --warn-dim:rgba(220,171,99,.14);
    --ok:#77b795; --ok-dim:rgba(119,183,149,.14);
    --radius:12px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
    line-height:1.5; font-size:16px;
  }
  #app{max-width:980px; margin:0 auto; padding:0 16px 110px; min-height:100%}

  /* topbar */
  .topbar{
    display:flex; align-items:center; gap:14px; padding:14px 0 12px;
    border-bottom:1px solid var(--line); margin-bottom:18px; position:sticky; top:0;
    background:var(--bg); z-index:40;
  }
  .brand{line-height:1.05; user-select:none}
  .brand .b1{font-weight:800; letter-spacing:.06em; font-size:18px}
  .brand .b1 sup{font-size:9px; color:var(--faint)}
  .brand .b2{font-size:8.5px; letter-spacing:.5em; text-transform:uppercase; color:var(--accent); font-weight:700}
  .topbar h1{font-size:17px; font-weight:700; margin:0; flex:1; text-align:center}
  .btn-back{background:none; border:1px solid var(--line); color:var(--muted); border-radius:10px; padding:8px 14px; font-size:14px; font-weight:600; cursor:pointer}
  .btn-back:active{background:var(--surface2)}
  .lockbtn{background:none; border:none; color:var(--faint); font-size:20px; cursor:pointer; padding:6px}

  h2{font-size:20px; font-weight:800; margin:22px 0 10px}
  h3{font-size:16px; font-weight:700; margin:18px 0 8px}
  p.hint{color:var(--muted); font-size:14px; margin:4px 0 14px}

  /* buttons */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    background:var(--accent); color:#fff; border:none; border-radius:12px;
    padding:14px 22px; font-size:16px; font-weight:700; cursor:pointer; letter-spacing:.02em;
  }
  .btn:active{background:var(--accent-strong)}
  .btn.sec{background:var(--surface2); color:var(--text); border:1px solid var(--line)}
  .btn.ghost{background:none; border:1px solid var(--line); color:var(--muted)}
  .btn.danger{background:var(--danger-dim); color:var(--danger); border:1px solid transparent}
  .btn.big{width:100%; padding:18px; font-size:17px}
  .btn:disabled{opacity:.4; pointer-events:none}
  .btnrow{display:flex; gap:10px; flex-wrap:wrap; margin:14px 0}

  /* cards */
  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:18px 20px; margin-bottom:12px}
  .tilegrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:14px; margin-top:16px}
  .tile{
    background:var(--surface); border:1px solid var(--line); border-radius:16px;
    padding:26px 20px; text-align:center; cursor:pointer; user-select:none;
  }
  .tile:active{background:var(--surface2); border-color:var(--accent)}
  .tile .ic{font-size:34px; margin-bottom:10px}
  .tile .tt{font-weight:800; font-size:17px}
  .tile .td{font-size:13px; color:var(--muted); margin-top:4px}

  .statrow{display:flex; gap:12px; flex-wrap:wrap; margin-top:16px}
  .stat{flex:1; min-width:130px; background:var(--surface2); border-radius:12px; padding:12px 16px; text-align:center}
  .stat .n{font-size:26px; font-weight:800; color:var(--accent-strong); font-variant-numeric:tabular-nums}
  .stat .l{font-size:11.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--faint)}

  /* forms */
  label.f{display:block; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--faint); margin:14px 0 5px}
  input[type=text],input[type=tel],input[type=date],input[type=password],select,textarea{
    width:100%; background:var(--surface2); border:1px solid var(--line); color:var(--text);
    border-radius:10px; padding:13px 14px; font-size:16px; font-family:inherit;
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent); outline-offset:0; border-color:transparent}
  .frow{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:0 16px}

  /* segmented / chips choice */
  .seg{display:flex; gap:8px; flex-wrap:wrap; margin:6px 0 4px}
  .seg .opt{
    border:1px solid var(--line); background:var(--surface2); color:var(--muted);
    border-radius:999px; padding:10px 18px; font-size:15px; font-weight:600; cursor:pointer; user-select:none;
  }
  .seg .opt.on{background:var(--accent-dim); color:var(--accent-strong); border-color:var(--accent)}
  .seg.big .opt{padding:16px 20px; font-size:16px; border-radius:14px}

  /* toggle rows (anamnesi) */
  .qrow{display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid var(--line)}
  .qrow:last-child{border-bottom:none}
  .qrow .qt{flex:1; font-size:15px}
  .yn{display:flex; gap:6px}
  .yn button{
    border:1px solid var(--line); background:var(--surface2); color:var(--muted);
    border-radius:8px; padding:8px 16px; font-weight:700; font-size:14px; cursor:pointer;
  }
  .yn button.si.on{background:var(--danger-dim); color:var(--danger); border-color:var(--danger)}
  .yn button.no.on{background:var(--ok-dim); color:var(--ok); border-color:var(--ok)}
  .secband{font-size:12.5px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; padding:7px 12px; border-radius:8px; margin:18px 0 6px}
  .secband.red{color:var(--danger); background:var(--danger-dim)}
  .secband.amb{color:var(--warn); background:var(--warn-dim)}
  .secband.neu{color:var(--muted); background:var(--surface2)}

  /* stepper (values 0-6) */
  .stepper{display:flex; align-items:center; gap:10px}
  .stepper button{
    width:46px; height:46px; border-radius:12px; border:1px solid var(--line);
    background:var(--surface2); color:var(--text); font-size:22px; font-weight:800; cursor:pointer;
  }
  .stepper .val{min-width:44px; text-align:center; font-size:22px; font-weight:800; color:var(--accent-strong); font-variant-numeric:tabular-nums}
  .paramrow{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 0; border-bottom:1px solid var(--line); flex-wrap:wrap}
  .paramrow:last-child{border-bottom:none}
  .paramrow .pl{font-size:15px; font-weight:600}
  .paramrow .pl small{display:block; font-weight:400; color:var(--faint); font-size:12.5px}
  .sw{position:relative; width:58px; height:32px; border-radius:999px; background:var(--surface2); border:1px solid var(--line); cursor:pointer; flex:none}
  .sw::after{content:""; position:absolute; top:3px; left:4px; width:24px; height:24px; border-radius:50%; background:var(--faint); transition:.15s}
  .sw.on{background:var(--accent-dim); border-color:var(--accent)}
  .sw.on::after{left:28px; background:var(--accent-strong)}

  /* client list */
  .clientrow{
    display:flex; align-items:center; gap:14px; background:var(--surface);
    border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:10px; cursor:pointer;
  }
  .clientrow:active{background:var(--surface2)}
  .avatar{
    width:46px; height:46px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:17px; color:#fff; background:var(--accent);
  }
  .clientrow .cn{flex:1}
  .clientrow .cn .nm{font-weight:700; font-size:16px}
  .clientrow .cn .sub{font-size:12.5px; color:var(--faint)}
  .badge{
    display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:800;
    letter-spacing:.08em; text-transform:uppercase; border-radius:999px; padding:4px 12px; color:#111;
  }
  .badge .dot{width:8px; height:8px; border-radius:50%; background:rgba(0,0,0,.35)}
  .chip{display:inline-block; font-size:12px; font-weight:700; padding:3px 10px; border-radius:999px; background:var(--surface2); border:1px solid var(--line); color:var(--muted)}
  .chip.red{color:var(--danger); background:var(--danger-dim); border-color:transparent}
  .chip.amb{color:var(--warn); background:var(--warn-dim); border-color:transparent}
  .chip.ok{color:var(--ok); background:var(--ok-dim); border-color:transparent}
  .chip.acc{color:var(--accent-strong); background:var(--accent-dim); border-color:transparent}

  .searchbar{display:flex; gap:10px; margin-bottom:14px}
  .searchbar input{flex:1}

  /* callouts */
  .call{border-radius:12px; padding:14px 18px; margin:12px 0; font-size:14.5px}
  .call b.tt{display:block; font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; margin-bottom:4px}
  .call.red{background:var(--danger-dim)} .call.red b.tt{color:var(--danger)}
  .call.amb{background:var(--warn-dim)} .call.amb b.tt{color:var(--warn)}
  .call.ok{background:var(--ok-dim)} .call.ok b.tt{color:var(--ok)}
  .call.acc{background:var(--accent-dim)} .call.acc b.tt{color:var(--accent-strong)}

  /* proposal */
  .proposal{border:1px solid var(--accent); border-radius:16px; overflow:hidden; margin:14px 0}
  .proposal .phead{background:var(--accent-dim); padding:16px 20px}
  .proposal .zcode{font-size:13px; font-weight:800; letter-spacing:.1em; color:var(--accent-strong)}
  .proposal .pname{font-size:21px; font-weight:800; margin-top:2px}
  .proposal .pwhy{font-size:14px; color:var(--muted); margin-top:6px}
  .proposal .pbody{padding:16px 20px}
  .settinggrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px; margin:10px 0}
  .setcell{background:var(--surface2); border-radius:10px; padding:10px 12px; text-align:center}
  .setcell .sv{font-size:20px; font-weight:800; color:var(--accent-strong); font-variant-numeric:tabular-nums}
  .setcell .sl{font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--faint)}

  /* guided steps with screenshot markers */
  .gstep{margin:20px 0}
  .gstep .gh{display:flex; align-items:center; gap:10px; margin-bottom:8px}
  .gstep .gnum{width:30px; height:30px; border-radius:50%; background:var(--accent); color:#fff; font-weight:800; display:flex; align-items:center; justify-content:center; flex:none}
  .gstep .gt{font-weight:700; font-size:16px}
  .shot{position:relative; border-radius:12px; overflow:hidden; border:1px solid var(--line)}
  .shot img{width:100%; display:block}
  .marker{
    position:absolute; transform:translate(-50%,-50%);
    width:64px; height:64px; border:3px solid #ff5f5f; border-radius:50%;
    box-shadow:0 0 0 3px rgba(255,95,95,.25), 0 0 18px rgba(255,95,95,.5);
    pointer-events:none;
  }
  @keyframes pulse{0%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.12)}100%{transform:translate(-50%,-50%) scale(1)}}
  .marker{animation:pulse 1.6s ease-in-out infinite}
  @media (prefers-reduced-motion: reduce){.marker{animation:none}}
  .marker .mn{
    position:absolute; top:-12px; right:-12px; width:26px; height:26px; border-radius:50%;
    background:#ff5f5f; color:#fff; font-size:14px; font-weight:800;
    display:flex; align-items:center; justify-content:center;
  }
  .glegend{margin-top:8px; font-size:14px}
  .glegend .gi{display:flex; gap:10px; padding:5px 0; align-items:baseline}
  .glegend .gn{width:22px; height:22px; border-radius:50%; background:#ff5f5f; color:#fff; font-size:12px; font-weight:800; display:flex; align-items:center; justify-content:center; flex:none; align-self:center}

  /* history */
  .sessrow{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 16px; margin-bottom:8px}
  .sessrow .top{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
  .sessrow .zd{width:10px; height:10px; border-radius:50%; flex:none}
  .sessrow .zc{font-weight:800; font-size:14px; letter-spacing:.04em}
  .sessrow .dt{color:var(--faint); font-size:12.5px; margin-left:auto; font-variant-numeric:tabular-nums}
  .sessrow .det{font-size:13px; color:var(--muted); margin-top:4px}

  /* progress bar */
  .pbar{height:10px; background:var(--surface2); border-radius:999px; overflow:hidden; margin:8px 0 4px}
  .pbar .fill{height:100%; background:linear-gradient(90deg,var(--accent),var(--accent-strong)); border-radius:999px}

  /* lock screen */
  .lock{max-width:380px; margin:8vh auto 0; text-align:center}
  .lock .logo1{font-weight:800; font-size:44px; letter-spacing:.06em}
  .lock .logo1 sup{font-size:12px; color:var(--faint)}
  .lock .logo2{font-size:13px; letter-spacing:.55em; text-indent:.55em; text-transform:uppercase; color:var(--accent); font-weight:700; margin-bottom:6px}
  .lock .sub{color:var(--muted); font-size:14px; margin-bottom:30px}
  .pindots{display:flex; gap:14px; justify-content:center; margin:18px 0}
  .pindots span{width:16px; height:16px; border-radius:50%; border:2px solid var(--faint)}
  .pindots span.on{background:var(--accent); border-color:var(--accent)}
  .pinpad{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; max-width:300px; margin:0 auto}
  .pinpad button{
    height:66px; border-radius:16px; border:1px solid var(--line); background:var(--surface);
    color:var(--text); font-size:24px; font-weight:700; cursor:pointer;
  }
  .pinpad button:active{background:var(--accent-dim)}

  ol.msteps{list-style:none; counter-reset:ms; padding:0; margin:14px 0}
  ol.msteps>li{
    counter-increment:ms; position:relative; padding:14px 16px 14px 58px; margin-bottom:10px;
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); font-size:14.5px;
  }
  ol.msteps>li::before{
    content:counter(ms); position:absolute; left:16px; top:14px;
    width:28px; height:28px; border-radius:50%;
    background:var(--accent-dim); color:var(--accent-strong);
    font-weight:800; font-size:14px; display:flex; align-items:center; justify-content:center;
  }
  ol.msteps>li b{color:var(--text)}
  .pquote{border-left:3px solid var(--accent); background:var(--accent-dim); padding:10px 14px; border-radius:0 8px 8px 0; font-size:14px; font-style:italic; margin:10px 0}
  .pquote b{display:block; font-style:normal; font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:var(--accent-strong); margin-bottom:3px}

  /* toast */
  #toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:var(--surface2); border:1px solid var(--accent); color:var(--text);
    padding:14px 24px; border-radius:14px; font-weight:600; z-index:100; display:none;
    max-width:90vw; text-align:center; box-shadow:0 8px 30px rgba(0,0,0,.5);
  }

  /* bottom actionbar */
  .actionbar{
    position:fixed; bottom:0; left:0; right:0; background:var(--bg);
    border-top:1px solid var(--line); padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    display:flex; gap:10px; justify-content:center; z-index:50;
  }
  .actionbar .btn{flex:1; max-width:480px}
  .banner{background:var(--warn-dim); color:var(--warn); font-size:13px; padding:8px 14px; border-radius:10px; margin-bottom:12px; display:none}
</style>

<div id="app"></div>
<div id="toast"></div>

/* ---------- MOTORE PROTOCOLLI ---------- */
function buildProtocol(client, quiz){
  const an = client.anamnesi || {};
  const st = idoneita(client);
  const firstTime = DB.sessions.filter(s=>s.clientId===client.id).length === 0;
  const soft = (st==='cert');
  const m = Object.assign({intensita:3,fourD:3,airbag:3,calore:true,ioni:false,zerog:true,timer:20,plantari:2,polpacci:2}, client.macro||{});
  let S = {...m};
  let prog=null, fam='Z9', why=[];

  const now = new Date().getHours();
  const when = quiz.when || (now<12?'mattina': now<16?'pranzo':'sera');

  /* 1. prima seduta → profilo di benvenuto */
  if (firstTime){
    prog = (client.anamnesi && client.anamnesi.prefIntensita==='deciso') ? 'P01' : 'P22';
    fam='Z8';
    S.timer=15; S.intensita=Math.min(S.intensita,2); S.fourD=Math.min(S.fourD,2); S.airbag=Math.min(S.airbag,2);
    why.push('Prima seduta in capsula: si parte dolcemente per far conoscere ogni sensazione.');
  }
  /* 2. dolore/zona da trattare */
  else if (quiz.goal==='sollievo' || ['schiena','lombare','glutei','cervicale'].includes(quiz.zone)){
    if (quiz.zone==='glutei'){ prog='P05'; fam='Z3'; why.push('La tensione parte da glutei e zona lombare: si lavora all\'origine.'); }
    else if (quiz.zone==='cervicale'){ prog = quiz.activity==='riposo' ? 'P13':'P03'; fam='Z4'; why.push('Focus su collo, trapezi e spalle, la zona indicata come tesa.'); }
    else { prog='P04'; fam='Z3'; why.push('Programma dedicato al tratto dorso-lombare con calore attivo.'); }
    S.intensita=Math.min(S.intensita, 3); S.calore = !an.caloreSensibile;
  }
  /* 3. attività di oggi */
  else if (quiz.activity==='ems'){
    prog = quiz.mood==='dolorante' ? 'P07' : 'P21'; fam='Z1';
    why.push(quiz.mood==='dolorante' ? 'DOMS da EMS: manovre lente e profonde anti-indolenzimento.' : 'Dopo l\'EMS il recupero è parte del metodo: defaticamento completo.');
  }
  else if (quiz.activity==='vacufit'){
    fam='Z2';
    if (client.genere==='F' && (quiz.goal==='relax'||quiz.goal==='drenaggio')) { prog='P02'; why.push('Percorso Regina: completa il lavoro drenante del Vacufit con manovre avvolgenti.'); }
    else if (quiz.prefSoloAria){ prog='P23'; why.push('Solo compressione d\'aria: effetto pressoterapia senza rulli.'); }
    else { prog='P08'; why.push('Gambe e piedi al centro: prolunga l\'effetto leggerezza del Vacufit.'); }
    S.zerog=true; S.airbag=Math.max(S.airbag,4); S.plantari=Math.max(S.plantari,2); S.polpacci=Math.max(S.polpacci,2);
  }
  else if (quiz.activity==='matrix'){
    fam='Z1';
    if (quiz.zone==='gambe'){ prog='P10'; why.push('Leg day: tutto il lavoro sulla parte bassa.'); }
    else if (quiz.zone==='braccia'){ prog='P09'; why.push('Upper day: recupero mirato della parte alta.'); }
    else if (quiz.goal==='relax'){ prog='P12'; fam='Z9'; why.push('Total body + relax: stile Thai SPA, allunga e distende.'); }
    else { prog='P21'; why.push('Allenamento completo in sala: defaticamento da professionisti.'); }
  }
  /* 4. obiettivi senza allenamento */
  if (!prog){
    if (quiz.goal==='drenaggio' || quiz.zone==='gambe'){ prog = quiz.prefSoloAria?'P23':'P08'; fam='Z2'; S.zerog=true; S.airbag=Math.max(S.airbag,4); why.push('Obiettivo leggerezza: compressione a onde e rulli plantari.'); }
    else if (quiz.goal==='sonno' || (when==='sera' && quiz.goal==='relax')){ prog = quiz.mood==='stressato'?'P17':'P18'; fam='Z5'; S.ioni=true; S.intensita=Math.min(S.intensita,2); why.push('Rituale serale: prepara il corpo al sonno.'); }
    else if (quiz.goal==='relax'){ prog = when==='pranzo'?'P16':(quiz.mood==='stressato'?'P19':'P11'); fam = when==='pranzo'?'Z9':'Z5'; S.ioni=true; why.push('Decompressione: massaggio lento e atmosfera rilassante.'); }
    else if (quiz.goal==='energia'){ prog='P15'; fam='Z6'; S.zerog=false; S.timer=Math.min(S.timer,15); S.plantari=3; why.push('Ritmo tonificante che accende corpo e circolazione.'); }
  }
  /* 5. fallback benessere */
  if (!prog){ prog = quiz.mood==='sereno' ? 'P14':'P01'; fam='Z9'; why.push('Riequilibrio completo dalla nuca ai piedi.'); }

  /* vincoli anamnesi */
  if (an.caloreSensibile){ S.calore=false; why.push('Calore disattivato: sensibilità dichiarata in anamnesi.'); }
  if (soft){ S.intensita=Math.min(S.intensita,2); S.fourD=Math.min(S.fourD,2); S.airbag=Math.min(S.airbag,3); why.push('Profilo soft: idoneità con certificato medico.'); }
  const zoneTese = (an.zone||[]);
  if (zoneTese.length) why.push('Zone segnalate in anamnesi: '+zoneTese.join(', ')+' — chiedi conferma della pressione durante la seduta.');

  /* musica */
  let mus = 'Soothing';
  if (fam==='Z1') mus='Mindful';
  if (fam==='Z2') mus='Soothing';
  if (fam==='Z5') mus= (quiz.goal==='sonno'||when==='sera') ? 'Sweet':'Mental';
  if (fam==='Z6') mus= quiz.mood==='carico' ? 'Motivation':'Morning';
  if (fam==='Z8') mus='Mindful';
  if (quiz.mood==='stressato' && fam!=='Z6') mus='Mental';
  S.musica = mus;

  const zCode = `${fam}·${prog}·I${S.intensita}D${S.fourD}A${S.airbag}${S.calore?'C':''}${S.zerog?'G':''}`;
  return { prog, fam, S, why, zCode };
}

/* ---------- passi guidati con schermate ---------- */
function buildSteps(prot){
  const {prog, S} = prot;
  const steps = [];
  const P = PROGRAMS[prog];

  if (prog==='P01' || prog==='P02'){
    steps.push({img:'home', title:'Dalla Home della capsula, avvia il programma',
      markers:[{pos:TILE.home[prog], label:`Tocca “${P.o}”`}]});
  } else {
    steps.push({img:'home', title:'Dalla Home, apri l\'elenco dei programmi',
      markers:[{pos:TILE.home.MORE, label:'Tocca “More Auto Mode”'}]});
    const scr = PROGRAM_SCREEN[prog];
    const swipe = scr==='modes1' ? '' : scr==='modes2' ? ' (scorri alla 2ª schermata)' : ' (scorri alla 3ª schermata)';
    steps.push({img:scr, title:`Scegli il programma${swipe}`,
      markers:[{pos:TILE[scr][prog], label:`Tocca “${P.o}” — ${P.n}`}]});
  }

  const am = [];
  am.push({pos:TILE.auto.FOURD_P, label:`Profondità 4D → porta a ${S.fourD} (tocca 4D+/4D−)`});
  am.push({pos:TILE.auto.AIR_P, label:`Forza airbag → porta a ${S.airbag} (Airbag strength +/−)`});
  if (S.calore) am.push({pos:TILE.auto.HEAT, label:'Attiva “Heating” (calore lombare)'});
  if (S.ioni) am.push({pos:TILE.auto.ION, label:'Attiva “Negative Ion”'});
  if (S.timer!==20) am.push({pos:TILE.auto.TIME, label:`Tocca “Time” fino a ${S.timer} min`});
  if (S.zerog) am.push({pos:TILE.auto.ZEROG, label:'Attiva Zero Gravity (icona a destra)'});
  else am.push({pos:TILE.auto.BACK_UP, label:'Niente zero gravity: postura attiva, schienale più alto se serve'});
  if (S.polpacci>0) am.push({pos:TILE.auto.CALF_KN, label:`“Calf Kneading” attivo (frizione polpacci, livello ${S.polpacci})`});
  if (S.plantari>0) am.push({pos:TILE.auto.FOOT, label:`“Foot Roller” attivo (rulli plantari, velocità ${S.plantari})`});
  steps.push({img:'auto', title:'Regola i parametri sulla schermata del programma', markers:am});

  steps.push({img:'music', title:'Imposta l\'atmosfera sonora',
    markers:[
      {pos:TILE.music[S.musica], label:`Dal menu “Music mode”: scegli “${MUSICS[S.musica]}”`},
      {pos:TILE.music.VOL, label:'Volume basso: deve accompagnare, non coprire'}
    ]});

  if (prog==='P23'){
    steps.push({img:'airbag', title:'Seleziona le zone di compressione',
      markers:[{pos:[50,55], label:'Dal menu “Airbag”: scegli le zone (gambe, vita, spalle o corpo intero)'}]});
  }
  return steps;
}

let MDRAFT = null;
function ynRow(k,q){
  const v = draftClient.anamnesi[k];
  return `<div class="qrow"><span class="qt">${q}</span><span class="yn">
    <button class="si ${v===true?'on':''}" onclick="setYN('${k}',true,this)">SÌ</button>
    <button class="no ${v===false?'on':''}" onclick="setYN('${k}',false,this)">NO</button></span></div>`;
}
function setYN(k,v,btn){
  draftClient.anamnesi[k]=v;
  const row=btn.parentElement;
  row.querySelector('.si').classList.toggle('on', v===true);
  row.querySelector('.no').classList.toggle('on', v===false);
  const showCert = QB.some(([kk])=>draftClient.anamnesi[kk]);
  const cr=document.getElementById('certrow'); if(cr) cr.style.display=showCert?'block':'none';
}
function an_toggle(k,el){ draftClient.anamnesi[k]=!draftClient.anamnesi[k]; el.classList.toggle('on'); }
function m_toggle(k,el){ MDRAFT[k]=!MDRAFT[k]; el.classList.toggle('on'); }
function toggleAtt(a,el){ const arr=draftClient.attivita||(draftClient.attivita=[]); const i=arr.indexOf(a); i>=0?arr.splice(i,1):arr.push(a); el.classList.toggle('on'); }
function toggleZona(z,el){ const arr=draftClient.anamnesi.zone||(draftClient.anamnesi.zone=[]); const i=arr.indexOf(z); i>=0?arr.splice(i,1):arr.push(z); el.classList.toggle('on'); }
function segRefresh(id,val){ document.querySelectorAll('#'+id+' .opt').forEach(o=>o.classList.toggle('on', o.textContent.replace('′','')==String(val))); }
function stepRow(k,label,range,M,max=6){
  return `<div class="paramrow"><div class="pl">${label}<small>${range}</small></div>
    <div class="stepper">
      <button onclick="stepVal('${k}',-1,${max},this)">−</button>
      <span class="val" id="sv_${k}">${M[k]}</span>
      <button onclick="stepVal('${k}',1,${max},this)">＋</button>
    </div></div>`;
}
function stepVal(k,d,max){ MDRAFT[k]=Math.max(0,Math.min(max, (MDRAFT[k]??0)+d)); document.getElementById('sv_'+k).textContent=MDRAFT[k]; }
function saveClient(){
  const c = draftClient;
  c.nome = document.getElementById('f_nome').value.trim();
  c.cognome = document.getElementById('f_cognome').value.trim();
  c.nascita = document.getElementById('f_nascita').value;
  c.telefono = document.getElementById('f_tel').value.trim();
  c.note = document.getElementById('f_note').value.trim();
  QA.concat(QB).forEach(([k])=>{ if(c.anamnesi[k]===undefined) c.anamnesi[k]=false; });
  c.anamnesi.aggiornata = new Date().toISOString();
  c.macro = MDRAFT;
  if(!c.nome && !c.cognome){ toast('Inserisci almeno il nome'); return; }
  const i = DB.clients.findIndex(x=>x.id===c.id);
  if(i>=0) DB.clients[i]=c; else DB.clients.push(c);
  persist(); toast('Scheda salvata ✓'); go('client',{id:c.id});
}

}
function ckRows(list){
  if(!list.length) return '<p class="hint">Nessun risultato. Il cliente è nuovo? Crea prima la sua scheda.</p>';
  return list.map(c=>{
    const lv=clientLevel(clientPoints(c)), st=idoneita(c);
    return `<div class="clientrow" onclick="startCheckinFor('${c.id}')">
      <div class="avatar" style="background:${lv.color};color:#111">${esc(initials(c))}</div>
      <div class="cn"><div class="nm">${esc(c.nome)} ${esc(c.cognome)}</div><div class="sub">${idoneitaChip(st)}</div></div>
      <span class="badge" style="background:${lv.color}">${lv.emoji} ${lv.name}</span></div>`;
  }).join('');
}
function refreshCk(){ const q=(VIEW.q||'').toLowerCase(); document.getElementById('cklist').innerHTML=ckRows(DB.clients.filter(c=>(c.nome+' '+c.cognome).toLowerCase().includes(q))); }
function startCheckinFor(id){
  const c = DB.clients.find(x=>x.id===id);
  const st = idoneita(c);
  if(st==='no'){ toast('⛔ Cliente NON idoneo (sezione A dell\'anamnesi): la capsula non può essere usata.'); return; }
  if(st==='blocked'){ toast('⚠ Serve prima il certificato medico (sezione B). Registralo nella scheda.'); go('client',{id}); return; }
  quizState = {clientId:id, step:0, activity:null, zone:null, goal:null, mood:null, prefSoloAria:false};
  go('quiz');
}

function quizPick(k,v){

function confirmSession(){
  const c = DB.clients.find(x=>x.id===quizState.clientId);
  const beforeLv = clientLevel(clientPoints(c));
  const q = quizState;
  const label = [
    {ems:'EMS',vacufit:'Vacufit',matrix:'Matrix',riposo:'nessun allenamento'}[q.activity],
    q.zone && q.zone!=='nessuna' ? 'zona '+q.zone : null,
    'obiettivo '+q.goal, 'umore '+q.mood
  ].filter(Boolean).join(' · ');
  DB.sessions.push({
    id:uid(), clientId:c.id, date:new Date().toISOString(),
    prog:currentProt.prog, fam:currentProt.fam, zCode:currentProt.zCode,
    settings:currentProt.S, quiz:{...q}, quizLabel:label,
    notes:(document.getElementById('sess_note')||{}).value||'', points:10
  });
  persist();
  const afterPts = clientPoints(c); const afterLv = clientLevel(afterPts);
  if(afterLv.name!==beforeLv.name) toast(`🎉 ${c.nome} è salito a livello <b style="color:${afterLv.color}">${afterLv.name}</b>!`);
  else toast(`Seduta registrata ✓ · ${c.nome}: ${afterPts} punti (${afterLv.name})`);
  go('client',{id:c.id});
}

      <div class="qrow"><span class="qt">Forza airbag</span><span class="chip acc">0 – 6</span></div>

      <div class="qrow"><span class="qt">Ioni negativi</span><span class="chip acc">ON / OFF</span></div>
      <div class="qrow"><span class="qt">Zero gravity</span><span class="chip acc">ON / OFF</span></div>

      <div class="qrow"><span class="qt">Rulli plantari (piedi)</span><span class="chip acc">0 – 3</span></div>
      <div class="qrow"><span class="qt">Frizione polpacci</span><span class="chip acc">0 – 3</span></div>

    </div>`;
}

/* ---------- STORICO GLOBALE ---------- */
function vHistory(){
  const sess = [...DB.sessions].sort((a,b)=>b.date.localeCompare(a.date));
  return topbar('Storico sedute','home') + (sess.length ? sess.map(s=>{
    const c = DB.clients.find(x=>x.id===s.clientId);
    return `<div class="sessrow" onclick="go('client',{id:'${s.clientId}'})" style="cursor:pointer">
      <div class="top"><span class="zd" style="background:${(ZFAM[s.fam]||{}).color||'#888'}"></span>
      <span class="zc">${esc(s.zCode)}</span>
      <span class="chip">${c?esc(c.nome+' '+c.cognome):'—'}</span>
      <span class="chip acc">${esc(PROGRAMS[s.prog]?PROGRAMS[s.prog].n:s.prog)}</span>
      <span class="dt">${fmtDate(s.date)}</span></div>
      <div class="det">${(ZFAM[s.fam]||{}).name||''} · ${esc(s.quizLabel||'')}</div></div>`;
  }).join('') : '<p class="hint">Nessuna seduta registrata finora.</p>');
}

/* ---------- IMPOSTAZIONI ---------- */
function vSettings(){
  return topbar('Impostazioni','home') + `
    <h2>Livelli fedeltà</h2>
    <div class="card">
      ${LEVELS.map(L=>`<div class="paramrow"><div class="pl"><span class="badge" style="background:${L.color}">${L.emoji} ${L.name}</span></div>
        <div style="color:var(--muted);font-size:14px">${L.pts===0?'da 0 punti':'da '+L.pts+' punti ('+(L.pts/10)+' sedute)'}</div></div>`).join('')}
      <p class="hint" style="margin:10px 0 0">Ogni seduta vale 10 punti, i punti non si azzerano mai. Diamond = 520 punti, una seduta a settimana per un anno.</p>
    </div>
    <h2>Sicurezza</h2>
    <div class="card">
      <label class="f">Nuovo PIN (4 cifre)</label>
      <div style="display:flex; gap:10px"><input type="password" id="newpin" maxlength="4" inputmode="numeric" placeholder="••••">
      <button class="btn sec" onclick="changePin()">Cambia PIN</button></div>
    </div>
    <h2>Backup dei dati</h2>
    <div class="card">
      <p class="hint" style="margin-top:0">I dati vivono solo su questo tablet. Esporta regolarmente un backup e conservalo al sicuro (contiene dati sanitari).</p>
      <div class="btnrow">
        <button class="btn sec" onclick="exportData()">⬇ Esporta backup</button>
        <button class="btn sec" onclick="document.getElementById('impfile').click()">⬆ Importa backup</button>
        <input type="file" id="impfile" accept=".json" style="display:none" onchange="importData(this)">
      </div>
      <div class="btnrow">
        <button class="btn ghost" onclick="seedDemo()">Crea 2 clienti di prova</button>
        <button class="btn danger" onclick="wipeAll()">Cancella tutti i dati</button>
      </div>
    </div>
    <p class="hint">Zenith Copilot v1.0 · Capsula di Recupero Biomuscolare · Zenith Fitness Lab — Fit&Go Pompei</p>`;
}
function changePin(){
  const v = document.getElementById('newpin').value;
  if(!/^\d{4}$/.test(v)){ toast('Il PIN deve essere di 4 cifre'); return; }
  DB.pinHash = hash(v); persist(); toast('PIN aggiornato ✓');
}
function exportData(){
  const blob = new Blob([JSON.stringify(DB,null,1)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'zenith-backup-'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
}
function importData(inp){
  const f = inp.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => { try{ const d = JSON.parse(r.result); if(!d.clients||!d.sessions) throw 0; DB = d; persist(); toast('Backup importato ✓'); go('home'); }catch(e){ toast('File non valido'); } };
  r.readAsText(f);
}
function wipeAll(){
  if(!confirm('Cancellare TUTTI i clienti e le sedute? Operazione irreversibile.')) return;
  DB = {pinHash:DB.pinHash, clients:[], sessions:[]}; persist(); toast('Dati cancellati'); go('home');
}
function seedDemo(){
  const d1 = {id:uid(), nome:'Maria', cognome:'Rossi', nascita:'1988-04-12', telefono:'333 0000001', genere:'F', attivita:['Vacufit','EMS'],
    anamnesi:{zone:['gambe','lombare'], prefIntensita:'medio', sonno:'discontinuo', caloreSensibile:false, certificatoOk:false, aggiornata:new Date().toISOString()},
    macro:null, note:'Cliente di prova', createdAt:new Date().toISOString()};
  const d2 = {id:uid(), nome:'Luca', cognome:'Esposito', nascita:'1979-11-02', telefono:'333 0000002', genere:'M', attivita:['Matrix'],
    anamnesi:{zone:['cervicale','spalle'], prefIntensita:'deciso', sonno:'buono', caloreSensibile:false, certificatoOk:false, aggiornata:new Date().toISOString()},
    macro:null, note:'Cliente di prova', createdAt:new Date().toISOString()};
  QA.concat(QB).forEach(([k])=>{ d1.anamnesi[k]=false; d2.anamnesi[k]=false; });
  DB.clients.push(d1,d2); persist(); toast('Clienti di prova creati ✓'); go('clients');
}

/* ---------- router ---------- */
function render(){
  let html='';
  switch(VIEW.name){
    case 'lock': html=vLock(); break;
    case 'home': html=vHome(); break;
    case 'clients': html=vClients(); break;
    case 'client': html=vClient(); break;
    case 'editClient': MDRAFT = draftClient.macro || effMacro(draftClient); html=vEditClient(); break;
    case 'checkin': html=vCheckin(); break;
    case 'quiz': html=vQuiz(); break;
    case 'proposal': html=vProposal(); break;
    case 'history': html=vHistory(); break;
    case 'legend': html=vLegend(); break;
    case 'manual': html=vManual(); break;
    case 'settings': html=vSettings(); break;
    default: html=vLock();
  }
  app.innerHTML = html;
  if(!store.ok){ const b=document.getElementById('storagebanner'); if(b) b.style.display='block'; }
}
render();
</script>
