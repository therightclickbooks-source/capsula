  .sd-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:6px}
  .sd-c{background:var(--surface); border:1px solid var(--line); border-radius:9px; padding:7px 9px; min-width:0}
  .sd-c .sd-k{display:block; font-size:9px; font-weight:800; letter-spacing:.12em;
    text-transform:uppercase; color:var(--faint)}
  .sd-c .sd-v{display:block; font-size:12.5px; font-weight:700; margin-top:2px; line-height:1.3;
    overflow:hidden; text-overflow:ellipsis}
  /* c · pillole */
  .sd-chips{display:flex; flex-wrap:wrap; gap:6px}
  .sd-p{
    display:inline-flex; align-items:baseline; gap:6px; font-size:12px; font-weight:600;
    background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:4px 11px;
    color:var(--text); max-width:100%;
  }
  .sd-p b{font-size:9px; font-weight:800; letter-spacing:.11em; text-transform:uppercase; color:var(--faint)}

  .starbtn.invis{visibility:hidden; pointer-events:none}
  .clientchip{font-weight:700}
  /* durata sessione: 4 tinte, dal chiaro (15′) al più intenso (30′) */
  .sessrow.dur15{border-left:4px solid #cfd6de}
  .sessrow.dur20{border-left:4px solid #9fb8c9}
  .sessrow.dur25{border-left:4px solid #b3799a}
  .sessrow.dur30{border-left:4px solid #d4af37}
  .sessrow.dur15 .durc{color:#cfd6de; border-color:#cfd6de}
  .sessrow.dur20 .durc{color:#9fb8c9; border-color:#9fb8c9}
  .sessrow.dur25 .durc{color:#cf94b4; border-color:#b3799a}
  .sessrow.dur30 .durc{color:#d4af37; border-color:#d4af37}
  .chip.durc{background:transparent; font-variant-numeric:tabular-nums}
  /* un colore per macchinario, schiarito quanto basta per leggersi sul fondo scuro */
  .mbadge{
    display:inline-block; font-size:12px; font-weight:700; padding:3px 10px; border-radius:999px;
    white-space:nowrap; --mc:var(--line);
    color:color-mix(in srgb, var(--mc) 72%, #fff);
    background:color-mix(in srgb, var(--mc) 18%, transparent);
    border:1px solid color-mix(in srgb, var(--mc) 52%, transparent);
  }
  .mbadge.m-ems     {--mc:#2dd4bf}   /* verde acqua   */
  .mbadge.m-vacufit {--mc:#9d174d}   /* cremisi scuro */
  .mbadge.m-matrix  {--mc:#c2691a}   /* arancio       */
  .mbadge.m-ems2    {--mc:#be185d}   /* cremisi acceso*/
  .mbadge.m-riposo  {--mc:#7c3aed}   /* viola         */
  .sessrow.isfav{background:linear-gradient(90deg, rgba(212,175,55,.07), var(--surface) 55%)}
  .sessrow.isfav .det i{color:#d4af37; font-style:italic; opacity:.9}

  /* progress bar */
  .pbar{height:10px; background:var(--surface2); border-radius:999px; overflow:hidden; margin:8px 0 4px}
  .pbar .fill{height:100%; background:linear-gradient(90deg,var(--accent),var(--accent-strong)); border-radius:999px}

  /* lock screen */
  .lock{max-width:380px; margin:8vh auto 0; text-align:center}
  .lock .sub{color:var(--muted); font-size:14px; margin-bottom:30px}
  .pindots{display:flex; gap:14px; justify-content:center; margin:18px 0}
  .pindots span{width:16px; height:16px; border-radius:50%; border:2px solid var(--faint)}
  .pindots span.on{background:var(--accent); border-color:var(--accent)}
  .pinpad{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; max-width:300px; margin:0 auto}
  .pinpad button{
    height:66px; border-radius:16px; border:1px solid var(--line); background:var(--surface);
    color:var(--text); font-size:24px; font-weight:700; cursor:pointer;
  }
  .pinpad button:active{background:var(--accent-dim)}

  /* la riga che presenta il Codice Zenith nelle Impostazioni */
  .codekey{display:flex; align-items:center; gap:13px; padding:4px 0}
  .codekey .ck-ic{
    flex:none; width:44px; height:44px; border-radius:13px; display:grid; place-items:center;
    background:var(--accent-dim); border:1px solid var(--accent); color:var(--accent-hi);
  }
  .codekey .ck-tx{flex:1; min-width:0; font-size:15.5px; font-weight:700}
  .codekey .ck-top{display:flex; align-items:center; gap:9px; flex-wrap:wrap}
  .codekey .ck-tx small{display:block; font-weight:400; color:var(--faint); font-size:12.5px; line-height:1.4; margin-top:3px}
  .codekey .ck-len{
    flex:none; font-size:11.5px; font-weight:800; letter-spacing:.06em; color:var(--muted);
    background:var(--surface2); border:1px solid var(--line); border-radius:999px; padding:3px 9px;
  }
  /* due tasti della stessa larghezza, affiancati finche' ci stanno */
  .ckbtns{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:9px; margin-top:14px}
  .ckbtns .btn{width:100%}
  /* la descrizione e' lunga: l'interruttore resta comunque alla sua destra */
  .cksw{margin-top:4px}
  .cksw .pl{flex:1; min-width:0}

  ol.msteps{list-style:none; counter-reset:ms; padding:0; margin:14px 0}
  ol.msteps>li{
    counter-increment:ms; position:relative; padding:14px 16px 14px 58px; margin-bottom:10px;
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); font-size:14.5px;
  }
  ol.msteps>li::before{
    content:counter(ms); position:absolute; left:16px; top:14px;
    width:28px; height:28px; border-radius:50%;
    background:var(--accent-dim); color:var(--accent-strong);
    font-weight:800; font-size:14px; display:flex; align-items:center; justify-content:center;
  }
  ol.msteps>li b{color:var(--text)}
  .pquote{
    position:relative; background:rgba(212,175,55,.09); border:1px solid rgba(212,175,55,.5);
    padding:16px 14px 11px; border-radius:12px; font-size:14px; font-style:italic; margin:20px 0 12px;
  }
  .pquote::before{
    content:"❝"; position:absolute; top:-12px; left:14px; width:24px; height:24px;
    background:#d4af37; color:#0f0e11; border-radius:50%; font-style:normal;
    display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:800;
  }
  .pquote b{display:block; font-style:normal; font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:#d4af37; margin-bottom:3px}

  /* toast */
  #toast{
    pointer-events:none;
    position:fixed; bottom:calc(96px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%);
    background:var(--surface2); border:1px solid var(--accent); color:var(--text);
    padding:14px 24px; border-radius:14px; font-weight:600; z-index:100; display:none;
    max-width:90vw; text-align:center; box-shadow:0 8px 30px rgba(0,0,0,.5);
  }


  /* ===== HOME: pannello «la giornata» con alone viola ===== */
  .daypanel{
    position:relative; margin:11px 0 2px; padding:12px 12px 12px; border-radius:21px;
    background:linear-gradient(165deg, rgba(122,73,108,.28), rgba(122,73,108,.10) 55%, var(--surface) 100%);
    border:1px solid rgba(156,109,142,.42);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.10), 0 0 0 1px rgba(122,73,108,.16),
               0 14px 40px -14px rgba(122,73,108,.60), 0 26px 70px -30px rgba(169,119,154,.55);
  }
  .daypanel::before{
    content:""; position:absolute; inset:-32px -18px auto -18px; height:150px; z-index:-1; pointer-events:none;
    background:radial-gradient(58% 100% at 50% 0%, rgba(169,119,154,.34), transparent 72%); filter:blur(20px);
  }
  .daypanel .dp-lab{
    font-size:10px; font-weight:800; letter-spacing:.16em; text-transform:uppercase;
    color:var(--accent-hi); margin:0 2px 10px;
  }
  .daypanel .statrow{margin:0; gap:4px}
  .daypanel .stat{background:transparent; border:none; box-shadow:none; padding:2px 4px; min-width:0}
  .daypanel .stat .ic{margin-bottom:4px}
  .daypanel .stat .n{font-size:24px}
  .daypanel .stat .n small{font-size:13px; font-weight:800; margin-left:1px; opacity:.75}
  .daypanel .stat .l{font-size:9.5px; letter-spacing:.08em}
  /* si tocca: ogni numero porta dove si agisce */
  .daypanel .stat{cursor:pointer; border-radius:12px;
    transition:transform .14s cubic-bezier(.32,.72,0,1), background .16s}
  .daypanel .stat:active{transform:scale(.95); background:rgba(255,255,255,.05)}
  /* colore secondo lo stato, non secondo la posizione */
  .stat.st-sedute .ic, .stat.st-sedute .n{color:var(--accent-hi)}
  .stat.buono .ic, .stat.buono .n{color:var(--ok)}
  .stat.medio .ic, .stat.medio .n{color:var(--warn)}
  .stat.basso .ic, .stat.basso .n{color:var(--danger)}
  .stat.neutro .ic, .stat.neutro .n{color:var(--faint)}
  .daypanel .spark{margin-top:6px}
  /* v46 · il tasto Check-in vive fuori dal pannello, sopra «Ogni giorno» */
  .ckbtn{
    display:flex; align-items:center; gap:14px; width:100%; text-align:left;
    margin:13px 0 3px; padding:15px 16px; border-radius:18px; cursor:pointer;
    font:inherit; color:var(--text); border:1px solid var(--line); background:var(--surface);
    transition:transform .16s cubic-bezier(.32,.72,0,1), box-shadow .22s ease, filter .22s ease;
  }
  .ckbtn:active{transform:scale(.985)}
  .ckbtn .ck-ic{
    flex:none; width:46px; height:46px; border-radius:15px;
    display:flex; align-items:center; justify-content:center;
  }
  .ckbtn .ck-tx{flex:1; min-width:0}
  .ckbtn .ck-tx b{display:block; font-size:19px; font-weight:800; letter-spacing:-.02em; line-height:1.15}
  .ckbtn .ck-tx small{display:block; font-size:12.5px; margin-top:3px; opacity:.82}
  .ckbtn .ck-go{
    flex:none; display:inline-flex; align-items:center; gap:6px;
    font-size:12.5px; font-weight:800; letter-spacing:.04em;
  }
  .ckbtn .ck-go i{font-style:normal; font-size:17px; line-height:1}
  @media(max-width:400px){ .ckbtn .ck-lb{display:none} }

  /* A · barra piena */
  .ckbtn.v-a{
    border-color:transparent; color:#fff;
    background:linear-gradient(135deg, var(--accent-hi), var(--accent) 52%, #5d3651);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.22), 0 12px 32px -14px rgba(169,119,154,.9);
  }
  .ckbtn.v-a .ck-ic{background:rgba(255,255,255,.17); box-shadow:inset 0 1px 0 rgba(255,255,255,.28)}
  .ckbtn.v-a .ck-go{background:rgba(255,255,255,.19); border-radius:999px; padding:7px 14px}
  .ckbtn.v-a:active{filter:brightness(.94)}

  /* B · contorno luminoso */
  .ckbtn.v-b{
    border:1.5px solid var(--accent-strong);
    background:linear-gradient(180deg, var(--accent-dim), var(--surface) 72%);
    box-shadow:0 0 0 4px color-mix(in srgb, var(--accent) 13%, transparent),
               0 14px 34px -18px var(--accent-hi), inset 0 1px 0 var(--hairline);
  }
  .ckbtn.v-b .ck-ic{background:var(--accent-dim); border:1px solid var(--accent); color:var(--accent-hi)}
  .ckbtn.v-b .ck-tx b{color:var(--accent-hi)}
  .ckbtn.v-b .ck-go{color:var(--accent-hi); border:1px solid currentColor; border-radius:999px; padding:6px 13px}

  /* C · accento laterale */
  .ckbtn.v-c{
    border-color:var(--line); border-left:4px solid var(--accent-hi); border-radius:16px;
    background:linear-gradient(90deg, color-mix(in srgb, var(--accent) 20%, var(--surface)), var(--surface) 48%);
    box-shadow:0 12px 30px -18px rgba(0,0,0,.95), inset 0 1px 0 var(--hairline);
  }
  .ckbtn.v-c .ck-ic{background:var(--surface2); border:1px solid var(--line); color:var(--accent-hi)}
  .ckbtn.v-c .ck-go{
    width:36px; height:36px; padding:0; justify-content:center; border-radius:50%;
    background:var(--accent-strong); color:#fff;
    box-shadow:0 6px 16px -8px var(--accent-hi);
  }
  .ckbtn.v-c .ck-lb{display:none}

  .daypanel .herorot{
    max-width:none;   /* su schermo largo arriva fino al bordo del pannello */
    flex-direction:column; align-items:flex-start; gap:8px;
    margin:10px 0 0; padding:12px 16px 13px; border-radius:15px; min-height:118px;
    background:rgba(12,10,15,.34); border-color:rgba(255,255,255,.10); border-left-width:3px;
  }
  .daypanel .herorot .hr-txt{font-size:14.5px; line-height:1.42; width:100%; min-width:0; margin-block:auto}
  .daypanel .herorot .hr-tag{font-size:9.5px; padding:3px 10px; letter-spacing:.15em}

  /* ===== HOME: sezioni raggruppate per argomento ===== */
  .secgroup{margin-top:11px}
  .secgroup .sg-lab{
    font-size:10px; font-weight:800; letter-spacing:.16em; text-transform:uppercase;
    margin:0 4px 7px; display:flex; align-items:center; gap:9px; color:var(--faint);
  }
  .secgroup .sg-lab::after{content:""; flex:1; height:1px; background:currentColor; opacity:.22}
  .g-day  .sg-lab{color:var(--accent-hi)}
  .g-ref  .sg-lab{color:#8fb2c9}
  .g-grow .sg-lab{color:var(--gold)}
  .tilegrid.three{grid-template-columns:repeat(3,1fr); gap:10px}
  .tilegrid.two{grid-template-columns:repeat(2,1fr); gap:11px}
  .tilegrid.three .tile, .tilegrid.two .tile{padding:10px 9px 10px}
  .tilegrid.three .tt{font-size:14px} .tilegrid.two .tt{font-size:15px}
  .tilegrid.three .td{font-size:10.5px; margin-top:2px; line-height:1.35} .tilegrid.two .td{font-size:11px; margin-top:2px; line-height:1.35}
  .tilegrid.three .ic, .tilegrid.two .ic{margin-bottom:6px}
  /* colori distinti, UNA sola intensità di retroilluminazione per tutte */
  .tile[data-c]{
    border-color:color-mix(in srgb, var(--tc) 32%, transparent);
    box-shadow:inset 0 1px 0 var(--hairline), 0 10px 26px -15px color-mix(in srgb, var(--tc) 70%, transparent);
  }
  .tile[data-c] .ic{color:var(--tc)}
  .tile[data-c]:hover{border-color:color-mix(in srgb, var(--tc) 75%, transparent);
    box-shadow:inset 0 1px 0 var(--hairline), 0 16px 34px -14px color-mix(in srgb, var(--tc) 78%, transparent)}
  .tile[data-c]::before{background:linear-gradient(90deg,transparent,var(--tc),transparent)}
  .tile.c-clienti{--tc:#b3799a}
  .tile.c-storico{--tc:#9c7bf0}
  .tile.c-stat   {--tc:#5fc2a8}
  .tile.c-prog   {--tc:#8fb2c9}
  .tile.c-guida  {--tc:#dd8f86}
  .tile.c-scuola {--tc:#d4af37}
  .tile.c-imp    {--tc:#9a93ad}

  /* promemoria compatto */
  .minirem{
    display:flex; align-items:flex-start; gap:9px; margin:11px 2px 2px;
    font-size:11.5px; line-height:1.45; color:var(--faint);
  }
  .minirem svg{flex:none; margin-top:1px; opacity:.8}
  .minirem b{color:var(--muted); font-weight:700}

  /* pillola versione (Home) */
  .vbadge{
    display:inline-flex; align-items:center; gap:6px; flex:none; cursor:pointer;
    padding:5px 12px 5px 9px; border-radius:var(--r-pill); font-family:inherit;
    color:var(--ok); background:var(--ok-dim);
    border:1px solid color-mix(in srgb, var(--ok) 35%, transparent);
    transition:transform .17s cubic-bezier(.32,.72,0,1), filter .17s cubic-bezier(.32,.72,0,1);
  }
  .vbadge:active{transform:scale(.96); filter:brightness(1.12)}
  .vbadge .vb-n{font-size:11.5px; font-weight:800; letter-spacing:.02em; line-height:1}

  /* chiusura seduta */
  .closehero{text-align:center; padding:26px 16px 8px}
  .closehero .ch-ok{
    width:64px; height:64px; margin:0 auto 12px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; color:#fff;
    background:linear-gradient(150deg,#34d399,#22c55e); box-shadow:0 8px 26px rgba(34,197,94,.4);
    animation:chpop .45s cubic-bezier(.32,.72,0,1) both;
  }
  .closehero .ch-t{font-size:24px; font-weight:800; letter-spacing:-.02em}
  .closehero .ch-s{color:var(--muted); font-size:14.5px; margin-top:4px; line-height:1.6}
  .closehero .ch-lv{display:inline-block; margin-top:8px; color:#111; font-weight:800; font-size:12.5px; padding:4px 12px; border-radius:999px}
  @keyframes chpop{from{opacity:0; transform:scale(.5)} 70%{transform:scale(1.08)} to{opacity:1; transform:scale(1)}}
  @media (prefers-reduced-motion:reduce){ .closehero .ch-ok{animation:none} }
  .fbrow{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:12px 0}
  .fbtn{
    display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer;
    padding:16px 8px; border-radius:var(--r-lg); border:1.5px solid var(--line);
    background:linear-gradient(180deg, color-mix(in srgb, #fff 5%, var(--surface)), var(--surface) 58%);
    color:var(--text); font-family:inherit; box-shadow:inset 0 1px 0 var(--hairline), var(--shadow-sm);
    transition:transform .17s cubic-bezier(.32,.72,0,1), border-color .17s, background .17s;
  }
  .fbtn:active{transform:scale(.96)}
  .fbtn .fbi{font-size:22px; line-height:1}
  .fbtn .fbt{font-weight:800; font-size:14px; letter-spacing:-.01em; text-align:center}
  .fbtn .fbs{font-size:11px; color:var(--faint)}
  .fbtn.soft.on{border-color:var(--info); background:var(--info-dim)}
  .fbtn.ok.on{border-color:var(--ok); background:var(--ok-dim)}
  .fbtn.hard.on{border-color:var(--warn); background:var(--warn-dim)}
  .fbtn.on .fbs{color:var(--muted)}
  /* avviso taratura nel protocollo */
  .caltag{
    display:flex; align-items:flex-start; gap:11px; margin:10px 0 4px; padding:11px 14px;
    border-radius:var(--r-md); border:1px solid var(--line); background:var(--surface2); font-size:13px;
  }
  .caltag .calic{font-size:17px; line-height:1.2}
  .caltag .calx b{display:block; font-size:13.5px; margin-bottom:1px}
  .caltag .calx small{color:var(--muted); line-height:1.45; display:block}
  .caltag.down{border-color:color-mix(in srgb,var(--info) 45%,transparent); background:var(--info-dim)}
  .caltag.down .calx b{color:var(--info)}
  .caltag.up{border-color:color-mix(in srgb,var(--warn) 45%,transparent); background:var(--warn-dim)}
  .caltag.up .calx b{color:var(--warn)}
  .caltag.ok{border-color:color-mix(in srgb,var(--ok) 45%,transparent); background:var(--ok-dim)}
  .caltag.ok .calx b{color:var(--ok)}
  /* striscia preferite nella scheda cliente */
  .favstrip{
    display:flex; align-items:center; gap:13px; margin:12px 0 2px; padding:13px 16px; cursor:pointer;
    border-radius:var(--r-lg); border:1px solid rgba(212,175,55,.45);
    background:linear-gradient(135deg, rgba(212,175,55,.12), var(--surface) 62%);
    box-shadow:inset 0 1px 0 var(--hairline), var(--shadow-sm);
    transition:transform .17s cubic-bezier(.32,.72,0,1)}
  .favstrip:active{transform:scale(.99)}
  .favstrip .fsic{font-size:20px; color:var(--gold); flex:none}
  .favstrip .fsx{flex:1; min-width:0}
  .favstrip .fsx b{font-size:14.5px; color:var(--gold)}
  .favstrip .fsx small{display:block; color:var(--muted); font-size:12.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .favstrip .fsx small{transition:opacity .15s ease}
  .favstrip .fscount{
    flex:none; font-size:10.5px; font-weight:800; letter-spacing:.06em; color:var(--gold);
    background:rgba(212,175,55,.12); border:1px solid rgba(212,175,55,.42);
    border-radius:999px; padding:3px 9px; font-variant-numeric:tabular-nums; white-space:nowrap;
  }
  .favstrip .fsgo{color:var(--gold); font-size:20px; font-weight:800; flex:none}
  .favstrip .fsgo.tap{
    width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    border:1px solid rgba(212,175,55,.42); background:rgba(212,175,55,.12); cursor:pointer;
    transition:transform .14s cubic-bezier(.32,.72,0,1), background .16s;
  }
  .favstrip .fsgo.tap:active{transform:scale(.88); background:rgba(212,175,55,.3)}

  /* percorso operatore */
  .acbar{height:8px; max-width:340px; margin:14px auto 8px; background:var(--surface2); border-radius:999px; overflow:hidden}
  .acfill{height:100%; background:linear-gradient(90deg, var(--accent), var(--accent-hi)); border-radius:999px; transition:width .4s cubic-bezier(.32,.72,0,1)}
  .acmods{display:flex; flex-direction:column; gap:12px; margin-top:18px}
  .acmod{
    display:flex; align-items:center; gap:16px; padding:18px 18px;
    background:linear-gradient(180deg, color-mix(in srgb, #fff 5%, var(--surface)), var(--surface) 58%);
    border:1px solid var(--line); border-radius:var(--r-lg);
    box-shadow:inset 0 1px 0 var(--hairline), var(--shadow-sm);
  }
  .acmod .acnum{
    flex:none; width:46px; height:46px; border-radius:36%;
    display:flex; align-items:center; justify-content:center;
    font-size:19px; font-weight:800; background:var(--surface2); color:var(--faint);
  }
  .acmod .acx{flex:1; min-width:0}
  .acmod .ace{font-size:10px; font-weight:800; letter-spacing:.09em; color:var(--accent-hi); margin-bottom:2px}
  .acmod .act{font-weight:800; font-size:16.5px; letter-spacing:-.01em}
  .acmod .acd{font-size:12.5px; color:var(--muted); margin-top:3px; line-height:1.4}
  .acmod.cur{cursor:pointer; border-color:rgba(122,73,108,.55); background:linear-gradient(135deg, rgba(122,73,108,.16), var(--surface-hi) 58%); box-shadow:0 12px 36px rgba(122,73,108,.14), var(--shadow-sm)}
  .acmod.cur .acnum{background:linear-gradient(150deg,#a9779a,#7a496c); color:#fff; box-shadow:0 4px 14px rgba(122,73,108,.4)}
  .acmod.cur .cta{flex:none; background:linear-gradient(180deg, var(--accent-hi), var(--accent)); color:#fff; font-weight:800; font-size:14px; padding:10px 18px; border-radius:var(--r-pill)}
  .acmod.cur:active{transform:scale(.985)}
  .acmod.done{cursor:pointer; border-color:color-mix(in srgb, var(--ok) 35%, var(--line))}
  .acmod.done .acnum{background:var(--ok-dim); color:var(--ok)}
  .acmod.done .act{color:var(--muted)}
  .acmod.blocked{opacity:.62; border-style:dashed}
  .acmod.blocked .act{color:var(--faint)}
  /* quiz */
  .acq{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); padding:16px 18px; margin:12px 0; box-shadow:var(--shadow-sm)}
  .acq .acqt{font-weight:700; font-size:15.5px; margin-bottom:10px; line-height:1.4}
  .aopt{
    padding:12px 14px; margin:8px 0; border:1px solid var(--line); border-radius:var(--r-md);
    background:var(--surface2); font-size:14.5px; cursor:pointer; user-select:none;
    transition:background .17s cubic-bezier(.32,.72,0,1), border-color .17s cubic-bezier(.32,.72,0,1), transform .17s cubic-bezier(.32,.72,0,1);
  }
  .aopt:active{transform:scale(.98)}
  .aopt.on{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:700; box-shadow:0 3px 14px rgba(122,73,108,.45)}
  .acq.okq{border-color:color-mix(in srgb, var(--ok) 45%, var(--line))}
  .acq.badq{border-color:color-mix(in srgb, var(--danger) 45%, var(--line))}
  .okmark{color:var(--ok); font-weight:800} .badmark{color:var(--danger); font-weight:800}
  .acwhy{font-size:13.5px; border-radius:var(--r-sm); padding:10px 12px; line-height:1.5}
  .acwhy.ok{background:var(--ok-dim); color:var(--text)}
  .acwhy.bad{background:var(--danger-dim); color:var(--text)}
  .acwhy .why{color:var(--muted)}
  /* celebrazione */
  .celebrate{text-align:center; padding:34px 10px 20px; position:relative}
  .cel-score{
    font-size:84px; font-weight:800; letter-spacing:-.04em; line-height:1;
    background:linear-gradient(150deg,#a9779a,#7a496c); -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 10px 30px rgba(122,73,108,.45)); animation:celpop .5s cubic-bezier(.32,.72,0,1) both;
  }
  .cel-score span{font-size:38px}
  .cel-t{font-size:22px; font-weight:800; letter-spacing:-.02em; margin-top:10px; animation:celin .5s .12s cubic-bezier(.32,.72,0,1) both}
  .cel-s{color:var(--muted); font-size:14.5px; margin:6px auto 26px; max-width:46ch; animation:celin .5s .2s cubic-bezier(.32,.72,0,1) both}
  .acmod.appear{cursor:pointer; text-align:left; animation:celappear .6s .45s cubic-bezier(.32,.72,0,1) both}
  @keyframes celpop{from{opacity:0; transform:scale(.6)} 70%{transform:scale(1.06)} to{opacity:1; transform:scale(1)}}
  @keyframes celin{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none}}
  @keyframes celappear{from{opacity:0; transform:translateY(22px) scale(.96)} to{opacity:1; transform:none}}
  @media (prefers-reduced-motion:reduce){ .cel-score,.cel-t,.cel-s,.acmod.appear{animation:none} }

  /* bottom nav */
  .bnav{
    position:fixed; bottom:0; left:0; right:0; z-index:60;
    display:flex; align-items:flex-end; justify-content:space-around; gap:2px;
    background:color-mix(in srgb, var(--surface) 90%, transparent);
    backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    border-top:1px solid var(--line);
    padding:8px 8px calc(8px + env(safe-area-inset-bottom));
  }
  .bnav .bni{
    flex:1; max-width:96px; display:flex; flex-direction:column; align-items:center; gap:3px;
    background:none; border:none; cursor:pointer; position:relative;
    color:var(--faint); font-family:inherit; font-size:10px; font-weight:700; letter-spacing:.04em;
    padding:4px 2px 8px;
    transition:color .17s cubic-bezier(.32,.72,0,1), transform .17s cubic-bezier(.32,.72,0,1);
  }
  .bnav .bni:active{transform:scale(.96)}
  .bnav .bni.on{color:var(--accent-hi)}
  .bnav .bni.on::after{content:""; position:absolute; bottom:0; left:50%; transform:translateX(-50%); width:4px; height:4px; border-radius:50%; background:var(--accent-hi)}
  .bnav .fab{
    flex:none; width:56px; height:56px; border-radius:50%; margin:-26px 4px 4px; border:none; cursor:pointer;
    background:linear-gradient(150deg, #a9779a, #7a496c); color:#fff;
    box-shadow:0 6px 20px rgba(122,73,108,.5), inset 0 1px 0 rgba(255,255,255,.28);
    display:flex; align-items:center; justify-content:center;
    transition:transform .17s cubic-bezier(.32,.72,0,1), filter .17s cubic-bezier(.32,.72,0,1);
  }
  .bnav .fab:active{transform:scale(.96); filter:brightness(1.08)}

  /* bottom actionbar */
  .actionbar{
    position:fixed; bottom:0; left:0; right:0; background:var(--bg);
    border-top:1px solid var(--line); padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    display:flex; gap:10px; justify-content:center; z-index:50;
  }
  .actionbar .btn{flex:1; max-width:480px}
  #app.view-sales{background:radial-gradient(circle at 50% -5%, rgba(212,175,55,.14), transparent 380px)}
  #app.view-sales h2{border-left-color:#d4af37; background:linear-gradient(90deg, rgba(212,175,55,.14), transparent 65%)}
  #app.view-sales h2::after{background:linear-gradient(90deg, #d4af37, transparent 70%)}
  .saleshero{
    position:relative; margin:14px 0 6px; padding:30px 22px 26px; text-align:center;
    background:linear-gradient(160deg, #1a140a, #12100a 70%);
    border:1px solid #d4af37; border-radius:18px; overflow:hidden;
    box-shadow:0 0 0 4px rgba(212,175,55,.1), 0 14px 40px rgba(0,0,0,.5);
  }
  .saleshero::before{
    content:"✦"; position:absolute; top:-30px; right:-10px; font-size:150px; color:rgba(212,175,55,.08);
  }
  .sh-badge{
    display:inline-block; font-size:11px; font-weight:800; letter-spacing:.28em;
    color:#0f0e11; background:#d4af37; border-radius:999px; padding:5px 16px; margin-bottom:14px;
  }
  .sh-title{font-size:clamp(21px,5vw,28px); font-weight:800; line-height:1.25; color:#f3e6c4; text-wrap:balance}
  .sh-sub{margin-top:10px; font-size:13.5px; color:#b8a878; letter-spacing:.02em}
  .banner{background:var(--warn-dim); color:var(--warn); font-size:13px; padding:8px 14px; border-radius:10px; margin-bottom:12px; display:none}

  /* griglia domande: card di egual misura, effetto "corposo" alla pressione */
  .qgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:12px; max-width:840px; margin:18px auto 0}
  .qgrid.zones{grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); max-width:720px}
  .qgrid.two{grid-template-columns:repeat(2, minmax(160px,1fr)); max-width:520px}
  .qgrid.two .qcard.wide{grid-column:1 / -1}
  .qcard{
    background:var(--surface); border:1.5px solid var(--line); border-radius:16px;
    padding:20px 14px; text-align:center; cursor:pointer; user-select:none;
    min-height:118px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
    transition:transform .1s ease, background .12s ease, border-color .12s ease, box-shadow .12s ease;
  }
  .qcard.slim{min-height:56px; padding:12px 10px}
  .qcard .qi{font-size:30px; line-height:1}
  .qcard .ql{font-weight:800; font-size:15.5px; letter-spacing:.01em}
  .qcard .qs{font-size:12px; color:var(--faint); line-height:1.35}
  .qcard:active{
    transform:scale(.965);
    background:linear-gradient(180deg, var(--accent-dim), var(--surface));
    border-color:var(--accent);
    box-shadow:inset 0 3px 10px rgba(0,0,0,.45), 0 0 0 4px var(--accent-dim);
  }
  .qcard.on{background:var(--accent-dim); border-color:var(--accent); box-shadow:inset 0 2px 8px rgba(0,0,0,.3)}
  .qcard.on .ql{color:var(--accent-strong)}

  /* v39 · le 5 domande: avanzamento, riepilogo, card in riga */
  /* la scheda della domanda: costa poco, perche' il quiz vive in una schermata sola */
  .qbox{
    margin:10px 0; border-radius:var(--r-lg); overflow:hidden;
    background:var(--surface); border:1px solid var(--line);
    box-shadow:inset 0 1px 0 var(--hairline), var(--shadow-sm);
  }
  .qb-h{padding:12px 14px}
  .qb-h .qsteps{margin:0 auto 8px; max-width:none}
  .qb-h .qcount{margin:0 0 4px}
  .qb-dom{
    font-size:18px; font-weight:800; letter-spacing:-.022em; text-align:center;
    text-wrap:balance; line-height:1.25;
  }
  .qb-h .qrecap{margin:9px auto 0}
  .qb-b{padding:12px 14px 13px; border-top:1px solid var(--line)}
  .qb-b > *:first-child{margin-top:0}
  .qb-b > *:last-child{margin-bottom:0}
  .btnrow.qb-nav{justify-content:center; margin:12px 0 0}

  .qsteps{display:flex; gap:6px; max-width:520px; margin:15px auto 0}
  .qsteps i{flex:1; height:5px; border-radius:999px; background:var(--surface2); border:1px solid var(--line);
    transition:background .28s cubic-bezier(.32,.72,0,1), box-shadow .28s}
  .qsteps i.done{background:color-mix(in srgb,var(--accent) 75%,transparent); border-color:transparent}
  .qsteps i.now{background:var(--accent-hi); border-color:transparent; box-shadow:0 0 0 3px var(--accent-dim)}
  .qcount{text-align:center; font-size:10px; font-weight:800; letter-spacing:.18em;
    text-transform:uppercase; color:var(--faint); margin:10px 0 0}
  .qrecap{display:flex; gap:6px; flex-wrap:wrap; justify-content:center; max-width:560px; margin:12px auto 0}
  .qrecap .rc{display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:700;
    color:var(--muted); background:var(--surface); border:1px solid var(--line); border-radius:999px;
    padding:5px 11px; cursor:pointer; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    transition:transform .14s cubic-bezier(.32,.72,0,1), border-color .16s}
  .qrecap .rc:active{transform:scale(.95); border-color:var(--accent)}
  .qrecap .rc em{font-style:normal; color:var(--faint); font-weight:800; font-size:9.5px;
    letter-spacing:.12em; text-transform:uppercase}
  .qgrid{grid-template-columns:1fr; max-width:560px; gap:7px; margin-top:14px}
  .qgrid.two{grid-template-columns:1fr; max-width:560px}
  .qgrid > .qcard{
    flex-direction:row; align-items:center; justify-content:flex-start; text-align:left;
    min-height:56px; padding:9px 13px; gap:11px; border-radius:15px;
  }
  .qgrid > .qcard .qi{
    font-size:19px; width:40px; height:40px; flex:none; border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    background:var(--surface2); border:1px solid var(--line); transition:background .14s, border-color .14s;
  }
  .qgrid > .qcard .qtx{flex:1; min-width:0}
  .qgrid > .qcard .ql{font-size:15px}
  .qgrid > .qcard .qs{font-size:12px; line-height:1.3; margin-top:1px}
  .qgrid > .qcard.on .qi{background:var(--accent-dim); border-color:var(--accent)}
  @media(min-width:760px){ .qgrid, .qgrid.two{grid-template-columns:repeat(2,1fr); max-width:780px} }

  /* v39 · testata del protocollo: prima il programma, poi il codice */
  .proposal .pkicker{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:9px}
  .proposal .pname2{font-size:23px; font-weight:800; letter-spacing:-.02em; line-height:1.16; text-wrap:balance}
  .proposal .pfam{display:inline-flex; align-items:center; gap:8px; font-size:13.5px; font-weight:700;
    color:var(--muted); margin-top:6px}
  .proposal .pfam .fd{width:9px; height:9px; border-radius:50%; flex:none}
  .pchip2{display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:800;
    background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:6px 13px}
  .zline{display:flex; align-items:center; gap:9px; flex-wrap:wrap; margin-top:13px}
  .zpill{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12.5px; font-weight:700;
    letter-spacing:.04em; color:var(--accent-strong); background:var(--surface);
    border:1px solid color-mix(in srgb,var(--accent) 45%,transparent); border-radius:10px; padding:6px 12px}
  .zhelp{width:26px; height:26px; border-radius:50%; flex:none; cursor:pointer; padding:0;
    border:1px solid var(--line); background:var(--surface); color:var(--muted);
    font-size:13px; font-weight:800; display:flex; align-items:center; justify-content:center;
    transition:transform .12s cubic-bezier(.32,.72,0,1), border-color .16s, color .16s}
  .zhelp:active{transform:scale(.9); border-color:var(--accent); color:var(--accent-strong)}
  .zkey{font-size:10.5px; color:var(--faint); letter-spacing:.03em; margin-top:7px}

  /* v43 · livelli fedeltà: una riga per livello, colore ben distinguibile */
  .lvrow{display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid var(--line)}
  .lvrow:last-of-type{border-bottom:none}
  .lvchip{
    width:34px; height:34px; flex:none; border-radius:11px; display:flex; align-items:center;
    justify-content:center; font-size:15px; color:#111;
    box-shadow:0 0 0 1px rgba(255,255,255,.10) inset, 0 4px 14px -6px var(--lc);
  }
  .lvtx{flex:1; min-width:0}
  .lvtx b{display:block; font-size:15px; letter-spacing:-.01em; color:var(--lc)}
  .lvtx small{display:block; font-size:11.5px; color:var(--muted); margin-top:1px; line-height:1.35}
  .lvpt{flex:none; font-size:15px; font-weight:800; color:var(--text); white-space:nowrap;
    font-variant-numeric:tabular-nums}
  .lvpt small{font-size:10.5px; color:var(--faint); font-weight:600; margin-left:3px}

  /* v43 · scheda macchinari della prima domanda */
  .qinfo{
    display:flex; align-items:center; justify-content:center; gap:7px; margin:12px auto 0;
    max-width:560px; padding:10px 14px; cursor:pointer; user-select:none;
    background:var(--surface); border:1px dashed var(--line); border-radius:var(--r-md);
    font-size:12.5px; font-weight:700; color:var(--muted);
    transition:transform .14s cubic-bezier(.32,.72,0,1), border-color .16s, color .16s;
  }
  .qinfo:active{transform:scale(.98); border-color:var(--accent); color:var(--accent-strong)}
  .machlist{max-height:min(66vh,560px); overflow-y:auto; margin:4px -4px 0; padding:0 4px}
  .machc{background:var(--surface2); border:1px solid var(--line); border-radius:var(--r-md);
    padding:11px 13px; margin-bottom:8px; text-align:left}
  .machc .mc-t{display:flex; align-items:center; gap:8px}
  .machc .mc-ic{font-size:16px; line-height:1}
  .machc .mc-n{font-weight:800; font-size:14.5px; letter-spacing:-.01em}
  .machc .mc-f{margin-left:auto; font-size:10px; font-weight:800; letter-spacing:.1em;
    color:var(--accent-hi); border:1px solid currentColor; border-radius:999px; padding:1px 7px}
  .machc .mc-d{font-size:12.5px; color:var(--muted); margin-top:5px; line-height:1.45}
  .machc .mc-z{font-size:12.5px; margin-top:6px; line-height:1.45; color:var(--text)}
  .machc .mc-z b{color:var(--accent-hi); font-weight:700}

  /* v43 · seconda domanda: tutto il corpo a colpo d'occhio */
  .zwrap{max-width:640px; margin:10px auto 0}
  .zwrap .zfigs{display:flex; gap:20px; justify-content:center; margin-bottom:8px}
  .zwrap .bodyfig svg{width:70px}
  .zwrap .bodylabel{font-size:9px; letter-spacing:.12em; margin-top:3px}
  @media(min-width:640px){
    .zwrap{display:flex; gap:16px; align-items:center}
    .zwrap .zfigs{flex:none; margin-bottom:0}
    .zwrap .zcols{flex:1; min-width:0}
    .zwrap .bodyfig svg{width:104px}
  }
  .ztier{display:flex; gap:6px; justify-content:stretch; margin-top:6px}
  .ztier:first-child{margin-top:0}
  .ztier .qcard.slim{flex:1; min-width:0; width:auto !important; min-height:40px; padding:7px 6px}
  .ztier .qcard.slim .ql{font-size:12.5px; line-height:1.2}
  .zapex{display:flex; gap:6px; max-width:640px; margin:8px auto 0}
  .zapex .qcard{
    flex:1; max-width:none; min-height:44px; padding:8px 9px; gap:8px;
    flex-direction:row; align-items:center; justify-content:center; text-align:left;
  }
  .zapex .qcard .qi{font-size:17px; flex:none}
  .zapex .qcard .ql{font-size:12.5px; line-height:1.2}
  .zapex .qcard .qs{font-size:10.5px; line-height:1.2; margin-top:1px}
  /* su schermi stretti la riga di spiegazione sparisce: l'etichetta basta */
  @media(max-width:399px){ .zapex .qcard .qs{display:none} }
  /* la zona scelta si vede da lontano: fondo pieno, numero d'ordine, alone */
  .qcard.slim.on, .zapex .qcard.on{
    background:linear-gradient(180deg, var(--accent-strong), var(--accent));
    border-color:var(--accent-hi); box-shadow:0 0 0 3px var(--accent-dim), 0 6px 18px -8px var(--accent-hi);
  }
  .qcard.slim.on .ql, .zapex .qcard.on .ql, .zapex .qcard.on .qs{color:#fff}
  .qcard.slim.on{position:relative}
  .qcard.slim.on .zn{
    position:absolute; top:-6px; right:-6px; width:19px; height:19px; border-radius:50%;
    background:var(--accent-hi); color:#1a1020; font-size:11px; font-weight:800;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 0 2px var(--bg); font-variant-numeric:tabular-nums;
  }
  .zhint{text-align:center; font-size:11px; color:var(--faint); margin:8px auto 0; max-width:600px; line-height:1.4}
  @media(max-width:400px){
    .zwrap{gap:9px}
    .zwrap .bodyfig svg{width:84px}
    .ztier .qcard.slim .ql{font-size:11.5px}
  }

  /* v40 · anamnesi a schede, come il resto dell'app */
  .anstate{
    display:flex; align-items:center; gap:13px; margin-top:9px; padding:13px 16px;
    border-radius:var(--r-lg); border:1px solid var(--line); background:var(--surface);
    box-shadow:inset 0 1px 0 var(--hairline);
  }
  .anstate .asic{font-size:19px; line-height:1; flex:none}
  .anstate .asx{flex:1; min-width:0}
  .anstate .asx b{display:block; font-size:14.5px; letter-spacing:-.01em}
  .anstate .asx small{display:block; color:var(--muted); font-size:12px; margin-top:2px; line-height:1.4}
  .anstate.ok{border-color:color-mix(in srgb,var(--ok) 40%,transparent); background:color-mix(in srgb,var(--ok) 7%,var(--surface))}
  .anstate.ok .asx b{color:var(--ok)}
  .anstate.warn{border-color:color-mix(in srgb,var(--warn) 45%,transparent); background:color-mix(in srgb,var(--warn) 8%,var(--surface))}
  .anstate.warn .asx b{color:var(--warn)}
  .anstate.danger{border-color:color-mix(in srgb,var(--danger) 45%,transparent); background:color-mix(in srgb,var(--danger) 8%,var(--surface))}
  .anstate.danger .asx b{color:var(--danger)}
  .seclab{font-size:9.5px; font-weight:800; letter-spacing:.15em; text-transform:uppercase;
    color:var(--faint); margin:18px 0 8px}
  .anrow{display:flex; gap:9px; align-items:flex-start; font-size:13px; line-height:1.45;
    padding:8px 0; border-bottom:1px solid var(--line)}
  .anrow:last-child{border-bottom:none}
  .anrow .am{flex:none; font-weight:800; font-size:14px; line-height:1.35}
  .anrow.red .am{color:var(--danger)}
  .anrow.amb .am{color:var(--warn)}
  .prefgrid{display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin-top:8px}
  .prefc{
    display:block; width:100%; text-align:left; font:inherit; cursor:pointer;
    background:var(--surface2); border:1px solid var(--line); border-radius:var(--r-md); padding:10px 12px;
    transition:transform .14s cubic-bezier(.32,.72,0,1), border-color .16s, background .16s;
  }
  .prefc:active{transform:scale(.97); border-color:var(--accent); background:var(--accent-dim)}
  .prefc .pc-t{display:flex; align-items:center; gap:6px}
  .prefc .pc-ic{font-size:13px; line-height:1}
  .prefc .pc-l{font-size:9.5px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--faint)}
  .prefc .pc-v{display:block; font-size:14px; font-weight:800; margin-top:5px; letter-spacing:-.01em; line-height:1.3; color:var(--text)}
  .prefc.flag{border-color:color-mix(in srgb,var(--warn) 45%,transparent);
    background:color-mix(in srgb,var(--warn) 8%,var(--surface2))}
  .prefc.flag .pc-v{color:var(--warn)}
  .prefnote{font-size:11.5px; color:var(--faint); margin-top:8px; line-height:1.5}
  .opnote{margin-top:9px; padding:11px 14px; border-radius:var(--r-md);
    background:var(--surface2); border:1px solid var(--line); font-size:13px; color:var(--muted); line-height:1.5}
  .opnote b{color:var(--text); font-weight:700}

  /* v39 · scheda cliente: testata ordinata, livello leggibile */
  .chtags{display:flex; gap:7px; flex-wrap:wrap; align-items:center; margin-top:9px}
  .lvstrip{margin-top:15px; padding-top:14px; border-top:1px solid var(--line)}
  .lvtop{display:flex; align-items:center; justify-content:space-between; gap:12px}
  .lvstrip .lvn{font-size:23px; font-weight:800; line-height:1; white-space:nowrap}
  .lvstrip .lvn small{font-size:11.5px; color:var(--faint); font-weight:600; margin-left:4px}
  .lvstrip .pbar{margin:12px 0 7px}
  .lvto{font-size:11.5px; color:var(--faint)}
  .dzone{margin-top:26px; border-radius:var(--r-lg); padding:15px 17px;
    border:1px solid color-mix(in srgb,var(--danger) 32%,transparent);
    background:color-mix(in srgb,var(--danger) 7%,var(--surface))}
  .dzone .dzt{font-size:10px; font-weight:800; letter-spacing:.16em; text-transform:uppercase;
    color:var(--danger); margin-bottom:6px}
  .dzone p{font-size:12.5px; color:var(--muted); margin:0 0 12px; line-height:1.5}

  /* sagoma corpo umano */
  .bodywrap{display:flex; gap:18px; justify-content:center; align-items:center; margin:14px 0 6px; flex-wrap:wrap}
  .ztier{display:flex; gap:10px; justify-content:center; margin-top:10px}
  .ztier .qcard.slim{min-height:46px; padding:10px 8px}
  .ztier.t1 .qcard{width:158px}
  .ztier.t2 .qcard{width:150px}
  .ztier.t3 .qcard{width:142px}
  .zapex{display:flex; justify-content:space-between; gap:12px; max-width:640px; margin:16px auto 0}
  .zapex .qcard{flex:1; max-width:290px}
  .bodyfig{text-align:center}
  .bodyfig svg{width:130px; height:auto; display:block}
  .bodyfig .sil path, .bodyfig .sil circle{fill:var(--surface2); stroke:var(--line); stroke-width:1.5}
  .bodyfig .face circle{fill:var(--faint); stroke:none}
  .bodyfig .face path{stroke:var(--faint); stroke-width:1.2; fill:none}
  .bodyfig .face path.hair{fill:var(--line); stroke:var(--line)}
  .bodyfig .bz rect{fill:transparent; stroke:var(--faint); stroke-width:1; stroke-dasharray:3 3; cursor:pointer; transition:fill .15s ease, stroke .15s ease}
  .bodyfig .bz:active rect{fill:var(--accent-dim)}
  .bodyfig .bz.on rect{fill:var(--accent-hi); fill-opacity:.9; stroke:#fff; stroke-width:1.4; stroke-dasharray:none; filter:drop-shadow(0 0 7px var(--accent-hi))}
  .bodylabel{font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); margin-top:6px}

  /* slogan 25,3 milioni */
  .slogan{
    text-align:center; margin:20px auto 4px; max-width:640px;
    font-size:13.5px; font-weight:700; letter-spacing:.06em; color:var(--accent-strong);
    background:var(--accent-dim); border:1px solid var(--accent); border-radius:999px; padding:9px 20px;
  }
  .slogan b{font-variant-numeric:tabular-nums}

  /* messaggi rotanti in cima alla Home — punti fermi di vendita, procedure, mindset */
  .herorot{
    display:flex; align-items:center; gap:11px; flex-wrap:wrap;
    margin:10px auto 0; max-width:700px; min-height:0;
    font-size:12.5px; line-height:1.4; color:var(--text);
    background:var(--surface); border:1px solid var(--line); border-left:3px solid var(--accent);
    border-radius:13px; padding:8px 13px;
    transition:opacity .4s ease, border-color .5s ease, background .5s ease;
  }
  .herorot .hr-tag{
    flex:none; font-size:9px; font-weight:800; letter-spacing:.14em; text-transform:uppercase;
    color:var(--accent-strong); border:1px solid currentColor; border-radius:999px; padding:2px 9px; opacity:.92;
  }
  .herorot .hr-txt{flex:1; min-width:180px}
  .herorot .hr-txt b{font-weight:800; font-variant-numeric:tabular-nums}
  .herorot.k-sale  { border-left-color:var(--accent-strong) }
  .herorot.k-sale  .hr-tag,  .herorot.k-sale  .hr-txt b{color:var(--accent-hi)}
  .herorot.k-unique{ border-left-color:#d4af37; background:linear-gradient(90deg, rgba(212,175,55,.07), var(--surface) 60%) }
  .herorot.k-unique .hr-tag, .herorot.k-unique .hr-txt b{color:#d4af37}
  .herorot.k-proc  { border-left-color:#8fb2c9 }
  .herorot.k-proc  .hr-tag,  .herorot.k-proc  .hr-txt b{color:#9fc2d6}
  .herorot.k-mind  { border-left-color:#4ec38a }
  .herorot.k-mind  .hr-tag,  .herorot.k-mind  .hr-txt b{color:#5fcf97}
  @media (prefers-reduced-motion:reduce){ .herorot{transition:none} }

  /* mascotte */
  #mascot{
    position:fixed; left:14px; bottom:calc(196px + env(safe-area-inset-bottom)); z-index:90; max-width:min(270px,52vw);
    display:none; align-items:flex-end; gap:8px; cursor:pointer; touch-action:none; user-select:none; -webkit-user-select:none;
  }
  #mascot.dragging{transition:none; cursor:grabbing; z-index:120}
  #mascot.dragging .mz{transform:scale(1.14); box-shadow:0 10px 26px rgba(0,0,0,.55), 0 0 0 6px var(--accent-dim)}
  #mascot.dragging .mb{opacity:.55}
  #mascot .mz{transition:transform .16s cubic-bezier(.32,.72,0,1), box-shadow .16s cubic-bezier(.32,.72,0,1)}
  #mascot.show{display:flex}
  #mascot .mz{
    width:44px; height:44px; border-radius:50%; flex:none;
    background:linear-gradient(135deg, var(--accent), var(--accent-strong));
    color:#fff; font-weight:800; font-size:20px; display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 14px rgba(0,0,0,.4); border:2px solid var(--bg);
  }
  #mascot .mb{
    background:var(--surface2); border:1px solid var(--accent); border-radius:14px 14px 14px 4px;
    padding:10px 14px; font-size:13px; line-height:1.45; box-shadow:0 8px 24px rgba(0,0,0,.45);
  }
  #mascot .mb b{color:var(--accent-strong)}
  @media (prefers-reduced-motion: no-preference){
    #mascot.show{animation:mpop .3s ease}
    @keyframes mpop{from{opacity:0; transform:translateY(10px)}to{opacity:1; transform:none}}
  }

  .recbar{
    background:linear-gradient(90deg, rgba(212,175,55,.16), var(--surface));
    border:1px solid #d4af37; border-radius:12px; padding:12px 16px; margin:4px 0 14px;
    font-size:14px; cursor:pointer;
  }
  .recbar .recmot{font-size:13px; color:var(--muted); margin-top:4px}
  .sbar{margin-bottom:10px}
  .sbar .sl{display:flex; justify-content:space-between; font-size:13.5px; margin-bottom:3px}
  .sbar .sl b{font-variant-numeric:tabular-nums}
  .sbar .st{height:10px; background:var(--surface2); border-radius:999px; overflow:hidden}
  .sbar .sf{height:100%; border-radius:999px; min-width:4px}

  /* stat tiles differenziate */
  .stat{border-top:3px solid transparent}
  .stat.s1{border-top-color:var(--accent)} .stat.s1 .n{color:var(--accent-strong)}
  .stat.s2{border-top-color:var(--ok)} .stat.s2 .n{color:var(--ok)}
  .stat.s3{border-top-color:#d4af37} .stat.s3 .n{color:#d4af37}
  .stat .ic{font-size:15px; opacity:.8}

  /* bottoni scheda cliente: stessa misura, colori diversi */
  .btnrow.equal{display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:10px}
  .btnrow.equal .btn{width:100%; padding:15px 10px; font-size:15px}
  .btn.info{background:rgba(143,178,201,.16); color:#9fc2d6; border:1px solid rgba(143,178,201,.4)}
  /* oro: muove TUTTO l'archivio — lo stesso colore che la guida usa per il backup */
  .btn.oro{background:rgba(212,175,55,.15); color:#d9be5e; border:1px solid rgba(212,175,55,.42)}
  .btn.info:active{background:rgba(143,178,201,.3)}

  /* marcatori: cerchio rosso = tocca/attiva · quadrato ambra = valore da regolare */
  .marker.sq{
    border-radius:14px; border-color:#f0a832;
    box-shadow:0 0 0 3px rgba(240,168,50,.25), 0 0 18px rgba(240,168,50,.5);
  }
  .marker.sq .mn{background:#f0a832; color:#fff}
  .glegend .gn.set{background:#f0a832}

  /* stella preferito e ripeti */
  .starbtn,.repbtn{
    margin-left:6px; background:none; border:1px solid var(--line); color:var(--faint);
    border-radius:8px; width:36px; height:36px; font-size:16px; cursor:pointer; flex:none;
  }
  .starbtn.on{color:#d4af37; border-color:#d4af37; background:rgba(212,175,55,.12)}
  .favfilter{
    display:inline-flex; align-items:center; gap:8px; margin-bottom:10px;
    border:1.5px solid rgba(212,175,55,.55); border-radius:999px; padding:8px 16px;
    font-size:13px; color:#d4af37; cursor:pointer; background:rgba(212,175,55,.06);
    transition:transform .09s ease, background .12s ease;
  }
  .favfilter:active{transform:scale(.97)}
  .favfilter.on{background:rgba(212,175,55,.2); box-shadow:inset 0 2px 6px rgba(0,0,0,.3)}
  .favfilter .ff-star{font-size:15px}
  .favcard{border:1.5px solid #d4af37; border-radius:12px; overflow:hidden; margin-top:8px; background:rgba(212,175,55,.06)}
  .favcard .favinfo{padding:9px 12px; font-size:13px; color:#e8d9a0}
  .favcard .favgo{
    background:rgba(212,175,55,.2); border-top:1px solid rgba(212,175,55,.5);
    text-align:center; padding:9px; font-size:12px; font-weight:800; letter-spacing:.12em;
    color:#d4af37; cursor:pointer; transition:transform .09s ease, background .12s ease;
  }
  .favcard .favgo:active{background:rgba(212,175,55,.35); transform:scale(.98)}
  .clienthead{padding:16px 16px}
  .clienthead .chrow{display:flex; align-items:flex-start; gap:14px}
  .chside{display:flex; gap:11px; flex:1; min-width:0}
  .chside .chtx{flex:1; min-width:0}
  .chleft{align-items:flex-start}
  .chright{align-items:flex-start; text-align:right}
  /* i due quadrati hanno la stessa misura: iniziali a sinistra, simbolo del livello a destra */
  .chsq{
    width:54px; height:54px; flex:none; border-radius:16px;
    display:flex; align-items:center; justify-content:center;
    font-size:19px; font-weight:800; letter-spacing:.02em;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.22);
  }
  .chlvsq{font-size:22px; box-shadow:inset 0 1px 0 rgba(255,255,255,.22), 0 6px 18px -8px var(--lc)}
  .chnome{font-size:17.5px; font-weight:800; letter-spacing:-.015em; line-height:1.2; overflow-wrap:anywhere}
  .chmeta{font-size:12px; color:var(--faint); margin-top:2px; line-height:1.35;
    overflow:hidden; text-overflow:ellipsis}
  .chleft .chtags{margin-top:7px}
  .chlv{font-size:15px; font-weight:800; letter-spacing:-.01em; color:var(--lc); line-height:1.2}
  .chpt{font-size:19px; font-weight:800; line-height:1.1; margin-top:1px; font-variant-numeric:tabular-nums}
  .chpt small{font-size:10.5px; color:var(--faint); font-weight:600; margin-left:3px}
  .chright .pbar{height:7px; margin:7px 0 4px}
  .chto{font-size:10.5px; color:var(--faint); line-height:1.35}
  .chto b{color:var(--muted); font-weight:800}
  .chfirst{font-size:10.5px; color:var(--accent-hi); margin-top:5px; white-space:nowrap}
  /* sotto i 430 px le due colonne non stanno comode: si impilano, il quadrato del livello
     resta comunque all'estremo destro e i due quadrati restano della stessa misura */
  @media(max-width:430px){
    .clienthead .chrow{flex-direction:column; gap:0}
    .chside{width:100%}          /* impilate restano larghe quanto la scheda */
    .chright{border-top:1px solid var(--line); padding-top:13px; margin-top:13px}
  }

  /* battito: la seduta che arriva dalle preferite si fa trovare */
  @keyframes battito{
    0%,100%{box-shadow:0 0 0 0 transparent}
    12%    {box-shadow:0 0 0 4px var(--gold-dim, rgba(212,175,55,.35))}
    28%    {box-shadow:0 0 0 0 transparent}
    44%    {box-shadow:0 0 0 4px var(--gold-dim, rgba(212,175,55,.35))}
    62%    {box-shadow:0 0 0 0 transparent}
  }
  .sessrow.battito{animation:battito 2.4s cubic-bezier(.32,.72,0,1); border-color:var(--gold)}
  @media (prefers-reduced-motion:reduce){ .sessrow.battito{animation:none; border-color:var(--gold)} }

  /* il comando che arriva da una delle quattro preferenze si fa trovare */
  .mirablk{border-radius:12px; margin:0 -8px; padding:0 8px; transition:background .3s}
  /* dentro il blocco la riga tiene la sua linea di separazione */
  .mirablk .paramrow{border-bottom:1px solid var(--line)}
  @keyframes mirato{
    0%,100%{box-shadow:0 0 0 0 transparent}
    12%    {box-shadow:0 0 0 4px var(--accent-dim)}
    28%    {box-shadow:0 0 0 0 transparent}
    44%    {box-shadow:0 0 0 4px var(--accent-dim)}
    62%    {box-shadow:0 0 0 0 transparent}
  }
  .mirato{animation:mirato 2.4s cubic-bezier(.32,.72,0,1); background:var(--accent-dim)}
  @media (prefers-reduced-motion:reduce){ .mirato{animation:none; background:var(--accent-dim)} }

  /* tre modi di segnalare una seduta preferita */
  .sessrow.isfav{background:var(--surface)}
  .sessrow.fav-a{
    border-color:rgba(212,175,55,.5);
    background:linear-gradient(180deg, rgba(212,175,55,.07), var(--surface) 42%);
  }
  .sessrow.fav-a .sr-top .zc{color:var(--gold)}
  .sessrow.fav-b{position:relative; overflow:hidden; border-color:rgba(212,175,55,.32)}
  .sessrow.fav-b::before{
    content:"★ PREFERITA"; display:block; margin:-14px -15px 12px; padding:5px 15px;
    font-size:9px; font-weight:800; letter-spacing:.16em; color:#1a1206;
    background:linear-gradient(90deg, var(--gold), #e9c862);
  }
  .sessrow.fav-c{
    border-color:rgba(212,175,55,.4);
    box-shadow:0 0 0 3px rgba(212,175,55,.12), 0 14px 34px -18px rgba(212,175,55,.6);
  }
  .firstline{
    margin-top:12px; padding-top:10px; border-top:1px solid var(--line);
    font-size:12px; color:var(--faint);
  }
  .firstline b{color:var(--accent-strong); font-weight:700}
  .firstcard{
    background:linear-gradient(90deg, var(--accent-dim), var(--surface));
    border:1px solid var(--accent); border-radius:12px; padding:12px 16px; margin:4px 0 14px;
  }
  .firstcard .ft{font-size:10.5px; font-weight:800; letter-spacing:.2em; color:var(--accent-strong)}
  .firstcard .fd{font-size:16px; font-weight:800; margin-top:2px}
  .firstcard .fs{font-size:12.5px; color:var(--muted); margin-top:2px}
  .clientrow.ck{display:block; padding:0; overflow:hidden}
  .clientrow.ck .ckmain{display:flex; gap:14px; align-items:flex-start; padding:14px 16px}
  .clientrow.ck .ckmain{padding:14px 16px; align-items:flex-start}
  .ckstars{margin-top:5px; font-size:14px; display:flex; align-items:center; gap:6px; flex-wrap:wrap; min-height:22px}
  .ckstars .stars{color:#d4af37; letter-spacing:-1px}
  .ckright{display:flex; flex-direction:column; align-items:flex-end; gap:8px; flex:none}
  /* preferite: un solo elemento (stelle + apri) */
  .favpill{
    display:inline-flex; align-items:center; gap:7px; margin-top:7px; cursor:pointer;
    padding:5px 11px 5px 9px; border-radius:var(--r-pill); font-family:inherit;
    background:rgba(212,175,55,.10); border:1px solid rgba(212,175,55,.42); color:var(--gold);
    transition:transform .17s cubic-bezier(.32,.72,0,1), filter .17s cubic-bezier(.32,.72,0,1);
  }
  .favpill:active{transform:scale(.96); filter:brightness(1.15)}
  .favpill .fp-st{font-size:12px; letter-spacing:-1px; line-height:1}
  .favpill .fp-tx{font-size:11.5px; font-weight:800; letter-spacing:.02em}
  .favpill .fp-go{font-size:14px; font-weight:800; opacity:.75; line-height:1}
  .favpill.ph{visibility:hidden; pointer-events:none}

  /* badge Scheda: cerchio oro sotto le stelle */
  .favchip{
    margin-top:8px; padding:0; cursor:pointer;
    width:58px; height:58px; border-radius:50%;
    display:inline-flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
    background:radial-gradient(circle at 50% 34%, rgba(212,175,55,.24), rgba(212,175,55,.05));
    color:#e8d18a; border:1.5px solid rgba(212,175,55,.6);
    font-size:11px; font-weight:800; letter-spacing:.05em;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.12);
    transition:transform .09s ease, filter .12s ease, box-shadow .12s ease;
  }
  .favchip .fc-star{color:#d4af37; font-size:14px; line-height:1}
  .favchip .fc-tx{line-height:1}
  .favchip:active{transform:scale(.94); filter:brightness(1.15); box-shadow:inset 0 2px 6px rgba(0,0,0,.4)}
  .favchip.ph{visibility:hidden; pointer-events:none; border:none; background:none; box-shadow:none}
  .favbtn{
    margin-top:8px; padding:9px 12px; border:1.5px solid #d4af37; border-radius:12px;
    background:rgba(212,175,55,.1); font-size:13px; color:#e8d9a0; cursor:pointer;
    transition:transform .09s ease, background .12s ease, box-shadow .12s ease;
  }
  .favbtn:active{transform:scale(.97); background:rgba(212,175,55,.22); box-shadow:inset 0 2px 8px rgba(0,0,0,.4)}
  .favbtn .mchip{
    display:inline-block; background:rgba(212,175,55,.22); border:1px solid rgba(212,175,55,.6);
    border-radius:999px; padding:0 9px; font-size:11.5px; font-weight:700; color:#d4af37;
  }
  .favbtn .favnote{font-style:italic; color:var(--muted); font-size:12px; margin-top:3px}
  .favbtn .favhint{font-size:10.5px; color:var(--faint); margin-top:4px; letter-spacing:.03em}
  .repbtn:active{color:var(--accent-strong); border-color:var(--accent)}
  .starbtn:active{transform:scale(.88)}

  /* firma anamnesi */
  .sigwrap{margin-top:10px}
  #sigpad{
    width:100%; height:170px; display:block; touch-action:none; cursor:crosshair;
    background:var(--surface2); border:2px dashed var(--accent); border-radius:12px;
  }
  .sighint{font-size:12px; color:var(--faint); text-align:center; margin:6px 0 10px}
  .siglocked{
    background:var(--surface2); border:1px solid var(--ok); border-radius:12px; padding:14px 16px;
  }
  .siglocked img{max-width:280px; width:100%; background:#fff; border-radius:8px; display:block; margin:10px 0}
  .sigchip{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:700; color:var(--ok)}

  ul.tick{list-style:none; padding:0; margin:10px 0}
  ul.tick li{padding-left:26px; position:relative; margin-bottom:9px; font-size:14.5px}
  ul.tick li::before{content:"—"; position:absolute; left:2px; color:var(--accent); font-weight:700}

  /* pressed feedback — elegante ma ben visibile */
  .btn,.tile,.seg .opt,.clientrow,.yn button,.pinpad button,.stepper button,.btn-back,.delbtn,.sw{
    transition:transform .09s ease, filter .12s ease, background .12s ease, border-color .12s ease, box-shadow .12s ease;
  }
  .btn:active{transform:scale(.955); filter:brightness(1.18); box-shadow:0 0 0 4px var(--accent-dim)}
  .btn.sec:active,.btn.ghost:active,.btn-back:active{background:var(--accent-dim); color:var(--accent-strong); border-color:var(--accent); transform:scale(.96)}
  .btn.danger:active{box-shadow:0 0 0 4px var(--danger-dim); border-color:var(--danger)}
  .tile:active{transform:scale(.965); background:var(--accent-dim); border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-dim)}
  .seg .opt:active{transform:scale(.93); border-color:var(--accent); color:var(--accent-strong); background:var(--accent-dim)}
  .clientrow:active{transform:scale(.985); border-color:var(--accent); background:var(--accent-dim)}
  .pinpad button:active{transform:scale(.9); background:var(--accent-dim); border-color:var(--accent); color:var(--accent-strong)}
  .stepper button:active,.yn button:active{transform:scale(.88); border-color:var(--accent)}
  @media (prefers-reduced-motion: reduce){
    .btn:active,.tile:active,.seg .opt:active,.clientrow:active,.pinpad button:active,.stepper button:active,.yn button:active{transform:none}
  }

  /* cestino sessioni */
  .delbtn{
    margin-left:8px; background:none; border:1px solid var(--line); color:var(--faint);
    border-radius:8px; width:36px; height:36px; font-size:15px; cursor:pointer; flex:none;
  }
  .delbtn:active{border-color:var(--danger); color:var(--danger); background:var(--danger-dim); transform:scale(.88)}

  /* modale codice segreto */
  #modal{display:none; position:fixed; inset:0; background:var(--overlay); backdrop-filter:blur(7px); -webkit-backdrop-filter:blur(7px); z-index:200; align-items:flex-end; justify-content:center; padding:0}
  #modal.open{display:flex}
  #modal .mcard{
    background:var(--surface); border:1px solid var(--line); border-bottom:none;
    border-radius:26px 26px 0 0; padding:30px 22px calc(24px + env(safe-area-inset-bottom));
    max-width:600px; width:100%; position:relative;
    box-shadow:0 -18px 60px rgba(10,6,16,.55); animation:sheetup .2s cubic-bezier(.32,.72,0,1);
    max-height:88vh; overflow-y:auto;   /* i fogli lunghi scorrono invece di uscire dallo schermo */
  }
  #modal .mcard::before{content:""; position:absolute; top:10px; left:50%; transform:translateX(-50%); width:40px; height:4px; border-radius:999px; background:var(--line)}

/* ---------- storage (localStorage con fallback in memoria) ---------- */
let MEM = null;
const store = {
  ok: true,
  load(){ try{ const s = localStorage.getItem('zfl_app_v1'); return s ? JSON.parse(s) : null; }catch(e){ this.ok=false; return MEM; } },
  save(d){ MEM = d; try{ localStorage.setItem('zfl_app_v1', JSON.stringify(d)); }catch(e){ this.ok=false; } }
};
function hash(s){ let h=5381; for(let i=0;i<s.length;i++){ h=((h<<5)+h+s.charCodeAt(i))>>>0; } return 'h'+h.toString(36); }
function normA(s){ return String(s||'').trim().toLowerCase().replace(/\s+/g,' '); }
let DB = store.load() || { codeHash: hash('1234'), codeLen: 4, clients: [], sessions: [] };
/* Il macchinario si chiama Vacutherm: rinomino una volta sola quello gia scritto nelle schede. */
(function migraVacutherm(){
  let cambiato = false;
  (DB.clients||[]).forEach(c=>{
    if(Array.isArray(c.attivita) && c.attivita.includes('Vacufit')){
      c.attivita = c.attivita.map(a => a==='Vacufit' ? 'Vacutherm' : a);
      cambiato = true;
    }
  });
  if(cambiato) persist();
})();
try{ if(localStorage.getItem('zenithTheme')==='light') document.documentElement.classList.add('light'); }catch(e){}
function toggleTheme(){
  const el = document.documentElement; el.classList.toggle('light');
  try{ localStorage.setItem('zenithTheme', el.classList.contains('light')?'light':'dark'); }catch(e){}
  render();
}
/* Da tre codici a uno solo. Chi aggiorna non deve reimparare niente: il
   Codice Zenith parte uguale al PIN che gia' digitava all'avvio. */
(function migraCodiceUnico(){
  if (DB.codeHash) return;
  DB.codeHash = DB.pinHash || hash('1234');
  DB.codeLen  = 4;                       /* il vecchio PIN era sempre di 4 cifre */
  DB.codeLock = (DB.pinLock === true);
  delete DB.pinHash; delete DB.delHash; delete DB.adminHash;
  delete DB.adminEnc; delete DB.pinLock;
  persist();
})();
if (DB.codeLen === undefined) DB.codeLen = 4;
if (DB.secQ === undefined) DB.secQ = null;   /* [{q, aHash} x3] — l'unico modo per rientrare */
function persist(){ store.save(DB); }

function pchip(code, stop){
  const P = PROGRAMS[code]; if(!P) return code;
  return `<span class="pchip" onclick="openProg('${code}')${stop?'; event.stopPropagation()':''}">${code}<span class="ptip"><b>${code} · ${P.o}</b><br>${P.d}<div class="pc">${P.cat.map(c=>`<span class=\"chip\" style=\"margin:1px; font-size:10.5px\">${c}</span>`).join(' ')}</div><div style="margin-top:6px; color:var(--faint); font-size:11px">tocca per aprire l'elenco completo</div></span></span>`;
}
function openProg(code){
  go('legend');
  setTimeout(()=>{
    const r = document.getElementById('prog-'+code);
    if(r){ r.scrollIntoView({block:'center'}); r.classList.add('hl'); setTimeout(()=>r.classList.remove('hl'), 2600); }
  }, 60);
}
