/* ---------- STORICO GLOBALE ---------- */
function dayKey(iso){ return new Date(iso).toLocaleDateString('sv-SE'); } /* YYYY-MM-DD locale */
function recordDay(){
  const byDay = {};
  DB.sessions.forEach(s=>{ const k=dayKey(s.date); byDay[k]=(byDay[k]||0)+1; });
  let best=null, n=0;
  Object.entries(byDay).forEach(([k,v])=>{ if(v>n || (v===n && (!best || k>best))){ best=k; n=v; } });
  return best ? {day:best, n} : null;
}

  ['YE','🇾🇪','Yemen','+967',false],
  ['ZM','🇿🇲','Zambia','+260',false],
  ['ZW','🇿🇼','Zimbabwe','+263',false],
];
const PFX_DEF = 'IT';
let PFX = {aperto:false, cerca:''};

/* il paese di un cliente: prima il codice salvato, poi il prefisso, poi Italia */
function paeseDi(c){
  if(!c) return PAESI[0];
  if(c.paeseIso){
    const p = PAESI.find(x=>x[0]===c.paeseIso);
    if(p) return p;
  }
  if(c.prefisso){
    const p = PAESI.find(x=>x[3]===c.prefisso);
    if(p) return p;
  }
  return PAESI.find(x=>x[0]===PFX_DEF);
}
function pfxDi(c){ return paeseDi(c)[3]; }
/* il numero come si scrive per chiamarlo: prefisso e poi il resto */
function telCompleto(c){
  if(!c || !c.telefono) return '';
  return pfxDi(c) + ' ' + c.telefono;
}
function pfxApri(){
  captureDraftForm();
  PFX.aperto = !PFX.aperto;
  if(!PFX.aperto) PFX.cerca = '';
  render();
}
function pfxScegli(iso){
  captureDraftForm();
  const p = PAESI.find(x=>x[0]===iso); if(!p) return;
  draftClient.paeseIso = p[0];
  draftClient.prefisso = p[3];
  PFX = {aperto:false, cerca:''};
  render();
}
/* filtra senza ridisegnare la pagina, altrimenti la ricerca perde il fuoco */
function pfxFiltra(q){
  PFX.cerca = q;
  const box = document.getElementById('pfx_lista');
  if(box) box.innerHTML = pfxRighe();
}
function pfxTrovati(){
  const q = PFX.cerca.trim().toLowerCase().replace(/^\+/, '');
  if(!q) return PAESI;
  return PAESI.filter(([iso,fl,nome,pre]) =>
    nome.toLowerCase().includes(q) || pre.replace('+','').startsWith(q) || iso.toLowerCase()===q);
}
function pfxRighe(){
  const scelto = paeseDi(draftClient)[0];
  const L = pfxTrovati();
  if(!L.length) return '<div class="pfx-vuoto">Nessun paese trovato</div>';
  return L.map(([iso,fl,nome,pre],i)=>{
    /* la riga di stacco fra i piu usati e il resto dell'elenco */
    const stacco = !PFX.cerca.trim() && i>0 && L[i-1][4] && !L[i][4];
    return (stacco ? '<div class="pfx-sep">Tutti i paesi</div>' : '') +
      `<button class="pfx-r ${iso===scelto?'on':''}" onclick="pfxScegli('${iso}')">
        <span class="pfx-fl">${fl}</span><span class="pfx-nm">${nome}</span>
        <span class="pfx-pr">${pre}</span></button>`;
  }).join('');
}
function pfxPicker(c){
  const [iso, fl, nome, pre] = paeseDi(c);
  return `<div class="pfxbox">
    <button class="pfx-p ${PFX.aperto?'on':''}" onclick="pfxApri()"
      title="Scegli il paese del numero">
      <span class="pfx-fl">${fl}</span><span class="pfx-pr big">${pre}</span>
      <span class="pfx-nm2">${nome}</span><i>${PFX.aperto?'▴':'▾'}</i></button>
    ${PFX.aperto?`<div class="pfx-pan">
      <input type="text" id="pfx_cerca" class="pfx-cerca" placeholder="Cerca il paese o il prefisso"
        value="${esc(PFX.cerca)}" oninput="pfxFiltra(this.value)" autocomplete="off">
      <div class="pfx-lista" id="pfx_lista">${pfxRighe()}</div>
    </div>`:''}
  </div>`;
}
/* se qualcuno incolla il numero col prefisso dentro, lo sposto io al suo posto */
function telNormalizza(el){
  let v = el.value.trim().replace(/^00/, '+');
  if(v[0] === '+'){
    const cand = PAESI.slice().sort((a,b)=>b[3].length-a[3].length)
      .find(p => v.replace(/[\s.-]/g,'').startsWith(p[3]));
    if(cand){
      draftClient.paeseIso = cand[0];
      draftClient.prefisso = cand[3];
      v = v.replace(/[\s.-]/g,'').slice(cand[3].length);
      el.value = v;
      draftClient.telefono = v;
      render();
      return;
    }
  }
  el.value = v;
}

/* ---------- DATA DI NASCITA: giorno · mese · anno ----------
   Per una data di nascita il calendario a mesi e' scomodo: qui si sceglie
   direttamente il giorno, il mese e l'anno, in quest'ordine di lettura. */
const MESI_BREVI = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno',
                    'Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
let BD_STYLE = 'a';               /* 'a' tre pastiglie · 'b' tre colonne · 'c' a passi guidati */
let BD = {aperto:null, pag:0};    /* quale parte e' aperta e la pagina degli anni */

function bdParti(iso){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso||'');
  return m ? {a:+m[1], m:+m[2]-1, g:+m[3]} : {a:null, m:null, g:null};
}
function bdGiorniNelMese(a, m){
  if(a==null || m==null) return 31;
  return new Date(a, m+1, 0).getDate();
}
function bdScrivi(p){
  if(p.a==null || p.m==null || p.g==null){ draftClient.nascita = ''; return; }
  const g = Math.min(p.g, bdGiorniNelMese(p.a, p.m));   /* 31 gennaio → 28 febbraio */
  draftClient.nascita = p.a + '-' + String(p.m+1).padStart(2,'0') + '-' + String(g).padStart(2,'0');
}
function bdApri(parte){
  captureDraftForm();
  BD.aperto = (BD.aperto===parte) ? null : parte;
  if(parte==='a'){
    /* mi apro sulla pagina che contiene davvero l'anno gia impostato */
    const p = bdParti(draftClient.nascita);
    const base = p.a || (new Date().getFullYear() - 35);
    BD.pag = Math.max(0, Math.ceil((bdAnnoMax() - base - BD_PER_PAGINA + 1) / BD_PER_PAGINA));
  }
  render();
}
function bdScegli(parte, v){
  captureDraftForm();
  const p = bdParti(draftClient.nascita);
  if(p.a==null) { p.a = new Date().getFullYear()-35; p.m = 0; p.g = 1; }
  p[parte] = v;
  bdScrivi(p);
  /* a passi guidati si prosegue da solo: anno → mese → giorno */
  if(BD_STYLE==='c') BD.aperto = parte==='a' ? 'm' : parte==='m' ? 'g' : null;
  else BD.aperto = null;
  render();
}
function bdPagina(d){ BD.pag += d; render(); }
/* ogni colonna si apre gia centrata sul valore scelto */
function bdAncora(){
  document.querySelectorAll('.bd-b .bd-grid').forEach(g=>{
    const on = g.querySelector('.bd-o.on'); if(!on) return;
    const gr = g.getBoundingClientRect(), or = on.getBoundingClientRect();
    g.scrollTop += (or.top - gr.top) - (gr.height - or.height)/2;
  });
}
/* Gli anni si leggono esattamente come i giorni e come i mesi: dal primo
   all'ultimo, da sinistra a destra e riga dopo riga. I giorni salgono da 1 a 31,
   i mesi da Gennaio a Dicembre, gli anni dal piu vecchio della pagina al piu
   recente. Cambiando pagina si riparte sempre dall'angolo in alto a sinistra. */
const BD_PER_PAGINA = 12;
function bdAnnoMax(){ return new Date().getFullYear() - 5; }   /* il piu recente proposto */
function bdAnni(){
  const fine  = bdAnnoMax() - BD.pag*BD_PER_PAGINA;            /* ultimo in basso a destra */
  const primo = fine - BD_PER_PAGINA + 1;                      /* primo in alto a sinistra */
  return Array.from({length:BD_PER_PAGINA}, (_,i)=>primo+i);
}
function bdGriglia(parte, p){
  if(parte==='g'){
    const n = bdGiorniNelMese(p.a, p.m);
    return `<div class="bd-grid g-gg">${Array.from({length:n},(_,i)=>i+1).map(g=>
      `<button class="bd-o ${g===p.g?'on':''}" onclick="bdScegli('g',${g})">${g}</button>`).join('')}</div>`;
  }
  if(parte==='m'){
    return `<div class="bd-grid g-mm">${MESI_BREVI.map((n,i)=>
      `<button class="bd-o ${i===p.m?'on':''}" onclick="bdScegli('m',${i})">${n}</button>`).join('')}</div>`;
  }
  if(BD_STYLE==='b'){
    /* nelle tre colonne l'anno si scorre: nessuna pagina da voltare */
    const piu = bdAnnoMax();
    const lista = Array.from({length:91}, (_,i)=>piu-90+i);   /* dal piu vecchio al piu recente */
    return `<div class="bd-grid g-aa">${lista.map(a=>
      `<button class="bd-o ${a===p.a?'on':''}" onclick="bdScegli('a',${a})">${a}</button>`).join('')}</div>`;
  }
  const anni = bdAnni();
  return `<div class="bd-anni">
    <button class="zc-nav" onclick="bdPagina(1)" title="Anni precedenti">‹</button>
    <div class="bd-grid g-aa">${anni.map(a=>
      `<button class="bd-o ${a===p.a?'on':''}" onclick="bdScegli('a',${a})">${a}</button>`).join('')}</div>
    <button class="zc-nav" onclick="bdPagina(-1)" ${BD.pag<=0?'disabled':''} title="Anni successivi">›</button>
  </div>`;
}
function bdPicker(c){
  const p = bdParti(c.nascita);
  const E = {g: p.g!=null ? p.g : 'Giorno',
             m: p.m!=null ? MESI_BREVI[p.m] : 'Mese',
             a: p.a!=null ? p.a : 'Anno'};
  const pill = k => `<button class="bd-p ${BD.aperto===k?'on':''} ${p[k]!=null?'pieno':''}"
      onclick="bdApri('${k}')">${E[k]}<i>${BD.aperto===k?'▴':'▾'}</i></button>`;

  if(BD_STYLE==='b'){
    return `<div class="bdbox bd-b">
      <div class="bd-col"><div class="bd-h">Giorno</div>${bdGriglia('g',p)}</div>
      <div class="bd-col"><div class="bd-h">Mese</div>${bdGriglia('m',p)}</div>
      <div class="bd-col"><div class="bd-h">Anno</div>${bdGriglia('a',p)}</div>
    </div>`;
  }
  if(BD_STYLE==='c'){
    const passo = BD.aperto || (p.a==null ? 'a' : null);
    const eti = {a:'Scegli l\'anno', m:'Scegli il mese', g:'Scegli il giorno'};
    return `<div class="bdbox bd-c">
      <button class="bd-sintesi ${c.nascita?'on':''}" onclick="bdApri('${p.a==null?'a':'a'}')">
        ${icon('cal',16)}<span>${c.nascita ? fmtBirth(c.nascita) : 'Tocca per scegliere la data'}</span>
        <i class="fb-cv">${passo?'▴':'▾'}</i></button>
      ${passo?`<div class="bd-pass"><div class="bd-h">${eti[passo]}</div>${bdGriglia(passo,p)}</div>`:''}
    </div>`;
  }
  return `<div class="bdbox bd-a">
    <div class="bd-pills">${pill('g')}${pill('m')}${pill('a')}</div>
    ${BD.aperto?`<div class="bd-pan">${bdGriglia(BD.aperto,p)}</div>`:''}
  </div>`;
}

/* ---------- CALENDARIO INTERNO ----------
   Il selettore nativo del telefono e' bianco e non si puo' ridisegnare:
   qui il calendario e' dell'app, scuro, coi giorni in quadratini arrotondati. */
/* Un solo calendario per tutto il gestionale: lo storico lo apre per filtrare,
   la scheda cliente per la data di nascita. Cambia solo cosa succede alla scelta. */
let CALX = {quale:null, y:0, m:0, vista:'giorni'};
const DOW = ['L','M','M','G','V','S','D'];
const MESI = ['gennaio','febbraio','marzo','aprile','maggio','giugno',
              'luglio','agosto','settembre','ottobre','novembre','dicembre'];
function calValore(quale){
  return quale==='nascita' ? (draftClient && draftClient.nascita) || '' : (VIEW.fdate || '');
}
function calOpen(quale){
  quale = quale || 'storico';
  if(quale==='nascita') captureDraftForm();          /* non perdo quello che sta scrivendo */
  const v = calValore(quale);
  const base = v ? new Date(v+'T12:00') : (quale==='nascita' ? new Date(new Date().getFullYear()-35, 0, 1) : new Date());
  CALX = {quale, y:base.getFullYear(), m:base.getMonth(), vista:'giorni'};
  render();
}
function calClose(){ CALX.quale = null; render(); }
function calMove(d){
  let m = CALX.m + d, y = CALX.y;
  if(m < 0){ m = 11; y--; } if(m > 11){ m = 0; y++; }
  CALX.m = m; CALX.y = y; render();
}
function calAnno(d){ CALX.y += d; render(); }
function calVista(v){ CALX.vista = v; render(); }
function calScegliAnno(y){ CALX.y = y; CALX.vista = 'giorni'; render(); }
function calPick(k){
  if(CALX.quale==='nascita'){ draftClient.nascita = k; }
  else { VIEW.fdate = k; }
  CALX.quale = null; render();
}
function calBody(){
  const quale = CALX.quale, y = CALX.y, m = CALX.m;
  const sel = calValore(quale);
  const conDots = quale==='storico';
  const oggiK = dayKey(new Date().toISOString());
  let corpo;
  if(CALX.vista === 'anni'){
    const base = Math.floor(y/12)*12;
    corpo = `<div class="zc-anni">${Array.from({length:12},(_,i)=>{
      const a = base+i;
      return `<button class="zc-a ${a===y?'scelto':''}" onclick="calScegliAnno(${a})">${a}</button>`;
    }).join('')}</div>`;
  } else {
    const offset = (new Date(y, m, 1).getDay() + 6) % 7;   /* la settimana inizia di lunedi */
    const giorni = new Date(y, m+1, 0).getDate();
    const conta = {};
    if(conDots) DB.sessions.forEach(x=>{ const k = dayKey(x.date); conta[k] = (conta[k]||0)+1; });
    let celle = '';
    for(let i=0;i<offset;i++) celle += '<span class="zc-d vuota"></span>';
    for(let g=1; g<=giorni; g++){
      const k = y+'-'+String(m+1).padStart(2,'0')+'-'+String(g).padStart(2,'0');
      const n = conta[k]||0;
      const cls = [n?'con':'', k===sel?'scelto':'', k===oggiK?'oggi':''].filter(Boolean).join(' ');
      celle += `<button class="zc-d ${cls}" onclick="calPick('${k}')">${g}${n?`<i title="${n} sedute"></i>`:''}</button>`;
    }
    corpo = `<div class="zc-dow">${DOW.map(d=>`<span>${d}</span>`).join('')}</div>
             <div class="zc-grid">${celle}</div>`;
  }
  const anni = CALX.vista==='anni';
  return `<div class="zcal">
    <div class="zc-head">
      <button class="zc-nav" onclick="${anni?`calAnno(-12)`:'calMove(-1)'}" aria-label="Indietro">‹</button>
      <button class="zc-title" onclick="calVista('${anni?'giorni':'anni'}')"
        title="${anni?'Torna ai giorni':'Scegli l\'anno'}">${anni ? (Math.floor(y/12)*12)+'–'+(Math.floor(y/12)*12+11) : MESI[m]+' '+y}<i>${anni?'▴':'▾'}</i></button>
      <button class="zc-nav" onclick="${anni?`calAnno(12)`:'calMove(1)'}" aria-label="Avanti">›</button>
    </div>
    ${corpo}
    <div class="zc-foot">
      ${anni ? '<span class="zc-leg">Scegli l\'anno, poi il mese</span>'
             : conDots ? '<span class="zc-leg"><i></i> giorni con sedute</span>'
             : '<span class="zc-leg">Tocca il mese per cambiare anno</span>'}
      <button class="zc-close" onclick="calClose()">Chiudi</button>
    </div>
  </div>`;
}
/* disposizione della barra filtri: 'a' calendario in mezzo · 'b' calendario sopra · 'c' segmento sotto */
let FB_STYLE = 'c';
function filterBar(todayK, todayN, tot, filter, nMostrate){
  const etichetta = filter
    ? new Date(filter+'T12:00').toLocaleDateString('it-IT', FB_STYLE==='a'
        ? {day:'numeric', month:'short'} : {day:'numeric', month:'long', year:'numeric'})
    : (FB_STYLE==='a' ? 'Data' : 'Scegli una data');
  const aperto = CALX.quale==='storico';
  const cal = `<button class="fb-cal ${filter?'on':''}" onclick="${aperto?'calClose()':"calOpen('storico')"}">
      ${icon('cal',17)}<span>${etichetta}</span><i class="fb-cv">${aperto?'▲':'▼'}</i></button>`;
  const oggi = `<button class="fb-b ${filter===todayK?'on':''}" onclick="VIEW.fdate='${todayK}'; CALX.quale=null; render()">Oggi <b>${todayN}</b></button>`;
  const tutte = `<button class="fb-b ${!filter?'on':''}" onclick="VIEW.fdate=null; CALX.quale=null; render()">Tutte <b>${tot}</b></button>`;
  /* il conteggio non e piu una didascalia sotto i tasti: e la testata del risultato,
     subito prima della prima seduta, col numero grande e il giorno per esteso */
  const quando = filter
    ? new Date(filter+'T12:00').toLocaleDateString('it-IT',{weekday:'long', day:'numeric', month:'long'})
    : 'in archivio';
  const conteggio = `<div class="cxbar">
      <span class="cx-n">${nMostrate}</span>
      <span class="cx-t"><b>sedut${nMostrate===1?'a':'e'}</b><small>${quando}</small></span>
    </div>`;
  let barra;
  if(FB_STYLE==='b') barra = `<div class="filterbar fb-b2">
      <div class="fb-r1">${cal}</div>
      <div class="fb-r2">${oggi}${tutte}</div>
      ${aperto?calBody():''}</div>`;
  else if(FB_STYLE==='c') barra = `<div class="filterbar fb-c">
      <div class="fb-r1">${cal}</div>
      <div class="fb-seg">${oggi}${tutte}</div>
      ${aperto?calBody():''}</div>`;
  else barra = `<div class="filterbar fb-a">
      <div class="fb-r1">${oggi}${cal}${tutte}</div>
      ${aperto?calBody():''}</div>`;
  return barra + conteggio;
}

function vHistory(){
  const filter = VIEW.fdate || null;
  let sess = [...DB.sessions].sort((a,b)=>b.date.localeCompare(a.date));
  if (filter) sess = sess.filter(s=>dayKey(s.date)===filter);
  const rec = recordDay();
  const todayK = dayKey(new Date().toISOString());
  const todayN = DB.sessions.filter(s=>dayKey(s.date)===todayK).length;
  let motiv = '';
  if (rec){
    if (todayK===rec.day && rec.n>1) motiv = '🎉 <b>OGGI è il giorno record!</b> Ogni seduta in più alza l\'asticella.';
    else if (rec.n - todayN === 1) motiv = '🔥 <b>Manca 1 sola seduta</b> per eguagliare il record: chi è il prossimo?';
    else if (rec.n - todayN > 1 && todayN > 0) motiv = '💪 Oggi siamo a <b>'+todayN+'</b>: il record è a '+rec.n+'. Si può fare.';
  }
  return topbar('Storico sessioni','home') + `
    ${rec ? `<div class="recbar" onclick="VIEW.fdate='${rec.day}'; render()">
      🏆 <b>Giorno record: ${new Date(rec.day+'T12:00').toLocaleDateString('it-IT',{weekday:'long', day:'numeric', month:'long', year:'numeric'})}</b> — ${rec.n} sedut${rec.n===1?'a':'e'}
      ${motiv?`<div class="recmot">${motiv}</div>`:''}
    </div>`:''}
    ${filterBar(todayK, todayN, DB.sessions.length, filter, sess.length)}
    ${sess.length ? sess.map(s=>sessRow(s,{showClient:true})).join('') : '<p class="hint">Nessuna seduta '+(filter?'in questa data.':'registrata finora.')+'</p>'}`;
}

/* ---------- STATISTICHE ---------- */

  const period = VIEW.period ?? 30; /* 7 | 30 | 0 (tutto) */

  const inPeriod = s => period===0 || (now - new Date(s.date).getTime()) <= period*86400000;
  const sess = DB.sessions.filter(inPeriod);
  const days = period===0
    ? Math.max(1, new Set(DB.sessions.map(s=>dayKey(s.date))).size)
    : period;
  const activeClients = new Set(sess.map(s=>s.clientId)).size;
  const hcFull = sess.filter(s=>s.healthIn && s.healthOut).length;
  const hcPct = sess.length ? Math.round(hcFull/sess.length*100) : 0;
  const rec = recordDay();

  const bar = (label, n, max, color) => `
    <div class="sbar"><div class="sl"><span>${label}</span><b>${n}</b></div>
    <div class="st"><div class="sf" style="width:${max?Math.round(n/max*100):0}%; background:${color}"></div></div></div>`;

  const actMax = Math.max(1,...Object.values(byAct));

  const byFam = {};
  sess.forEach(s=>{ byFam[s.fam]=(byFam[s.fam]||0)+1; });
  const famMax = Math.max(1,...Object.values(byFam));

  const byClient = {};
  sess.forEach(s=>{ byClient[s.clientId]=(byClient[s.clientId]||0)+1; });
  const top = Object.entries(byClient).sort((a,b)=>b[1]-a[1]).slice(0,5);

  const inactive = DB.clients.map(c=>{
    const last = DB.sessions.filter(s=>s.clientId===c.id).sort((a,b)=>b.date.localeCompare(a.date))[0];
    return {c, last: last? new Date(last.date).getTime() : null};
  }).filter(x=>x.last && (now-x.last)>14*86400000)
    .sort((a,b)=>a.last-b.last).slice(0,5);

  return topbar('Statistiche','home') + `
    <div class="seg" style="justify-content:center; margin-bottom:6px">
      ${[[7,'Ultimi 7 giorni'],[30,'Ultimi 30 giorni'],[0,'Da sempre']].map(([v,l])=>`<span class="opt ${period===v?'on':''}" onclick="VIEW.period=${v}; render()">${l}</span>`).join('')}
    </div>

function salvaDomande(){
  if(hash(document.getElementById('dq_code').value) !== DB.codeHash){
    toast('Il Codice Zenith non è giusto'); return; }
  const qs=[], as=[];
  for(let i=0;i<3;i++){
    const q = document.getElementById('dq_q'+i).value.trim();
    const a = document.getElementById('dq_a'+i).value;
    if(!q || !normA(a)){ toast('Servono tutte e 3 le domande con la loro risposta'); return; }
    qs.push(q); as.push(a);
  }
  DB.secQ = qs.map((q,i)=>({q, aHash: hash(normA(as[i]))}));
  persist(); closeModal(); toast('Recupero impostato ✓ — custodisci le risposte'); render();
}

function exportCSV(kind){
  const period = VIEW.expP ?? 30;
  const now = Date.now();
  const inP = d => period===0 || (now - new Date(d).getTime()) <= period*86400000;
  const sep = ';';
  let rows = [];
  if (kind==='sessioni'){
    rows.push(['Data','Ora','Cliente','Codice Z','Programma','Nome programma','Famiglia','Attività','Zone','Obiettivo','Pressione','HC ingresso','HC uscita','Preferita','Nota preferita','Nota sessione'].join(sep));
    DB.sessions.filter(s=>inP(s.date)).sort((a,b)=>a.date.localeCompare(b.date)).forEach(s=>{
      const c = DB.clients.find(x=>x.id===s.clientId);
      const d = new Date(s.date);
      rows.push([
        csvCell(d.toLocaleDateString('it-IT')), csvCell(d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})),
        csvCell(c?c.nome+' '+c.cognome:'—'), csvCell(s.zCode), csvCell(s.prog),
        csvCell(PROGRAMS[s.prog]?PROGRAMS[s.prog].o:''), csvCell((ZFAM[s.fam]||{}).name||s.fam),
        csvCell(s.quiz&&s.quiz.activity||''), csvCell(s.quiz&&s.quiz.zones?s.quiz.zones.join(', '):(s.quiz&&s.quiz.zone||'')),
        csvCell(s.quiz&&s.quiz.goal||''), csvCell(s.quiz&&s.quiz.pressione||''),
        csvCell(s.healthIn?'SÌ':'no'), csvCell(s.healthOut?'SÌ':'no'),
        csvCell(s.fav?'⭐':''), csvCell(s.favNote||''), csvCell(s.notes||'')
      ].join(sep));
    });
  } else {
    rows.push(['Nome','Cognome','Prefisso','Telefono','Nascita','Genere','Attività','Livello','Punti','Sessioni totali','Ultima sessione','Idoneità','Anamnesi firmata'].join(sep));
    DB.clients.forEach(c=>{
      const sess = DB.sessions.filter(s=>s.clientId===c.id).sort((a,b)=>b.date.localeCompare(a.date));
      const last = sess[0];
      if (period!==0 && (!last || !inP(last.date))) return;
      const pts = clientPoints(c);
      rows.push([
        csvCell(c.nome), csvCell(c.cognome), csvCell(pfxDi(c)), csvCell(c.telefono), csvCell(fmtBirth(c.nascita)), csvCell(c.genere||''),
        csvCell((c.attivita||[]).join(', ')), csvCell(clientLevel(pts).name), csvCell(pts), csvCell(sess.length),
        csvCell(last?new Date(last.date).toLocaleDateString('it-IT'):'mai'),
        csvCell({ok:'idoneo', cert:'con certificato', blocked:'attesa certificato', no:'non idoneo'}[idoneita(c)]),
        csvCell(c.anamnesi&&c.anamnesi.firma?'SÌ':'no')
      ].join(sep));
    });
  }
  downloadFile('zenith-'+kind+'-'+new Date().toISOString().slice(0,10)+'.csv', rows.join('\r\n'), 'text/csv;charset=utf-8');
  toast('📄 Esportazione '+kind+' pronta ('+(rows.length-1)+' righe)');
}

/* Le schede non vengono piu' pareggiate a forza: con i dettagli a righe l'altezza
   e' gia' fissa, e l'unica differenza rimasta e' la nota — che quando c'e' merita
   la riga in piu' invece di gonfiare tutte le altre schede dell'elenco. */
/* Tiene ogni marker (cerchio/quadrato) col suo numero SEMPRE dentro alla schermata:
   se un marker sborda da un bordo lo si sposta appena verso l'interno. */
function clampMarkers(){
  const run = () => document.querySelectorAll('.shot').forEach(shot=>{
    const apply = () => {
      const W = shot.clientWidth, H = shot.clientHeight;
      if(!W || !H) return;
      const s = 1.14;   // margine per il battito (pulse) del marker
      const pad = 4;    // distanza minima dal bordo
      const over = 13;  // quanto il badge numerico sporge oltre l'anello (in alto e a destra)
      shot.querySelectorAll('.marker').forEach(mk=>{
        mk.style.marginLeft=''; mk.style.marginTop='';
        const R = mk.offsetWidth/2;
        const cx = mk.offsetLeft, cy = mk.offsetTop;
        const o = mk.querySelector('.mn') ? over : 0;
        const L = cx - R*s, Rr = cx + (R+o)*s, T = cy - (R+o)*s, B = cy + R*s;
        let dx=0, dy=0;
        if(L < pad) dx = pad - L; else if(Rr > W-pad) dx = (W-pad) - Rr;
        if(T < pad) dy = pad - T; else if(B > H-pad) dy = (H-pad) - B;
        if(dx) mk.style.marginLeft = Math.round(dx)+'px';
        if(dy) mk.style.marginTop  = Math.round(dy)+'px';
      });
    };
    const img = shot.querySelector('img');
    if(img && !img.complete) img.addEventListener('load', ()=>requestAnimationFrame(apply), {once:true});
    requestAnimationFrame(apply);
  });
  run();
}
window.addEventListener('resize', ()=>clampMarkers());

  'Il cliente ha fretta? Non tagliare il rituale: <b>taglia le chiacchiere</b>.',
  'Scrivi una cosa personale nelle note («maratona a ottobre»): <b>citarla la volta dopo fa magia</b>.',
  'La postura di chi entra parla prima del questionario: <b>spalle chiuse? Proponi collo & spalle</b>.',
  'Non dire mai «programma P08»: dì <b>«oggi ti alleggerisco le gambe»</b>. Il codice è per te, la sensazione è per lui.'
];
let MASCOT_N = 0;
function pokeMascot(){
  MASCOT_N++;
  if (VIEW.name==='lock' || VIEW.name==='quiz' || MASCOT_N % 3 !== 0) {
    document.getElementById('mascot').classList.remove('show');
    return;
  }
  const el = document.getElementById('mascot');
  document.getElementById('mascotmsg').innerHTML = MASCOT_TIPS[Math.floor(Math.random()*MASCOT_TIPS.length)];
  applyMascotPos(el);
  el.classList.add('show');
  clearTimeout(el._h); el._h = setTimeout(()=>el.classList.remove('show'), 9000);
}
/* la Z si può spostare: tieni premuto e trascina dove vuoi */
function applyMascotPos(el){
  let pos=null; try{ pos = JSON.parse(localStorage.getItem('zenithMascotPos')||'null'); }catch(e){}
  if(!pos) return;
  const w = el.offsetWidth||150, h = el.offsetHeight||60;
  const x = Math.max(6, Math.min(pos.x, innerWidth  - w - 6));
  const y = Math.max(6, Math.min(pos.y, innerHeight - h - 6));
  el.style.left = x+'px'; el.style.top = y+'px'; el.style.bottom='auto';
}
(function initMascotDrag(){
  const el = document.getElementById('mascot');
  if(!el) return;
  let drag=false, moved=false, dx=0, dy=0, hold=null;
  const start = e => {
    const t = e.touches ? e.touches[0] : e;
    const r = el.getBoundingClientRect();
    dx = t.clientX - r.left; dy = t.clientY - r.top; moved=false;
    hold = setTimeout(()=>{                       /* pressione prolungata: si "stacca" */
      drag=true; el.classList.add('dragging');
      clearTimeout(el._h);                        /* niente scomparsa mentre la sposti */
      if(navigator.vibrate) navigator.vibrate(12);
      el.style.left = r.left+'px'; el.style.top = r.top+'px'; el.style.bottom='auto';
    }, 220);
  };
  const move = e => {
    if(!drag){ if(hold){ clearTimeout(hold); hold=null; } return; }
    const t = e.touches ? e.touches[0] : e;
    moved = true;
    if(e.cancelable) e.preventDefault();
    const w = el.offsetWidth, h = el.offsetHeight;
    const x = Math.max(6, Math.min(t.clientX - dx, innerWidth  - w - 6));
    const y = Math.max(6, Math.min(t.clientY - dy, innerHeight - h - 6));
    el.style.left = x+'px'; el.style.top = y+'px';
  };
  const end = () => {
    if(hold){ clearTimeout(hold); hold=null; }
    if(!drag) return;
    drag=false; el.classList.remove('dragging');
    const r = el.getBoundingClientRect();
    try{ localStorage.setItem('zenithMascotPos', JSON.stringify({x:Math.round(r.left), y:Math.round(r.top)})); }catch(e){}
    el._h = setTimeout(()=>el.classList.remove('show'), 9000);
    if(moved) toast('📌 Zenith spostato qui');
  };
  el.addEventListener('mousedown', start);   el.addEventListener('touchstart', start, {passive:true});
  addEventListener('mousemove', move);       addEventListener('touchmove', move, {passive:false});
  addEventListener('mouseup', end);          addEventListener('touchend', end);
  /* il tocco semplice chiude il fumetto, il trascinamento no */
  el.addEventListener('click', e => { if(moved){ e.stopPropagation(); moved=false; return; } el.classList.remove('show'); });
})();

/* ---------- LA BARRA IN ALTO ----------
   Si ritira scorrendo in giu' e torna al primo accenno di risalita, cosi mentre si
   legge la pagina e' tutta libera ma i comandi si riprendono col gesto che si farebbe
   comunque. L'accumulo serve perche' un dito produce decine di piccoli scorrimenti:
   guardare il singolo evento farebbe sfarfallare la barra. */
const TB_SOGLIA = 90;    /* prima di questo punto la barra resta sempre visibile */
const TB_SCATTO = 12;    /* quanto si deve scorrere di seguito perche' cambi stato */
let TB_ULTIMO = 0, TB_ACC = 0;
function aggiornaBarra(){
  const root = document.documentElement;
  const y = Math.max(0, window.scrollY);
  root.classList.toggle('tb-giu', y > 8);
  const d = y - TB_ULTIMO;
  /* l'accumulo riparte da capo ogni volta che si inverte il verso */
  TB_ACC = (d > 0) === (TB_ACC > 0) ? TB_ACC + d : d;
  TB_ULTIMO = y;
  if(y <= TB_SOGLIA)        root.classList.remove('tb-via');
  else if(TB_ACC >  TB_SCATTO) root.classList.add('tb-via');
  else if(TB_ACC < -TB_SCATTO) root.classList.remove('tb-via');
  /* «↑ Indice» segue la barra in alto: sparisce mentre si legge scendendo,
     ricompare appena si risale — cioe' proprio quando si sta cercando qualcosa. */
  const gt = document.getElementById('gtop');
  if(gt) gt.classList.toggle('on', y > 620 && !root.classList.contains('tb-via'));
}
window.addEventListener('scroll', aggiornaBarra, {passive:true});

/* ---------- CAPITOLI ----------
   Un titolo e il contenuto che gli appartiene formano un solo rettangolo: cosi
   due capitoli di fila non si confondono. Si fa qui, una volta sola dopo ogni
   disegno, invece di riscrivere trenta viste. */
const CAP_STOP = ['bnav', 'actionbar', 'pagefoot'];
function raggruppaCapitoli(){
  document.querySelectorAll('#app h2').forEach(h=>{
    /* un titolo dentro un riquadro e' un sottotitolo, non un capitolo */
    if(h.closest('.card') || h.closest('.cap')) return;
    const box = document.createElement('div');
    box.className = 'cap';
    const mira = h.getAttribute('data-mira');
    if(mira) box.id = 'mira_' + mira;
    h.parentNode.insertBefore(box, h);
    const testa = document.createElement('div');
    testa.className = 'cap-h';
    while(h.firstChild) testa.appendChild(h.firstChild);
    box.appendChild(testa);
    const corpo = document.createElement('div');
    corpo.className = 'cap-b';
    box.appendChild(corpo);
    let n = h.nextSibling;
    h.remove();
    while(n){
      if(n.nodeType===1 && (n.tagName==='H2' ||
         CAP_STOP.some(c=>n.classList.contains(c)))) break;
      const dopo = n.nextSibling;
      corpo.appendChild(n);
      n = dopo;
    }
  });
}
